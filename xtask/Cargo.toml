[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Development task runner for Praxis AI"
license.workspace = true
repository.workspace = true
readme = "../README.md"
publish = false

[features]
# Developer commands run the proxy and read the OpenAI registries. The
# FIPS runtime probe runs without these features.
default = ["dev"]
dev = [
    "pins",
    "dep:chrono",
    "dep:praxis-ai",
    "dep:praxis-ai-apis",
    "dep:praxis-core",
    "dep:praxis-test-utils",
    "dep:quote",
    "dep:reqwest",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:syn",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "praxis-ai/full",
    "praxis-ai-apis/full",
    "praxis-test-utils/full",
]
# `check-pins` alone: parses the pin manifests without compiling the proxy, so
# the GPU workflow's `pins` job stays fast.
pins = ["dep:toml"]
# Opt-in experimental OpenAI implementations used by conformance reports and
# developer proxies. Does not affect default workspace builds.
openai-all = ["dev", "praxis-ai/openai-all", "praxis-ai-apis/openai-all", "praxis-test-utils/openai-all"]
# The previous name of the dev feature set, kept for callers.
full = ["dev"]
store-postgres = ["dev", "praxis-ai/store-postgres", "praxis-ai-apis/store-postgres", "praxis-test-utils/store-postgres"]
store-postgres-cert-auth = [
    "dep:praxis-ai",
    "dep:praxis-ai-apis",
    "dep:praxis-test-utils",
    "praxis-ai/store-postgres-cert-auth",
    "praxis-ai-apis/store-postgres-cert-auth",
    "praxis-test-utils/store-postgres-cert-auth",
]
store-sqlite = ["dev", "praxis-ai/store-sqlite", "praxis-ai-apis/store-sqlite", "praxis-test-utils/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, optional = true }
clap = { workspace = true }
openssl = { workspace = true }
praxis-ai = { path = "../server", package = "praxis-ai-proxy", default-features = false, optional = true }
praxis-ai-apis = { workspace = true, optional = true }
praxis-core = { workspace = true, optional = true }
praxis-test-utils = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
tempfile = { workspace = true }
toml = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
