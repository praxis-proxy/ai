[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Development task runner for Praxis AI"
license.workspace = true
repository.workspace = true
readme = "../README.md"
publish = false

[features]
default = ["store-postgres"]
store-postgres = ["praxis-ai/store-postgres", "praxis-ai-apis/store-postgres", "praxis-test-utils/store-postgres"]
store-sqlite = ["praxis-ai/store-sqlite", "praxis-ai-apis/store-sqlite", "praxis-test-utils/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
praxis-ai = { path = "../server", package = "praxis-ai-proxy", default-features = false }
praxis-ai-apis = { workspace = true }
praxis-core = { workspace = true }
praxis-test-utils = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
