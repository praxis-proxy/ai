[package]
name = "praxis-ai-filters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "AI filter implementations for Praxis"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "praxis_ai_filters"

[features]
default = ["apis"]
apis = ["praxis-ai-apis/default"]
# Experimental: the generic http_callout filter. Work in progress; the config
# surface may change. Activates the `experimental` marker.
http-callout-filter = ["experimental"]
# Experimental: the azure_ad (Entra ID) upstream authentication filter. Work in
# progress; the config surface may change. Activates the `experimental` marker.
azure-ad-filter = ["experimental"]
# Experimental: the gcp_adc (Application Default Credentials) upstream
# authentication filter. Work in progress; the config surface may change.
# Activates the `experimental` marker.
gcp-adc-filter = ["experimental"]
# Experimental: the token_rate_limit filter. Its parent proposal
# (00121_token-rate-limiting in praxis-proxy/enhancements) is not yet
# `accepted`, and open design questions remain (bucket-keying strategy,
# HA/clustered-Valkey failure modes, how this relates to Kuadrant's
# TokenRateLimitPolicy) -- see ai#796. Activates the `experimental` marker.
# Also pulls in `redis` and `thiserror`, which only this filter uses --
# optional so the rest of the crate (and its consumers) don't compile the
# Valkey client and its transitive deps unless this feature is on.
token-rate-limit-filter = ["experimental", "dep:redis", "dep:thiserror"]
# Marker feature activated transitively by any experimental feature, mirroring
# praxis core's server crate. Lets consumers gate on "anything experimental".
experimental = []
opentelemetry = []
praxis-main = []

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
notify = { workspace = true }
pingora-core.workspace = true
praxis-ai-apis = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
redis = { workspace = true, optional = true }
reqwest.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
serde_json_path = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
metrics-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock = { workspace = true }
