[package]
name = "praxis-ai-filters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "AI filter implementations for Praxis"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "praxis_ai_filters"

[features]
default = ["standard"]
# Default-on filters that sit behind a gate so minimal builds can drop them.
standard = ["aws-sigv4-filter", "policy-engine"]
# The `policy` filter from Praxis core. Kept explicit so no-default FIPS builds
# can omit the policy engine and its pure-Rust cryptography.
policy-engine = ["praxis-filter/policy-engine"]
# aws_sigv4_sign: AWS Signature V4 request signing (aws-sigv4).
aws-sigv4-filter = ["dep:aws-sigv4", "dep:aws-credential-types"]
# Backwards-compatible alias for the previous default, which built every
# non-experimental filter.
apis = ["full"]
# Opt-in OpenAI filter groups; see praxis-ai-apis for what each one contains.
openai-responses = ["praxis-ai-apis/openai-responses"]
openai-file-resolve-filter = ["openai-responses", "praxis-ai-apis/openai-file-resolve-filter"]
store = ["openai-responses", "praxis-ai-apis/store"]
store-postgres = ["store", "praxis-ai-apis/store-postgres"]
store-sqlite = ["store", "praxis-ai-apis/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]
openai-conversations = ["store", "praxis-ai-apis/openai-conversations"]
openai-compact = ["store", "praxis-ai-apis/openai-compact"]
openai-mcp-tools = ["store", "praxis-ai-apis/openai-mcp-tools"]
# Every OpenAI group, without choosing a store backend.
openai-all = ["openai-file-resolve-filter", "openai-conversations", "openai-compact", "openai-mcp-tools"]
# Every non-experimental filter; equals the pre-feature-split capability.
full = ["standard", "openai-all", "store-postgres"]
# Experimental: the generic http_callout filter. Work in progress; the config
# surface may change. Activates the `experimental` marker.
http-callout-filter = ["experimental", "dep:serde_json_path"]
# Experimental: the azure_ad (Entra ID) upstream authentication filter. Work in
# progress; the config surface may change. Activates the `experimental` marker.
azure-ad-filter = ["experimental", "dep:reqwest"]
# Experimental: the gcp_adc (Application Default Credentials) upstream
# authentication filter. Work in progress; the config surface may change.
# Activates the `experimental` marker.
gcp-adc-filter = ["experimental", "dep:reqwest"]
# Experimental: the token_rate_limit filter. Its parent proposal
# (00121_token-rate-limiting in praxis-proxy/enhancements) is not yet
# `accepted`, and open design questions remain (bucket-keying strategy,
# HA/clustered-Valkey failure modes, how this relates to Kuadrant's
# TokenRateLimitPolicy) -- see ai#796. Activates the `experimental` marker.
# Also pulls in `redis` and `thiserror`, which only this filter uses --
# optional so the rest of the crate (and its consumers) don't compile the
# Valkey client and its transitive deps unless this feature is on.
token-rate-limit-filter = ["experimental", "dep:redis", "dep:thiserror"]
# Marker feature activated transitively by any experimental feature, mirroring
# praxis core's server crate. Lets consumers gate on "anything experimental".
experimental = []
opentelemetry = []
praxis-main = ["praxis-ai-apis/praxis-main"]

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
notify = { workspace = true }
percent-encoding = { workspace = true }
praxis-ai-apis = { workspace = true }
praxis-core = { workspace = true }
# chain-binding: ChainBindingContext for register.rs outbound-chain wiring.
# Off-by-default experimental feature in praxis 0.7.0 (no extra dependencies).
praxis-filter = { workspace = true, features = ["chain-binding"] }
praxis-tls = { workspace = true }
redis = { workspace = true, optional = true }
rand = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
serde_json_path = { workspace = true, optional = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
metrics-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock = { workspace = true }
