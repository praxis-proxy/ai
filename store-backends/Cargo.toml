[package]
name = "praxis-ai-store-backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "praxis_ai_store_backends"

[features]
# The SQL client crypto (sqlx TLS) is compiled in only when a backend is
# selected. A consumer that omits this crate ships no SQL crypto at all.
default = ["all"]
# Internal implementation marker shared by both PostgreSQL profiles. Do not
# enable directly; select one of the public features below.
_postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-native-tls"]
# General-purpose PostgreSQL profile: preserves password authentication.
postgres = ["_postgres", "sqlx/postgres-password-auth"]
# Certificate-only PostgreSQL profile: omits SQLx password-authentication
# crypto and requires `require_certificate_authentication: true` at runtime.
postgres-cert-auth = ["_postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
all = ["postgres", "sqlite"]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
percent-encoding = { workspace = true }
praxis-ai-store = { workspace = true, features = ["compression"] }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "net"] }
tracing = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true }
praxis-ai-store = { workspace = true, features = ["test-support"] }
praxis-ai-store-lifecycle = { path = "../store-lifecycle" }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
