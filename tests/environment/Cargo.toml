[package]
name = "praxis-tests-environment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "llm-d environment integration tests for Praxis AI"

[features]
# The environment tests exercise only the llm-d ext_proc path, so no AI filter
# group is needed by default.
default = []
store-postgres = ["praxis-ai-proxy/store-postgres", "praxis-test-utils/store-postgres"]
store-sqlite = ["praxis-ai-proxy/store-sqlite", "praxis-test-utils/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]
llmd-ext-proc = ["praxis-ai-proxy/llmd-ext-proc", "praxis-test-utils/llmd-ext-proc"]

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite/main.rs"
harness = true
required-features = ["llmd-ext-proc"]

[dev-dependencies]
praxis-ai-proxy = { workspace = true }
praxis-core = { workspace = true }
praxis-test-utils = { workspace = true }
serde_json = { workspace = true }
