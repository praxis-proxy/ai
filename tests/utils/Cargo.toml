[package]
name = "praxis-test-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[features]
# Feature passthroughs mirroring praxis-ai-proxy (see its Cargo.toml). The
# default is `full` so a plain `cargo test -p <crate>` exercises every filter.
default = ["full"]
standard = ["praxis-ai-proxy/standard"]
openai-responses = ["praxis-ai-proxy/openai-responses"]
openai-file-resolve-filter = ["openai-responses", "praxis-ai-proxy/openai-file-resolve-filter"]
store = ["openai-responses", "praxis-ai-proxy/store", "praxis-ai-apis/store"]
store-postgres = ["store", "praxis-ai-proxy/store-postgres", "praxis-ai-apis/store-postgres"]
store-sqlite = ["store", "praxis-ai-proxy/store-sqlite", "praxis-ai-apis/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]
openai-conversations = ["store", "praxis-ai-proxy/openai-conversations"]
openai-compact = ["store", "praxis-ai-proxy/openai-compact"]
openai-mcp-tools = ["store", "praxis-ai-proxy/openai-mcp-tools"]
openai-all = ["openai-file-resolve-filter", "openai-conversations", "openai-compact", "openai-mcp-tools"]
full = ["standard", "openai-all", "store-postgres"]
llmd-ext-proc = [
    "praxis-ai-proxy/llmd-ext-proc",
    "dep:praxis-ai-llmd-ext-proc",
    "dep:tokio-stream",
    "dep:tonic",
]
praxis-main = ["praxis-ai-proxy/praxis-main"]

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true }
praxis = { workspace = true }
praxis-ai-apis = { workspace = true }
praxis-ai-proxy = { workspace = true }
praxis-ai-llmd-ext-proc = { workspace = true, optional = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-protocol = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
pingora-core = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "process"] }
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

# The tenant proxy serves the Conversations API, so it needs that filter group.
[[example]]
name = "conversations_tenant_proxy"
required-features = ["openai-conversations"]
