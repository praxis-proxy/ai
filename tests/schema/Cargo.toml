[package]
name = "praxis-tests-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[features]
default = ["store-postgres", "callout-rustls"]
store-postgres = ["praxis-test-utils/store-postgres"]
store-sqlite = ["praxis-test-utils/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]
callout-rustls = ["praxis-test-utils/callout-rustls"]
callout-native-tls = ["praxis-test-utils/callout-native-tls"]
praxis-main = ["praxis-test-utils/praxis-main"]

[lints]
workspace = true

[dev-dependencies]
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-test-utils = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
