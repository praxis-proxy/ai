[package]
name = "praxis-tests-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[features]
# Feature passthroughs mirroring praxis-ai-proxy (see its Cargo.toml). The
# default is `full`; experimental filter suites require explicit opt-in.
default = ["full"]
standard = ["praxis-test-utils/standard"]
# The signing filter alone, so the FIPS suite run can enable exactly the
# feature set the FIPS binary ships (see FIPS_FEATURES in the Makefile).
aws-sigv4-filter = ["praxis-test-utils/aws-sigv4-filter"]
openai-responses = ["experimental", "praxis-test-utils/openai-responses"]
# Experimental ephemeral agent orchestration; separate from Responses support.
openai-agentic-loop = ["openai-responses", "experimental", "praxis-test-utils/openai-agentic-loop"]
openai-file-resolve-filter = ["openai-responses", "praxis-test-utils/openai-file-resolve-filter"]
store = ["openai-responses", "praxis-test-utils/store"]
store-postgres = ["store", "praxis-test-utils/store-postgres"]
store-postgres-cert-auth = ["store", "praxis-test-utils/store-postgres-cert-auth"]
store-sqlite = ["store", "praxis-test-utils/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]
openai-conversations = ["store", "praxis-test-utils/openai-conversations"]
openai-compact = ["store", "praxis-test-utils/openai-compact"]
openai-mcp-tools = ["store", "praxis-test-utils/openai-mcp-tools"]
openai-all = ["openai-agentic-loop", "openai-file-resolve-filter", "openai-conversations", "openai-compact", "openai-mcp-tools"]
full = ["standard"]
# Passive marker; experimental capabilities remain individually selected.
experimental = ["praxis-test-utils/experimental"]
praxis-main = ["praxis-test-utils/praxis-main"]

[lints]
workspace = true

[dev-dependencies]
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-test-utils = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
