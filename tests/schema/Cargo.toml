[package]
name = "praxis-tests-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[features]
# Feature passthroughs mirroring praxis-ai-proxy (see its Cargo.toml). The
# default is `full` so a plain `cargo test -p <crate>` exercises every filter;
# lean runs use `--no-default-features --features standard`.
default = ["full"]
standard = ["praxis-test-utils/standard"]
openai-responses = ["praxis-test-utils/openai-responses"]
openai-file-resolve-filter = ["openai-responses", "praxis-test-utils/openai-file-resolve-filter"]
store = ["openai-responses", "praxis-test-utils/store"]
store-postgres = ["store", "praxis-test-utils/store-postgres"]
store-sqlite = ["store", "praxis-test-utils/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]
openai-conversations = ["store", "praxis-test-utils/openai-conversations"]
openai-compact = ["store", "praxis-test-utils/openai-compact"]
openai-mcp-tools = ["store", "praxis-test-utils/openai-mcp-tools"]
openai-all = ["openai-file-resolve-filter", "openai-conversations", "openai-compact", "openai-mcp-tools"]
full = ["standard", "openai-all", "store-postgres"]
praxis-main = ["praxis-test-utils/praxis-main"]

[lints]
workspace = true

[dev-dependencies]
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-test-utils = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
