# Claude Code + vLLM acceptance pin manifest (issue #1025)
#
# This is the single source of truth for the pinned `claude-code-native-vllm`
# acceptance test (`tests/integration/tests/suite/claude_code_vllm.rs`) and its
# CI job (`.github/workflows/vllm-integration.yaml`). Every value here is
# reproducibility-critical: the test proves a pinned real Claude Code executable
# completes a deterministic coding task against a pinned real vLLM backend on two
# Praxis paths — one NATIVE (Anthropic Messages forwarded unchanged) and one
# TRANSFORMED (Anthropic Messages translated into OpenAI Chat Completions) —
# under both the deterministic acceptEdits baseline and client-initiated auto
# mode. One vLLM container serves both surfaces (`/v1/messages` natively AND
# `/v1/chat/completions`), so all four scenarios share this single pinned model.
#
# The GPU acceptance job (`vllm-gpu-claude-acceptance`) reuses the ephemeral EC2
# GPU runner and the Qwen3-8B weights the full suite already warmed on-disk. A
# lightweight `pins` job parses this manifest and exports its runtime values.
# The acceptance job runs nightly and can also be dispatched independently.
# `model_revision` is documentary and intentionally NOT a launch flag.

[claude_code]
# Version substring asserted from `claude --version`. Keep in sync with
# CLAUDE_CODE_VERSION in claude_code_vllm.rs. 2.1.278 is the current published
# latest (npm dist-tags.latest and the anthropics/claude-code CHANGELOG head);
# it clears the intermediate 2.1.265-2.1.267 and 2.1.275 self-hosted
# ANTHROPIC_BASE_URL regressions that returned blanket HTTP 400s.
version = "2.1.278"
# Platform triple the pinned archive targets (e.g. "x86_64-unknown-linux-gnu").
platform = "x86_64-unknown-linux-gnu"
# Download URL for the pinned executable. Native Claude Code binaries are served
# per-version from downloads.claude.ai; "linux-x64" is the glibc x86_64 slug that
# corresponds to the platform triple above. The matching sha256 is published at
# https://downloads.claude.ai/claude-code-releases/2.1.278/manifest.json
# (.platforms["linux-x64"].checksum) and is verified against the download in CI.
url = "https://downloads.claude.ai/claude-code-releases/2.1.278/linux-x64/claude"
# SHA-256 of the downloaded executable; CI verifies this before running.
sha256 = "5c4735937844e84f8a93306e841a5b0e12252909b07870f789b190468da147ab"

# Pinned launch setup (excluding `-p`, the prompt, `--model`, and
# `--mcp-config`, which the test supplies from the workspace). Keep in sync with
# PermissionScenario and LAUNCH_FLAGS in claude_code_vllm.rs. Re-validate every
# value against the pinned executable when its version changes.
[claude_code.launch]
exposed_tools = [
  "Read",
  "Edit",
  "Bash",
]
# The baseline preapproves all exposed tools. The auto-mode scenarios preapprove
# none, so Edit and Bash must pass through Claude Code's classifier.
baseline_permission_mode = "acceptEdits"
baseline_allowed_tools = ["Read", "Edit", "Bash"]
auto_permission_mode = "auto"
# Praxis/vLLM does not implement Anthropic's server-side classifier protocol.
# Force Claude Code to initiate classifier model requests through Praxis.
auto_mode_server = "0"
# Claude Code 2.1.278 otherwise asks for 32K output tokens. Pin its supported
# environment overrides to the real vLLM window so the request is valid without
# overcommitting the 24GB GPU. The acceptance task needs only short tool calls
# and a final summary.
max_output_tokens = 2048
# Keep Claude Code's normal planning context so it does not compact after each
# small tool result. Actual requests remain bounded by the 16K vLLM window and
# the separate 2K output cap above.
max_context_tokens = 32768
flags = [
  "--tools", "Read,Edit,Bash",
  "--strict-mcp-config",
  "--output-format", "stream-json",
  "--verbose",
  "--max-turns", "8",
]

[vllm]
# Container image pinned by digest — the SAME CUDA image the GPU full suite runs
# (env.VLLM_GPU_IMAGE in .github/workflows/vllm-integration.yaml). vLLM v0.29.0
# serves the native Anthropic Messages surface (`/v1/messages`,
# `/v1/messages/count_tokens`) by default, in addition to `/v1/chat/completions`,
# so one container backs both the native and transformed acceptance paths with no
# extra flag. Qwen3-8B on the A10G (24GB) is the capable model the full suite is
# already green with; the 0.6B CPU model cannot drive Claude Code's tool use.
image = "docker.io/vllm/vllm-openai:v0.29.0-cu129@sha256:7ef5a35d1ef8ce2cf9d671dd91eec6e367c5849262e0362b4d3d4a26be0d87d2"
# Exact served model name. Set via `--served-model-name`; every model-selection
# surface in the test (--model and the ANTHROPIC_*_MODEL env vars) pins this. A
# slash-free ALIAS is used deliberately: vLLM's Anthropic client surface cannot
# address a model name containing "/", and Claude Code addresses that surface.
# The weights load from the Qwen/Qwen3-8B repo (see [vllm.launch]) and are served
# under this alias. VALIDATE the alias resolves for Claude Code during qualification.
served_model_name = "qwen3-8b"
# HF commit the served weights resolve to. Recorded for reproducibility during
# qualification (`curl https://huggingface.co/api/models/Qwen/Qwen3-8B | jq -r .sha`,
# or the snapshot commit-hash dir under the warmed HF cache). Left TBD because a
# qualification dispatch runs before the revision is known; it is NOT an exported
# pin, so it does not gate the nightly. A follow-up may additionally pass
# `--revision <sha>` once recorded.
model_revision = "TBD-at-qualification"
# Serving parameters (mirror the GPU full suite).
tool_call_parser = "hermes"
context_length = 16384
seed = 0

# vLLM launch flags recorded for reproducibility, mirroring the GPU full suite's
# launch so both jobs load identical Qwen3-8B weights from the shared on-disk HF
# cache. Native Anthropic Messages serving is on by default in this image; no
# extra flag enables it, and the default OpenAI Chat Completions surface remains
# available for the transformed path. Thinking is disabled by default for this
# deterministic coding task: otherwise Qwen3 can consume the entire Claude Code
# turn budget reasoning about which tool to call without issuing the call.
#
# `--model` is REQUIRED: without it vLLM has no weights to load and never becomes
# ready. Do NOT add `--served-model-name` or `--api-key` here; the CI container
# run appends both separately (from `served_model_name` above and the
# per-job ephemeral VLLM_API_KEY), and duplicating them would pass the flag twice.
[vllm.launch]
flags = [
  "--model", "Qwen/Qwen3-8B",
  "--max-model-len", "16384",
  "--enable-auto-tool-choice",
  "--tool-call-parser", "hermes",
  "--reasoning-parser", "qwen3",
  "--default-chat-template-kwargs", '{"enable_thinking":false}',
  "--gpu-memory-utilization", "0.9",
  "--seed", "0",
]

# Allowed startup request matrix. Both acceptance flows reach vLLM over these
# prefixes: the native path forwards `/v1/messages` unchanged, and the
# transformed path rewrites `/v1/messages` to `/v1/chat/completions`. `/v1/models`
# and `/health` cover model discovery and readiness. Any other path is a
# documented nonfatal 404.
[startup_matrix]
allowed_prefixes = ["/v1/messages", "/v1/chat/completions", "/v1/models", "/health"]
