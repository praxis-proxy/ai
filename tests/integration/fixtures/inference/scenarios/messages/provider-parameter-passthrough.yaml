version: 1
id: messages/provider-parameter-passthrough
description: Unmapped request fields reach the Chat backend untouched, while metadata.user_id, output_config, and a text-only system history message are mapped.
protocol: anthropic_messages
example_config: anthropic/messages-to-openai.yaml
upstream_authority: 127.0.0.1:8000
features:
  - messages.request.provider_parameter_passthrough
  - messages.request.empty_citations
  - messages.request.system_history
turns:
  - name: initial
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: false
          top_k: 40
          metadata:
            user_id: user-1
          output_config:
            effort: high
            format:
              type: json_schema
              schema:
                type: object
                properties:
                  answer:
                    type: string
                required:
                  - answer
                additionalProperties: false
          messages:
            - role: system
              content:
                - type: text
                  text: Be concise.
            - role: user
              content:
                - type: text
                  text: What is 2+2? Reply with just the number.
                  citations: []
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
