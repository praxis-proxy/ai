version: 1
id: messages/provider-parameter-passthrough
description: Unmapped Anthropic request fields reach the Chat Completions backend untouched, metadata.user_id and output_config are mapped, and thinking is dropped.
protocol: anthropic_messages
example_config: anthropic/messages-to-openai.yaml
upstream_authority: 127.0.0.1:8000
features:
  - messages.request.provider_parameter_passthrough
turns:
  - name: initial
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: false
          top_k: 40
          thinking:
            type: enabled
            budget_tokens: 1024
          metadata:
            user_id: user-1
          output_config:
            effort: high
            format:
              type: json_schema
              schema:
                type: object
                properties:
                  answer:
                    type: string
                required:
                  - answer
                additionalProperties: false
          messages:
            - role: user
              content: What is 2+2? Reply with just the number.
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
