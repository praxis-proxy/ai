version: 1
id: messages/native-basic-stream
description: Minimal streaming Anthropic Messages request passed through to a native backend.
protocol: anthropic_messages
example_config: anthropic/messages-protocol.yaml
upstream_authority: 127.0.0.1:3001
features:
  - messages.native.request
  - messages.native.response.text
turns:
  - name: initial
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 16
          stream: true
          messages:
            - role: user
              content: Reply with exactly `hello` and nothing else.
    expect:
      client_status: 200
      client_body_kind: sse
      upstream_path: /v1/messages
      upstream_body_kind: json
      client_sse_events:
        - message_start
        - content_block_start
        - content_block_delta
        - content_block_stop
        - message_delta
        - message_stop
      client_sse_repeatable_events:
        - content_block_delta
      client_sse_interleaved_events:
        - ping
      upstream_sse_events:
        - message_start
        - content_block_start
        - content_block_delta
        - content_block_stop
        - message_delta
        - message_stop
      upstream_sse_repeatable_events:
        - content_block_delta
      upstream_sse_interleaved_events:
        - ping
