version: 1
id: messages/tool-result-image
description: Images nested in tool_result content are rejected before translation, even for an image-capable selected cluster.
protocol: anthropic_messages
example_config: anthropic/messages-to-openai.yaml
upstream_authority: 127.0.0.1:8000
features:
  - messages.request.tool_result_image_rejection
turns:
  - name: initial
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: false
          messages:
            - role: user
              content:
                - type: tool_result
                  tool_use_id: call_1
                  content:
                    - type: text
                      text: chart rendered
                    - type: image
                      source:
                        type: base64
                        media_type: image/png
                        data: iVBORw0KGgo=
    expect:
      client_status: 400
      client_body_kind: json
      upstream_path: ""
      upstream_body_kind: empty
      client_sse_events: []
      upstream_sse_events: []
