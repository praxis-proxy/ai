version: 1
id: messages/invalid-tool-id
description: Chat Completions tool_call with a schema-invalid id becomes an HTTP 500 Anthropic API error.
protocol: anthropic_messages
example_config: anthropic/messages-to-openai.yaml
upstream_authority: 127.0.0.1:8000
features:
  - messages.response.invalid_tool_id
turns:
  - name: initial
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
        x-request-id:
          - req_invalid_tool
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: false
          messages:
            - role: user
              content: Use the weather tool.
    expect:
      client_status: 500
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
