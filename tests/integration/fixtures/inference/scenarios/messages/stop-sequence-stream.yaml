version: 1
id: messages/stop-sequence-stream
description: A client stop sequence matched by the backend is reported in the streaming message_delta as stop_reason stop_sequence with the matched value.
protocol: anthropic_messages
example_config: anthropic/messages-to-openai.yaml
upstream_authority: 127.0.0.1:8000
features:
  - messages.response.stop_sequence
turns:
  - name: initial
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: true
          temperature: 0
          stop_sequences:
            - ","
          messages:
            - role: user
              content: List the first five prime numbers separated by commas, nothing else.
    expect:
      client_status: 200
      client_body_kind: sse
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events:
        - message_start
        - content_block_start
        - content_block_delta
        - content_block_stop
        - message_delta
        - message_stop
      client_sse_repeatable_events:
        - content_block_delta
      upstream_sse_events: []
