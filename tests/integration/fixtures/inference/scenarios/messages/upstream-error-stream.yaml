version: 1
id: messages/upstream-error-stream
description: Streaming upstream rate-limit error normalized to a single Anthropic error.
protocol: anthropic_messages
example_config: anthropic/messages-to-openai.yaml
upstream_authority: 127.0.0.1:8000
features:
  - messages.error.upstream_stream
turns:
  - name: initial
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: true
          messages:
            - role: user
              content: What is 2+2? Reply with just the number.
    expect:
      client_status: 429
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
