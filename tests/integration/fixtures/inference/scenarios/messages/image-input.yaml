version: 1
id: messages/image-input
description: An image-capable selected cluster receives base64 and url message images as Chat Completions image_url parts.
protocol: anthropic_messages
example_config: anthropic/messages-to-openai.yaml
upstream_authority: 127.0.0.1:8000
features:
  - messages.request.image_input
turns:
  - name: initial
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: false
          messages:
            - role: user
              content:
                - type: image
                  source:
                    type: base64
                    media_type: image/png
                    data: iVBORw0KGgo=
                - type: image
                  source:
                    type: url
                    url: https://images.example.test/chart.png
                - type: text
                  text: Compare the two charts.
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
