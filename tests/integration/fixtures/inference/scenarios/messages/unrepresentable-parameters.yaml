version: 1
id: messages/unrepresentable-parameters
description: Request fields whose effect the translated response cannot report fail closed instead of being silently dropped or forwarded.
protocol: anthropic_messages
example_config: anthropic/messages-to-openai.yaml
upstream_authority: 127.0.0.1:8000
features:
  - messages.request.unrepresentable_parameters
turns:
  - name: inference_geo
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: false
          inference_geo: us
          messages:
            - role: user
              content: What is 2+2? Reply with just the number.
    expect:
      client_status: 400
      client_body_kind: json
      upstream_path: ""
      upstream_body_kind: empty
      client_sse_events: []
      upstream_sse_events: []
  - name: n
    request:
      method: POST
      path: /v1/messages
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          max_tokens: 64
          stream: false
          n: 2
          messages:
            - role: user
              content: What is 2+2? Reply with just the number.
    expect:
      client_status: 400
      client_body_kind: json
      upstream_path: ""
      upstream_body_kind: empty
      client_sse_events: []
      upstream_sse_events: []
