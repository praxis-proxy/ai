version: 1
id: vertex/fallback-response-id
description: Generate distinct completion IDs when Vertex omits responseId and retain one ID across stream chunks.
protocol: openai_chat_completions
example_config: vertex/chat-completions-to-gemini.yaml
upstream_authority: 127.0.0.1:3000
features:
  - vertex.gemini.response.fallback_id
turns:
  - name: finite-missing-response-id
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          messages:
            - role: user
              content: Hi
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/projects/my-gcp-project/locations/us-central1/publishers/google/models/synthetic-vertex-model:generateContent
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
  - name: finite-missing-response-id-repeat
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          messages:
            - role: user
              content: Hi again
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/projects/my-gcp-project/locations/us-central1/publishers/google/models/synthetic-vertex-model:generateContent
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
  - name: streaming-missing-response-id
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          messages:
            - role: user
              content: Hi
          stream: true
    expect:
      client_status: 200
      client_body_kind: sse
      upstream_path: /v1/projects/my-gcp-project/locations/us-central1/publishers/google/models/synthetic-vertex-model:streamGenerateContent?alt=sse
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
