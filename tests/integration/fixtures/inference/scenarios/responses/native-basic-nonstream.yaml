version: 1
id: responses/native-basic-nonstream
description: Minimal non-streaming OpenAI Responses request passed through to a native backend.
protocol: openai_responses
example_config: openai/responses/responses-proxy.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.native.request
  - responses.native.response.text
turns:
  - name: initial
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input: Reply with exactly `4` and nothing else.
          max_output_tokens: 16
          store: false
          stream: false
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/responses
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
