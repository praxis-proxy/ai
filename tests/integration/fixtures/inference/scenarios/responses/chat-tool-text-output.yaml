version: 1
id: responses/chat-tool-text-output
description: Structured Responses function output text reaches the Chat backend as tool text.
protocol: openai_responses
example_config: openai/responses/responses-to-chat-completions.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.chat.tools.text_output
turns:
  - name: text-output
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input:
            - type: function_call
              call_id: call_1
              name: lookup
              arguments: "{}"
            - type: function_call_output
              call_id: call_1
              output:
                - type: input_text
                  text: "first "
                - type: input_text
                  text: result
          store: false
          stream: false
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
