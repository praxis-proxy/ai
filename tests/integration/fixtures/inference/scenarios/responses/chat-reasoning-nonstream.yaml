version: 1
id: responses/chat-reasoning-nonstream
description: >-
  Finite OpenAI Responses request translated to Chat Completions against a
  vLLM-style backend that returns raw reasoning in message.reasoning,
  promoted to a Responses reasoning output item.
protocol: openai_responses
example_config: openai/responses/responses-to-chat-completions-reasoning.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.chat.reasoning.request
  - responses.chat.reasoning.response
turns:
  - name: reasoning
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input: What is 2+2? Reply with just the number.
          reasoning:
            effort: medium
          store: true
          stream: false
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
