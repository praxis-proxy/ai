version: 1
id: responses/chat-basic-nonstream
description: Finite OpenAI Responses request translated to Chat Completions.
protocol: openai_responses
example_config: openai/responses/responses-to-chat-completions.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.chat.request
  - responses.chat.response.text
  - responses.chat.continuation
turns:
  - name: initial
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input: What is 2+2? Reply with just the number.
          store: true
          stream: false
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
  - name: continuation
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input: What was the previous answer? Reply with just the number.
          previous_response_id: ${PREVIOUS_RESPONSE_ID}
          store: false
          stream: false
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
