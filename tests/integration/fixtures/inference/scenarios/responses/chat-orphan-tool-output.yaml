version: 1
id: responses/chat-orphan-tool-output
description: Missing and null function_call_output call IDs lower to Chat user text while linked outputs keep tool messages.
protocol: openai_responses
example_config: openai/responses/responses-to-chat-completions.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.chat.tools.orphan_output_projection
turns:
  - name: orphan-output-projection
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input:
            - type: function_call_output
              output: orphan missing result
            - type: function_call_output
              call_id: null
              output: orphan null result
            - type: function_call
              call_id: call_linked
              name: lookup
              arguments: "{}"
            - type: function_call_output
              call_id: call_linked
              output: linked result
          store: false
          stream: false
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
