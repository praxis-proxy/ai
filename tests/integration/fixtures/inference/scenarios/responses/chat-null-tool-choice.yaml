version: 1
id: responses/chat-null-tool-choice
description: Responses request with explicit tool_choice null; translated Chat request omits tool_choice and response resource echoes tool_choice auto.
protocol: openai_responses
example_config: openai/responses/responses-to-chat-completions.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.chat.null_tool_choice
turns:
  - name: null-tool-choice
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input: What's the weather like in San Francisco?
          store: false
          stream: false
          tools:
            - type: function
              name: get_weather
              description: Get the current weather for a location
              parameters:
                type: object
                properties:
                  location:
                    type: string
                required: [location]
          tool_choice: null
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
