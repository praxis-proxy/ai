version: 1
id: responses/agentic-status-less-function-call
description: Agentic loop dispatches status-less function call output items from upstream responses.
protocol: openai_responses
example_config: openai/responses/agentic-loop-fixture.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.agentic.status_less_function_call
turns:
  - name: initial
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input: What is the weather in Paris?
          store: false
          stream: false
    expect:
      client_status: 200
      client_body_kind: json
      upstream_path: /v1/responses
      upstream_body_kind: json
      client_sse_events: []
      upstream_sse_events: []
