version: 1
id: responses/chat-unrepresentable-parameters
description: Background and truncation the Chat Completions adapter cannot represent fail closed instead of being silently downgraded.
protocol: openai_responses
example_config: openai/responses/responses-to-chat-completions.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.chat.unrepresentable_parameters
turns:
  - name: background
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input: Run this later.
          background: true
          store: false
          stream: false
    expect:
      client_status: 400
      client_body_kind: json
      upstream_path: ""
      upstream_body_kind: empty
      client_sse_events: []
      upstream_sse_events: []
  - name: truncation
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type:
          - application/json
      body:
        kind: json
        value:
          model: ${MODEL}
          input: Summarize a very long conversation.
          truncation: auto
          store: false
          stream: false
    expect:
      client_status: 400
      client_body_kind: json
      upstream_path: ""
      upstream_body_kind: empty
      client_sse_events: []
      upstream_sse_events: []
