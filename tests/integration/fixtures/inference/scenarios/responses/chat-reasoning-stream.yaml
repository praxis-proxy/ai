version: 1
id: responses/chat-reasoning-stream
description: Incremental raw reasoning with vLLM field fallback followed by assistant text.
protocol: openai_responses
example_config: openai/responses/responses-to-chat-completions-reasoning.yaml
upstream_authority: 127.0.0.1:3001
features:
  - responses.chat.reasoning.stream
turns:
  - name: reasoning
    request:
      method: POST
      path: /v1/responses
      headers:
        content-type: [application/json]
      body:
        kind: json
        value:
          model: ${MODEL}
          input: What is 2+2?
          reasoning:
            effort: low
          store: false
          stream: true
    expect:
      client_status: 200
      client_body_kind: sse
      upstream_path: /v1/chat/completions
      upstream_body_kind: json
      client_sse_events:
        - response.created
        - response.in_progress
        - response.output_item.added
        - response.content_part.added
        - response.reasoning_text.delta
        - response.output_item.added
        - response.content_part.added
        - response.output_text.delta
        - response.reasoning_text.done
        - response.content_part.done
        - response.output_item.done
        - response.output_text.done
        - response.content_part.done
        - response.output_item.done
        - response.completed
      client_sse_repeatable_events:
        - response.reasoning_text.delta
      upstream_sse_events: []
