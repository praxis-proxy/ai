listeners:
  - name: gateway
    address: "127.0.0.1:8080"
    filter_chains: [bedrock]

filter_chains:
  - name: bedrock
    filters:
      - filter: path_rewrite
        replace:
          pattern: "^/v1/chat/completions$"
          replacement: "/openai/v1/chat/completions"
      - filter: router
        routes:
          - path_prefix: "/openai/v1/chat/completions"
            cluster: bedrock
      - filter: load_balancer
        clusters:
          - name: bedrock
            endpoints: ["bedrock-runtime.us-east-1.amazonaws.com:443"]
            tls:
              sni: bedrock-runtime.us-east-1.amazonaws.com
      - filter: aws_sigv4_sign
        region: us-east-1
        service: bedrock
        host: bedrock-runtime.us-east-1.amazonaws.com
        access_key_env_var: AWS_ACCESS_KEY_ID
        secret_key_env_var: AWS_SECRET_ACCESS_KEY
        session_token_env_var: AWS_SESSION_TOKEN
