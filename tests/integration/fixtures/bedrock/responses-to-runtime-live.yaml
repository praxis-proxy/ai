listeners:
  - name: gateway
    address: "127.0.0.1:8080"
    filter_chains: [responses-to-chat]

filter_chains:
  - name: responses-to-chat
    filters:
      - filter: ai_operation
      - filter: openai_responses_request
        on_invalid: reject
      - filter: iterative_request_router
        initial_step: inference
        max_iterations: 1
        timeout_ms: 120000
        steps:
          - name: inference
            filters:
              - filter: openai_stream_events
              - filter: openai_responses_to_chat_completions
              - filter: path_rewrite
                replace:
                  pattern: "^/v1/responses$"
                  replacement: "/openai/v1/chat/completions"
              - filter: router
                routes:
                  - path: "/openai/v1/chat/completions"
                    cluster: openai
              - filter: load_balancer
                clusters:
                  - name: openai
                    endpoints: ["bedrock-runtime.us-east-1.amazonaws.com:443"]
                    http:
                      authority: bedrock-runtime.us-east-1.amazonaws.com
                    tls:
                      sni: bedrock-runtime.us-east-1.amazonaws.com
              - filter: aws_sigv4_sign
                region: us-east-1
                service: bedrock
                host: bedrock-runtime.us-east-1.amazonaws.com
                access_key_env_var: AWS_ACCESS_KEY_ID
                secret_key_env_var: AWS_SECRET_ACCESS_KEY
                session_token_env_var: AWS_SESSION_TOKEN
            on_result:
              - default: true
                done: true
