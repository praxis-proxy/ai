[package]
name = "praxis-tests-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[features]
# Feature passthroughs mirroring praxis-ai-proxy (see its Cargo.toml). The
# default is `full` so a plain `cargo test -p <crate>` exercises every filter.
default = ["full"]
standard = ["praxis-ai-proxy/standard", "praxis-test-utils/standard"]
# The signing filter alone, so the FIPS suite run can enable exactly the
# feature set the FIPS binary ships (see FIPS_FEATURES in the Makefile).
aws-sigv4-filter = ["praxis-ai-proxy/aws-sigv4-filter", "praxis-test-utils/aws-sigv4-filter"]
openai-responses = ["praxis-ai-proxy/openai-responses", "praxis-test-utils/openai-responses"]
openai-file-resolve-filter = ["openai-responses", "praxis-ai-proxy/openai-file-resolve-filter", "praxis-test-utils/openai-file-resolve-filter"]
store = ["openai-responses", "praxis-ai-proxy/store", "praxis-test-utils/store"]
store-postgres = ["store", "praxis-ai-proxy/store-postgres", "praxis-test-utils/store-postgres", "sqlx/postgres", "sqlx/tls-native-tls"]
store-sqlite = ["store", "praxis-ai-proxy/store-sqlite", "praxis-test-utils/store-sqlite", "sqlx/sqlite"]
store-all = ["store-postgres", "store-sqlite"]
openai-conversations = ["store", "praxis-ai-proxy/openai-conversations", "praxis-test-utils/openai-conversations"]
openai-compact = ["store", "praxis-ai-proxy/openai-compact", "praxis-test-utils/openai-compact"]
openai-mcp-tools = ["store", "praxis-ai-proxy/openai-mcp-tools", "praxis-test-utils/openai-mcp-tools"]
openai-all = ["openai-file-resolve-filter", "openai-conversations", "openai-compact", "openai-mcp-tools"]
full = ["standard", "openai-all", "store-postgres"]
cpex-policy-engine = []
# Experimental: gates the lakera-guard example test, which needs the
# http_callout filter registered in the in-process proxy registry.
http-callout-filter = ["praxis-ai-proxy/http-callout-filter"]
# Experimental: gates the azure_ad example test, which needs the azure_ad
# filter registered in the in-process proxy registry.
azure-ad-filter = ["praxis-ai-proxy/azure-ad-filter"]
# Experimental: gates the gcp_adc example test, which needs the gcp_adc
# filter registered in the in-process proxy registry.
gcp-adc-filter = ["praxis-ai-proxy/gcp-adc-filter"]
# Experimental: gates authenticated-subject token-rate-limit tests, which need
# Praxis's released Basic Auth filter registered in the in-process registry.
basic-auth-filter = ["praxis-ai-proxy/basic-auth-filter"]
# Experimental: gates the token_rate_limit example tests, which need the
# token_rate_limit filter registered in the in-process proxy registry.
token-rate-limit-filter = ["praxis-ai-proxy/token-rate-limit-filter"]
llmd-ext-proc = ["praxis-test-utils/llmd-ext-proc"]
no-mac-cert-rotation-tests = [] # We use this to disable testing cert rotation on macOS
praxis-main = ["praxis-test-utils/praxis-main"]

[lints]
workspace = true

[dev-dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
jsonschema = { workspace = true }
nix = { workspace = true }
# Digest oracles run on the same system OpenSSL the proxy signs with, so the
# FIPS suite's test binary carries no RustCrypto primitives (was sha2).
openssl = { workspace = true }
praxis-core = { workspace = true }
praxis-ai-proxy = { workspace = true }
praxis-filter = { workspace = true }
praxis-test-utils = { workspace = true }
# The FIPS behavior tests build listener configs directly to observe what the
# validated module refuses at load versus at first use.
praxis-tls = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "process"] }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
