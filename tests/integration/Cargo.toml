[package]
name = "praxis-tests-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[features]
cpex-policy-engine = []
# Experimental: gates the lakera-guard example test, which needs the
# http_callout filter registered in the in-process proxy registry.
http-callout-filter = ["praxis-ai-proxy/http-callout-filter"]
# Experimental: gates the azure_ad example test, which needs the azure_ad
# filter registered in the in-process proxy registry.
azure-ad-filter = ["praxis-ai-proxy/azure-ad-filter"]
# Experimental: gates the gcp_adc example test, which needs the gcp_adc
# filter registered in the in-process proxy registry.
gcp-adc-filter = ["praxis-ai-proxy/gcp-adc-filter"]
# Experimental: gates the token_rate_limit example tests, which need the
# token_rate_limit filter registered in the in-process proxy registry.
token-rate-limit-filter = ["praxis-ai-proxy/token-rate-limit-filter"]
llmd-ext-proc = ["praxis-test-utils/llmd-ext-proc"]
no-mac-cert-rotation-tests = [] # We use this to disable testing cert rotation on macOS
praxis-main = ["praxis-test-utils/praxis-main"]

[lints]
workspace = true

[dev-dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
nix = { workspace = true }
praxis-core = { workspace = true }
praxis-ai-proxy = { workspace = true }
praxis-filter = { workspace = true }
praxis-test-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "process"] }
tokio-tungstenite = { workspace = true }
rustls-pemfile = { workspace = true }
