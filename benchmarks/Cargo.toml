[package]
name = "praxis-ai-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Microbenchmarks for Praxis AI"
license.workspace = true
repository.workspace = true
publish = false

[features]
store-all = ["praxis-ai-apis/store-all"]

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
praxis-ai-apis = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "sqlite", "tls-native-tls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
name = "compression"
path = "store/compression.rs"
harness = false
required-features = ["store-all"]

[[bench]]
name = "gemini_translation"
path = "gemini/translation.rs"
harness = false
