name: CodeQL

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: "2 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # CodeQL Analysis
  # ----------------------------------------------------------------------------

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # CI does from-scratch compiles, so incremental compilation is pure
    # overhead; CodeQL's source-based Rust extractor does not need debug info.
    # These only affect the extractor's build-script/proc-macro compile.
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, rust ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust is analyzed in build-mode: none (rust-analyzer extracts from
      # source); none-mode still needs rustup + cargo on PATH. We keep the
      # cargo registry/git cache but not target/ — nothing in this job reads
      # workspace build artifacts, so caching them just adds restore/save I/O.
      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: codeql-cargo
          cache-target: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # 0 = use all available cores; the default caps analysis at 2 threads.
          threads: 0

      # No explicit build step: CodeQL for Rust only supports build-mode none
      # and never traces cargo, so a `cargo build --workspace` here just cold-
      # compiled the whole tree (deps + bins) for artifacts CodeQL discards.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          # Keep CodeQL a required merge-queue gate, but skip SARIF upload for
          # the ephemeral gh-readonly-queue ref (uploads are rejected there).
          # PR and main runs continue uploading code-scanning results.
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
