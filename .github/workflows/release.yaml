name: Release

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # Validate the tag matches Cargo.toml
  # ----------------------------------------------------------------------------

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(perl -ne 'print $1 if /^version\s*=\s*"(.+)"/' Cargo.toml)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------------
  # Run the full test suite
  # ----------------------------------------------------------------------------

  test:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Run all tests
        run: make test

      - name: Schema tests
        run: make test-schema

      - name: Integration tests
        run: make test-integration

  # ----------------------------------------------------------------------------
  # Build and publish container image
  # ----------------------------------------------------------------------------

  container:
    needs: [validate, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish container image
        uses: praxis-proxy/conventions/.github/actions/ghcr-publish@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          image-name: ${{ github.repository }}

  # ----------------------------------------------------------------------------
  # FIPS Container Build & Publish
  # ----------------------------------------------------------------------------

  # The same tags with a -fips suffix, built from Containerfile.fips on UBI 9.
  # The pinned Red Hat base images are verified to be signed by Red Hat before
  # the build (podman is the only client that can check those signatures, and
  # Ubuntu's podman ships no registries.d entry for Red Hat's store, so the job
  # installs the bundled one first). The shared ghcr-publish action cannot be
  # used here: its tag set has no suffix, so it would overwrite the standard
  # image's tags.

  container-fips:
    needs: [validate, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      fips-digest: ${{ steps.push-fips.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust (for the Red Hat image verification)
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          # The restored target/ would otherwise be swept into the build context.
          cache-target: "false"

      - name: Set up Go (builds Red Hat's scanner)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Build Red Hat's scanner (check-payload) at the pinned revision
        run: make fips-scanner

      - name: Download the OpenShift CLI the scanner insists on (pinned, checksum-verified)
        run: make fips-oc

      - name: Point podman at Red Hat's signature store (Ubuntu's podman has no entry for it)
        run: make fips-signature-store

      - name: Verify the Red Hat base images are signed by Red Hat
        run: make fips-verify-image

      - name: Build on UBI 9 with Red Hat's toolchain and print the compliance report
        run: make fips-check

      - name: Build the FIPS runtime image for verification
        run: make container-fips

      - name: Run the image once (validates its built-in config with the system OpenSSL)
        run: make fips-smoke

      - name: Scan the image with check-payload (warnings fatal)
        run: make fips-scan

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-fips
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Tag and push the scanned FIPS image
        id: push-fips
        env:
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          source_image=$(make -s fips-image-ref)
          digest_file=$(mktemp)
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            podman tag "$source_image" "$tag"
            # Every tag pushes the same image, so the last digest stands
            # for all of them; the fips-host job pulls the release by it.
            podman push --digestfile "$digest_file" "$tag"
          done <<< "$PUBLISHED_TAGS"
          echo "digest=$(cat "$digest_file")" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------------
  # FIPS proof of record: the tagged commit must hold a green fips-host run
  # ----------------------------------------------------------------------------
  #
  # The FIPS workflow does not run on tags, so this job links the release to
  # the runtime proof: the exact commit being released must have a recorded
  # successful fips-host run (the full suites on the FIPS runner, see
  # .github/workflows/fips.yaml). The push run for that commit may still be
  # in flight when the tag lands, so the check polls instead of failing on
  # the race. A commit with no such run fails here: dispatch the FIPS
  # workflow on the tag's ref, let fips-host pass, then re-run this workflow.

  fips-proof:
    needs: [validate]
    runs-on: ubuntu-24.04
    # Enough to ride out a fips-host run still in flight; that job's own
    # ceiling is 180 minutes on a cold cache.
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a green fips-host suites run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # An annotated tag's github.sha can name the tag object, not the
          # commit; peel to the commit the release actually ships.
          sha=$(git rev-parse 'HEAD^{commit}')
          echo "requiring a successful fips-host run of the FIPS workflow at $sha"
          deadline=$(( $(date +%s) + 185 * 60 ))
          while :; do
            pending=""
            if runs=$(gh api "repos/$REPO/actions/workflows/fips.yaml/runs?head_sha=$sha&per_page=100" \
              --jq '.workflow_runs[] | "\(.id) \(.status)"'); then
              if [ -z "$runs" ]; then
                echo "::error::no FIPS workflow run exists for $sha; dispatch the FIPS workflow on this ref, let fips-host pass, then re-run the release workflow"
                exit 1
              fi
              while read -r id status; do
                [ -n "$id" ] || continue
                job=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.name == "fips-host")] | first | if . == null then "absent" else (.conclusion // .status) end' \
                  || echo "unknown")
                case "$job" in
                  success)
                    echo "fips-host succeeded in run $id"
                    exit 0
                    ;;
                  queued | in_progress | waiting | pending | unknown)
                    pending="run $id (fips-host $job)"
                    ;;
                  absent)
                    [ "$status" = "completed" ] || pending="run $id ($status, fips-host not scheduled yet)"
                    ;;
                esac
              done <<< "$runs"
              if [ -z "$pending" ]; then
                echo "::error::no successful fips-host run for $sha and none in flight; make one pass (re-run its fips-host job, or dispatch the FIPS workflow on this ref), then re-run the release workflow"
                exit 1
              fi
            else
              pending="the runs listing (query failed)"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for $pending"
              exit 1
            fi
            echo "waiting on $pending"
            sleep 120
          done

  # ----------------------------------------------------------------------------
  # FIPS host: check the pushed release image on the FIPS runner
  # ----------------------------------------------------------------------------
  #
  # The runtime attestation of the exact bits that were just published,
  # pulled back by digest: the host and module attestation and the running
  # probe. The full suites for this exact commit are required by the
  # fips-proof gate, so this job attests and probes without rerunning them.

  fips-host:
    needs: [validate, container-fips]
    if: >-
      !cancelled()
      && needs.validate.result == 'success'
      && needs.container-fips.result == 'success'
      && needs.container-fips.outputs.fips-digest != ''
    runs-on: [self-hosted, fips, rhel]
    concurrency:
      group: fips-host-runner
      cancel-in-progress: false
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/fips-runner-check

      - name: Pull the pushed FIPS image by digest and name it for the checks
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.container-fips.outputs.fips-digest }}
        run: |
          podman pull "$IMAGE"
          make fips-image-tag FIPS_IMAGE_SOURCE="$IMAGE"

      - uses: ./.github/actions/fips-host
        with:
          run-suites: "false"

      - name: Remove the pulled image
        if: always()
        run: podman rmi --force "localhost/praxis-ai:$(make -s fips-version)-fips" || true

  # ----------------------------------------------------------------------------
  # Create GitHub release
  # ----------------------------------------------------------------------------

  github-release:
    needs: [validate, container, container-fips, fips-proof, fips-host]
    # fips-host needs the self-hosted FIPS runner; a release must not be
    # unpublishable while that runner is offline, so skipped is acceptable
    # and only a run that failed blocks the release.
    if: >-
      !cancelled()
      && needs.validate.result == 'success'
      && needs.container.result == 'success'
      && needs.container-fips.result == 'success'
      && needs.fips-proof.result == 'success'
      && (needs.fips-host.result == 'success' || needs.fips-host.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes
