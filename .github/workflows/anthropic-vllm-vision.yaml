name: Anthropic Messages vLLM Vision

# A separate model is required: the Qwen3-8B used by the Claude Code nightly
# accepts text only. This job proves image requests from the official Anthropic
# SDK reach a real vision model through both Praxis production example routes.
#
# The model-baked image comes from GHCR, published by vllm-gpu-container.yaml.
# Rebuilding it here nightly would recreate a byte-identical image -- the model
# and its revision are pinned in vllm/images.json -- so the image is only built
# when the registry does not already hold one matching this checkout, which is
# what resolve-vllm-gpu-image decides.
on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  schedule:
    - cron: "31 6 * * *"
  workflow_dispatch:
    inputs:
      gpu_instance_type:
        description: Optional EC2 GPU instance type override
        required: false
        default: g5.xlarge
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  gpu-start-runner:
    name: Start vision GPU runner
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.label.name == 'vllm-full-suite' ||
        (github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'vllm-full-suite'))) &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start EC2 GPU runner
        id: start
        uses: ./.github/actions/start-ec2-runner
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          ami-id: ${{ vars.AWS_GPU_AMI_ID }}
          subnet-id: ${{ vars.AWS_SUBNET_ID || vars.US_EAST_2A_SUBNET_ID }}
          security-group-id: ${{ vars.AWS_SECURITY_GROUP_ID || vars.US_EAST_2_SG_ID }}
          instance-type: ${{ inputs.gpu_instance_type || 'g5.xlarge' }}
          github-token: ${{ secrets.PRAXIS_RUNNER_PAT }}

  anthropic-sdk-vision:
    name: Anthropic SDK image requests through Praxis to vLLM
    needs: [gpu-start-runner]
    runs-on: ${{ needs.gpu-start-runner.outputs.label }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify GPU and container runtime
        run: |
          nvidia-smi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"
            echo "GPU_DEVICE_ARGS=--gpus all" >> "$GITHUB_ENV"
          elif command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=podman" >> "$GITHUB_ENV"
            echo "GPU_DEVICE_ARGS=--device nvidia.com/gpu=all" >> "$GITHUB_ENV"
          else
            echo "Neither Docker nor Podman is usable" >&2
            exit 1
          fi

      - name: Free disk space
        run: |
          "$CONTAINER_RUNTIME" system prune -af || true
          df -h /

      - name: Read vision image spec
        id: spec
        uses: ./.github/actions/vllm-image-spec
        with:
          key: vision

      - name: Log in to GHCR (docker)
        if: env.CONTAINER_RUNTIME == 'docker'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (podman)
        if: env.CONTAINER_RUNTIME == 'podman'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | podman login "$REGISTRY" \
            --username "$GHCR_USERNAME" --password-stdin

      - name: Resolve published vision image
        id: image
        uses: ./.github/actions/resolve-vllm-gpu-image
        with:
          image: ${{ steps.spec.outputs.image }}
          model: ${{ steps.spec.outputs.model }}
          revision: ${{ steps.spec.outputs.revision }}
          runtime: ${{ env.CONTAINER_RUNTIME }}

      # Only reached when GHCR has no image matching this checkout -- a PR that
      # edits vllm/Containerfile or repins the model, or a publish that has not
      # landed yet. vllm-gpu-container.yaml is what normally produces this.
      - name: Build pinned vision GPU image
        if: steps.image.outputs.build-required == 'true'
        uses: ./.github/actions/build-vllm-gpu
        with:
          model: ${{ steps.spec.outputs.model }}
          revision: ${{ steps.spec.outputs.revision }}
          image: ${{ steps.spec.outputs.image }}
          runtime: ${{ env.CONTAINER_RUNTIME }}
          hugging-face-token: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: tests/integration/sdk/anthropic/test_anthropic_messages_vllm.py

      - name: Generate backend credential
        run: |
          token="praxis-$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$token"
          echo "VLLM_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Start pinned vision model on vLLM
        uses: ./.github/actions/start-vllm
        with:
          image: ${{ steps.spec.outputs.image }}
          model: ${{ steps.spec.outputs.served-model-name }}
          model-path: ${{ steps.spec.outputs.model-path }}
          runtime: ${{ env.CONTAINER_RUNTIME }}
          # Resolved above, either pulled or built; nothing left to fetch.
          pull: "false"
          device-args: ${{ env.GPU_DEVICE_ARGS }}
          gpu-memory-utilization: ${{ steps.spec.outputs.gpu-memory-utilization }}
          max-model-len: ${{ steps.spec.outputs.max-model-len }}
          tool-call-parser: ${{ steps.spec.outputs.tool-call-parser }}
          reasoning-parser: ${{ steps.spec.outputs.reasoning-parser }}
          extra-args: ${{ steps.spec.outputs.extra-serve-args }}
          # vLLM requires the same bearer token Praxis injects, so an
          # unauthenticated upstream call fails.
          api-key: ${{ env.VLLM_API_KEY }}

      - name: Build Praxis
        run: cargo build -p praxis-ai-proxy

      - name: Wait for vLLM readiness
        uses: ./.github/actions/wait-vllm
        with:
          runtime: ${{ env.CONTAINER_RUNTIME }}
          timeout: "1200"
          api-key: ${{ env.VLLM_API_KEY }}

      - name: Verify native Anthropic Messages endpoint
        env:
          SERVED_MODEL: ${{ steps.spec.outputs.served-model-name }}
        run: |
          set -euo pipefail
          # wait-vllm proved /health and /v1/models; this additionally proves the
          # native Messages surface the SDK tests drive is up and token-gated.
          curl -sf -H "Authorization: Bearer ${VLLM_API_KEY}" \
            -H 'content-type: application/json' \
            -d "{\"model\":\"${SERVED_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
            http://127.0.0.1:8000/v1/messages/count_tokens >/dev/null

      - name: Run official Anthropic SDK image tests
        env:
          PRAXIS_TEST_VLLM_BASE_URL: http://127.0.0.1:8000
          PRAXIS_TEST_VLLM_MODEL: ${{ steps.spec.outputs.served-model-name }}
          PRAXIS_TEST_REQUIRE_LIVE: "1"
        run: uv run tests/integration/sdk/anthropic/test_anthropic_messages_vllm.py -s -k image

      - name: vLLM logs on failure
        if: failure()
        run: |
          "${CONTAINER_RUNTIME:-docker}" logs vllm 2>&1 || true

      - name: Stop vLLM
        if: always()
        run: |
          "${CONTAINER_RUNTIME:-docker}" rm -f vllm || true

  gpu-stop-runner:
    name: Stop vision GPU runner
    needs: [gpu-start-runner, anthropic-sdk-vision]
    if: always() && needs.gpu-start-runner.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stop EC2 GPU runner
        uses: ./.github/actions/stop-ec2-runner
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          github-token: ${{ secrets.PRAXIS_RUNNER_PAT }}
          label: ${{ needs.gpu-start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.gpu-start-runner.outputs.ec2-instance-id }}
