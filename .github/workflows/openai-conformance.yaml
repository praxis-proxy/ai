name: OpenAI Conformance

on:
  push:
    branches: [main]
    paths:
      - "apis/**"
      - "xtask/**"
      - "docs/conformance/**"
      - ".github/workflows/openai-conformance.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "apis/**"
      - "xtask/**"
      - "docs/conformance/**"
      - ".github/workflows/openai-conformance.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # CI never reads backtraces from these builds; skipping debuginfo trims both
  # the cold compile and the cached target/ size.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # merge_group events cannot use trigger-level `paths` filters, so gate the
  # expensive job on a git diff over the same relevant paths. push/pull_request
  # are already filtered above and skip this job (result == 'skipped').
  changes:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant path changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.merge_group.base_sha }}" \
                                         "${{ github.event.merge_group.head_sha }}" -- \
            'apis/' \
            'xtask/' \
            'docs/conformance/' \
            '.github/workflows/openai-conformance.yaml' \
            'Cargo.toml' 'Cargo.lock')
          if [ -n "$CHANGED" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  conformance:
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          cache-suffix: openai-conformance

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install pinned oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.23.0

      - name: Verify pinned OpenAI reference
        run: cargo xtask openai-conformance-reference --check

      - name: Regenerate conformance report
        run: >-
          cargo xtask openai-conformance
          --output-json docs/conformance/openai-conformance-report.json

      - name: Check generated artifacts
        run: >-
          git diff --exit-code --
          docs/conformance/openai-conformance-report.json
          docs/conformance/specs/openai-openapi.yaml
          docs/conformance/specs/openai-openapi-source.json

      - name: Enforce strict OpenAI conformance
        id: strict-conformance
        continue-on-error: true
        run: >-
          target/debug/xtask openai-conformance-gate
          --report docs/conformance/openai-conformance-report.json

      - name: Evaluate pull request acknowledgement
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          steps.strict-conformance.outcome == 'failure'
        env:
          ALLOW_NEW_FAILURES: ${{ contains(github.event.pull_request.labels.*.name, 'conformance-failure-acknowledged') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORT: docs/conformance/openai-conformance-report.json
        run: |
          args=(--report "$REPORT" --acknowledge)
          base_report="$RUNNER_TEMP/openai-conformance-base-report.json"
          if git cat-file -e "$BASE_SHA:$REPORT" 2>/dev/null; then
            git show "$BASE_SHA:$REPORT" > "$base_report"
            args+=(--base-report "$base_report")
          fi
          if [[ "$ALLOW_NEW_FAILURES" == "true" ]]; then
            args+=(--allow-new-failures)
          fi
          target/debug/xtask openai-conformance-gate "${args[@]}"
          echo "::warning title=OpenAI conformance failure acknowledged::Strict conformance failed; the generated report carries the reviewed failure set."
          {
            echo "### OpenAI conformance failure acknowledged"
            echo
            echo "Strict conformance failed, but its exact failure set is recorded in the generated report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Honor checked-in acknowledgement
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          steps.strict-conformance.outcome == 'failure'
        run: |
          target/debug/xtask openai-conformance-gate \
            --report docs/conformance/openai-conformance-report.json \
            --acknowledge \
            --allow-new-failures
          echo "::warning title=OpenAI conformance failure acknowledged::Strict conformance failed; the regenerated report matches the checked-in reviewed failure set."
          {
            echo "### OpenAI conformance failure acknowledged"
            echo
            echo "Strict conformance failed, but the regenerated report matches the checked-in reviewed failure set."
          } >> "$GITHUB_STEP_SUMMARY"
