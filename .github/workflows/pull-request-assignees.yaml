name: Pull Request Assignees

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Assigns an ai-reviewers member when the author has at most three PRs
# ready for review. Over-limit PRs wait without reviewer assignment.
# Maintainers are assigned deliberately after required CI passes; a maintainer
# assignment signals that review has started.
#
# Reviewers come from REVIEWER_TEAMS below. The PR author and bot accounts are
# never picked, and an existing reviewer assignment is preserved. When a
# reviewer is needed, the pick is whoever is assigned to the fewest open PRs in
# this repository, with ties broken at random.
#
# This runs on pull_request_target so fork PRs get the praxis-bot token too.
# Everything goes through the GitHub API; PR code is never checked out, and
# the job's own GITHUB_TOKEN gets no permissions.
#
# The praxis-bot GitHub App token needs these permissions for this to work:
#   - Repository "Pull requests": read & write (read PRs, add assignees)
#   - Organization "Members": read             (team membership lookups)

on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  assign:
    uses: praxis-proxy/conventions/.github/workflows/pr-assignees.yaml@a94d5edb2929b4e623dcfc9f1820d67eab43f748 # conventions PR 49
    with:
      auto-assign-maintainer: false
      max-open-prs: 3
      count-draft-prs: false
      reviewer-teams: ai-reviewers
    secrets:
      PRAXIS_BOT_APP_ID: ${{ secrets.PRAXIS_BOT_APP_ID }}
      PRAXIS_BOT_APP_PRIVATE_KEY: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}
