name: vLLM Integration
run-name: >-
  ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'vllm-full-suite' &&
      format('vLLM full suite label - PR #{0}', github.event.pull_request.number) ||
      format('vLLM Integration - {0}', github.ref_name) }}

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - "apis/src/openai/responses/**"
      - "apis/src/openai/conversations/**"
      - "apis/src/openai/sse/**"
      - "apis/src/store/**"
      - "server/**"
      - "tests/integration/sdk/openai/**"
      - "tests/utils/examples/conversations_tenant_proxy.rs"
      - "tests/integration/ogx-constraints.txt"
      - "examples/configs/openai/responses/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/actions/start-vllm/**"
      - ".github/actions/wait-vllm/**"
      - ".github/workflows/vllm-integration.yaml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    branches: [main]
  schedule:
    # Avoid overlapping the repository's 02:47 UTC nightly workflow and
    # 03:02 UTC CodeQL schedule.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      run_live_vllm:
        description: Run the complete Responses SDK suite against live vLLM on a GPU runner
        required: false
        default: false
        type: boolean
      run_claude_acceptance:
        description: >-
          Run pinned Claude Code through native Messages and translated Chat
          paths on a GPU runner. Use this to gather qualification passes; when
          run_live_vllm is false it skips the complete Responses SDK suite.
        required: false
        default: false
        type: boolean
      run_codex_acceptance:
        description: >-
          Run pinned Codex through native Responses and translated Chat paths
          against real Qwen3-8B. When run_live_vllm is false, this skips the
          complete Responses SDK suite.
        required: false
        default: false
        type: boolean
      gpu_instance_type:
        description: >-
          Optional EC2 GPU instance-type override for transient capacity
          shortages (for example, g5.2xlarge).
        required: false
        default: g5.xlarge
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  VLLM_IMAGE: "quay.io/opendatahub/vllm-cpu:Qwen3-0.6B-granite-embedding-125m-english@sha256:0212dc82981178033cb71c7477ba8ad1998fb6c0b1ee40646119fb9724ac951b"
  VLLM_MODEL: "Qwen/Qwen3-0.6B"
  # CUDA image used by the GPU full-suite jobs on the ephemeral EC2 runner.
  # The model is downloaded from Hugging Face at container start (not baked in),
  # unlike the CPU image above.
  VLLM_GPU_IMAGE: "docker.io/vllm/vllm-openai:v0.29.0-cu129@sha256:7ef5a35d1ef8ce2cf9d671dd91eec6e367c5849262e0362b4d3d4a26be0d87d2"
  # Model served on the GPU runner. A capable model is required for reliable
  # tool-calling (file_search, MCP) — the 0.6B CPU model above is not. Qwen3-8B
  # fits the A10G (24GB) used by the g5.xlarge GPU runner with FlashAttention-2.
  VLLM_GPU_MODEL: "Qwen/Qwen3-8B"
  # Instance type for the ephemeral GPU runner. g5.xlarge = A10G (24GB, compute
  # capability 8.6, so FlashAttention-2 is available).
  GPU_INSTANCE_TYPE: "g5.xlarge"
  # The custom GPU runner service does not guarantee HOME is exported. Keep the
  # model cache at an explicit instance-local path shared by sequential jobs.
  GPU_HF_CACHE_DIR: /tmp/praxis-huggingface
  # llm-d-inference-sim v0.11.2 multi-architecture image index.
  INFERENCE_SIM_IMAGE: "ghcr.io/llm-d/llm-d-inference-sim@sha256:32144df791330a0006b747edfdf2b114a0fe728e023a9d1b3463eeb48d32abb9"
  INFERENCE_SIM_MODEL: "praxis-test-model"
  # OGX + transformers pins live in tests/integration/ogx-constraints.txt (with
  # the rationale for each pin). Single-sourcing them there lets the uv download
  # cache key depend only on the pins, so editing this workflow or a test file
  # no longer forces a cold multi-GB OGX re-download. Both OGX steps install from
  # this file via `uv run --with-requirements`.
  OGX_CONSTRAINTS: "tests/integration/ogx-constraints.txt"

jobs:
  # ----------------------------------------------------------------------------
  # Path filter for pull_request and merge_group. The pull_request trigger is
  # intentionally unfiltered so a vllm-full-suite label can request a run on
  # any PR; ordinary PR events still avoid the expensive jobs when irrelevant.
  # ----------------------------------------------------------------------------

  changes:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant path changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'apis/src/openai/responses/' \
            'apis/src/openai/conversations/' \
            'apis/src/openai/sse/' \
            'apis/src/store/' \
            'server/' \
            'tests/integration/sdk/openai/' \
            'tests/utils/examples/conversations_tenant_proxy.rs' \
            'tests/integration/ogx-constraints.txt' \
            'examples/configs/openai/responses/' \
            'Cargo.toml' \
            'Cargo.lock' \
            'Makefile' \
            '.github/actions/start-vllm/' \
            '.github/actions/wait-vllm/' \
            '.github/workflows/vllm-integration.yaml')
          if [ -n "$CHANGED" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # Fast Responses API integration tests against llm-d-inference-sim
  # ----------------------------------------------------------------------------

  vllm-responses:
    needs: [changes]
    if: |
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.action != 'labeled') &&
      (github.event_name != 'workflow_dispatch' || !inputs.run_live_vllm) &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Persist uv's wheel/download cache across runs so the multi-GB OGX
          # closure (torch, CUDA, faiss, transformers) is not re-downloaded every
          # run. Key ONLY on the pins file: setup-uv has no restore-key/prefix
          # fallback, so any globbed file that changes forces a full cold
          # re-download (~8 min). The workflow YAML and test files are
          # deliberately NOT globbed -- editing them must not bust the cache; uv
          # still downloads any small new PEP-723 test dep incrementally on top
          # of the restored cache.
          enable-cache: true
          cache-dependency-glob: |
            tests/integration/ogx-constraints.txt

      - name: Start inference simulator
        run: |
          docker run --detach --name inference-sim --network host \
            "$INFERENCE_SIM_IMAGE" \
            --model="$INFERENCE_SIM_MODEL" \
            --served-model-name="$INFERENCE_SIM_MODEL" \
            --mode=echo \
            --max-model-len=8192 \
            --skip-tool-validation \
            --port=8000

      - name: Pre-install OGX dependencies
        run: |
          # Resolve + download the full OGX dependency closure (torch, CUDA
          # wheels, faiss, transformers, ...) synchronously and OFF the readiness
          # clock. Without this the download runs backgrounded inside the
          # "Wait for OGX readiness" window and loses the race under network
          # variance, so the server never binds port 8321 in time (exit 124).
          echo "Pre-installing OGX from $OGX_CONSTRAINTS..."
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx --help > /dev/null
          echo "OGX environment ready"

      - name: Start OGX
        run: |
          # Same "$OGX_CONSTRAINTS" as the pre-install above, so uv reuses the
          # already materialized environment and the server binds within seconds.
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx run starter --insecure > /tmp/ogx.log 2>&1 &
          echo $! > /tmp/ogx.pid

      - name: Build Praxis
        run: |
          cargo build -p praxis-ai-proxy --no-default-features --features store-sqlite
          cargo build -p praxis-test-utils --example conversations_tenant_proxy --no-default-features --features store-sqlite

      - name: Wait for inference simulator readiness
        run: |
          simulator_ready=false
          for _ in {1..60}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1 && \
               curl -sf http://127.0.0.1:8000/v1/models > /dev/null 2>&1; then
              simulator_ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' inference-sim)" != true ]; then
              echo "::error::inference simulator exited before becoming ready"
              docker logs inference-sim 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          if [ "$simulator_ready" != true ]; then
            echo "::error::inference simulator did not become ready within 60s"
            docker logs inference-sim 2>&1 || true
            exit 1
          fi

      - name: Run Conversations SDK integration tests
        env:
          PRAXIS_TENANT_TEST_BIN: target/debug/examples/conversations_tenant_proxy
          VLLM_MODEL: ${{ env.INFERENCE_SIM_MODEL }}
        run: |
          uv run tests/integration/sdk/openai/test_openai_conversations.py -s

      - name: Wait for OGX readiness
        run: |
          echo "Waiting for OGX server..."
          # Poll in the current shell (no nested `bash -c`) so we can both bound
          # the wait and check process liveness: fail fast if the backgrounded
          # OGX process dies, and dump the log inline so a readiness failure is
          # diagnosable from this step (mirrors the vLLM liveness check, which
          # previously produced only an opaque exit 124 here).
          dump_ogx_log() {
            echo "----- /tmp/ogx.log (tail -n 200) -----"
            tail -n 200 /tmp/ogx.log 2>/dev/null || echo "No OGX log found"
          }
          OGX_PID="$(cat /tmp/ogx.pid)"
          deadline=$((SECONDS + 300))
          until curl -sf http://127.0.0.1:8321/v1/files > /dev/null 2>&1; do
            if ! kill -0 "$OGX_PID" 2>/dev/null; then
              echo "::error::OGX process (pid $OGX_PID) exited before binding port 8321"
              dump_ogx_log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::OGX did not become ready within 300s"
              dump_ogx_log
              exit 1
            fi
            sleep 2
          done
          echo "OGX is ready"

      - name: Run simulated Responses integration tests
        env:
          VLLM_MODEL: ${{ env.INFERENCE_SIM_MODEL }}
          VLLM_TEST_BACKEND: simulator
        run: |
          test_cmd=(
            uv run tests/integration/sdk/openai/test_openai_responses_vllm.py
            -s -m "not real_inference and not vllm_compat"
          )
          if "${test_cmd[@]}"; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "merge_group" ]; then
            exit 1
          fi
          echo "::warning::Retrying failed simulator tests once for the merge queue"
          "${test_cmd[@]}" --last-failed --last-failed-no-failures none

      - name: Inference simulator logs
        if: failure()
        run: docker logs inference-sim 2>&1 || echo "(no simulator container)"

      - name: OGX logs
        if: failure()
        run: cat /tmp/ogx.log 2>/dev/null || echo "No OGX log found"

      - name: Stop inference simulator
        if: always()
        run: docker rm -f inference-sim || true

      - name: Stop OGX
        if: always()
        run: |
          if [ -f /tmp/ogx.pid ]; then
            kill "$(cat /tmp/ogx.pid)" 2>/dev/null || true
          fi

  # ----------------------------------------------------------------------------
  # Critical live CPU smoke tests on every relevant change. Nightly runs,
  # `run_live_vllm` dispatches, and vllm-full-suite labels run the *complete*
  # suite on a real GPU instead (see the gpu-* jobs below).
  # ----------------------------------------------------------------------------

  vllm-live-cpu:
    needs: [changes]
    if: |
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || !inputs.run_live_vllm) &&
      (github.event_name != 'pull_request' || github.event.action != 'labeled') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            tests/integration/ogx-constraints.txt

      - name: Start vLLM
        uses: ./.github/actions/start-vllm
        with:
          image: ${{ env.VLLM_IMAGE }}
          model: ${{ env.VLLM_MODEL }}

      - name: Pre-install OGX dependencies
        run: |
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx --help > /dev/null

      - name: Start OGX
        run: |
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx run starter --insecure > /tmp/ogx.log 2>&1 &
          echo $! > /tmp/ogx.pid

      - name: Build Praxis
        run: cargo build -p praxis-ai-proxy --no-default-features --features store-sqlite

      - name: Wait for vLLM readiness
        uses: ./.github/actions/wait-vllm

      - name: Wait for OGX readiness
        run: |
          dump_ogx_log() {
            echo "----- /tmp/ogx.log (tail -n 200) -----"
            tail -n 200 /tmp/ogx.log 2>/dev/null || echo "No OGX log found"
          }
          OGX_PID="$(cat /tmp/ogx.pid)"
          deadline=$((SECONDS + 300))
          until curl -sf http://127.0.0.1:8321/v1/files > /dev/null 2>&1; do
            if ! kill -0 "$OGX_PID" 2>/dev/null; then
              echo "::error::OGX process (pid $OGX_PID) exited before binding port 8321"
              dump_ogx_log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::OGX did not become ready within 300s"
              dump_ogx_log
              exit 1
            fi
            sleep 2
          done

      - name: Run critical live vLLM smoke tests
        env:
          VLLM_TEST_BACKEND: live
        run: |
          uv run tests/integration/sdk/openai/test_openai_responses_vllm.py \
            -s -m "critical_vllm"

      - name: vLLM container logs
        if: failure()
        run: docker logs vllm 2>&1 || echo "(no vllm container)"

      - name: OGX logs
        if: failure()
        run: cat /tmp/ogx.log 2>/dev/null || echo "No OGX log found"

      - name: Stop vLLM
        if: always()
        run: docker rm -f vllm || true

      - name: Stop OGX
        if: always()
        run: |
          if [ -f /tmp/ogx.pid ]; then
            kill "$(cat /tmp/ogx.pid)" 2>/dev/null || true
          fi

  # ----------------------------------------------------------------------------
  # Parse the Claude Code + vLLM acceptance pin manifest on an ubuntu runner
  # (which ships Python 3.11+ so `tomllib` is available; the GPU AMI ships Python
  # 3.9 and cannot). Exports every pin the GPU acceptance job needs as job
  # outputs, plus `qualified` (true only when qualification.status == "qualified"
  # and no exported value contains "TBD"). This never fails: the acceptance job
  # gates on `qualified`, so the nightly schedule stays green while pins are
  # pending. Runs on schedule + workflow_dispatch, the only events that can reach
  # the GPU acceptance job.
  # ----------------------------------------------------------------------------

  pins:
    name: Load Claude Code + vLLM acceptance pins
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      qualified: ${{ steps.load.outputs.qualified }}
      claude_url: ${{ steps.load.outputs.claude_url }}
      claude_sha256: ${{ steps.load.outputs.claude_sha256 }}
      claude_version: ${{ steps.load.outputs.claude_version }}
      claude_platform: ${{ steps.load.outputs.claude_platform }}
      vllm_image: ${{ steps.load.outputs.vllm_image }}
      vllm_served_model: ${{ steps.load.outputs.vllm_served_model }}
      vllm_flags: ${{ steps.load.outputs.vllm_flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse pin manifest
        id: load
        run: |
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import pathlib, sys, tomllib

          manifest = pathlib.Path("tests/integration/fixtures/claude-code-cli/pin.toml")
          data = tomllib.loads(manifest.read_text())
          claude, vllm, qual = data["claude_code"], data["vllm"], data["qualification"]
          exported = {
              "claude_url": claude["url"],
              "claude_sha256": claude["sha256"],
              "claude_version": claude["version"],
              "claude_platform": claude["platform"],
              "vllm_image": vllm["image"],
              "vllm_served_model": vllm["served_model_name"],
              "vllm_flags": " ".join(vllm["launch"]["flags"]),
          }
          unresolved = sorted(key for key, value in exported.items() if "TBD" in value)
          qualified = qual["status"] == "qualified" and not unresolved
          with open(sys.argv[1], "a", encoding="utf-8") as out:
              for key, value in exported.items():
                  out.write(f"{key}={value}\n")
              out.write(f"qualified={'true' if qualified else 'false'}\n")
          # Informational only — never fail here, so scheduled/nightly runs stay
          # green while qualification is pending; the acceptance job gates on
          # `qualified` and a `workflow_dispatch` can still run to gather passes.
          if not qualified:
              print(
                  f"::notice::Claude Code acceptance pins not yet qualified "
                  f"(status={qual['status']!r}, unresolved={unresolved}); the GPU acceptance "
                  "job stays dormant on the nightly schedule until pin.toml is qualified."
              )
          PY

  # ----------------------------------------------------------------------------
  # Pinned Claude Code drives Anthropic Messages to real vLLM, native + transformed
  # (issue #1025)
  #
  # A pinned real Claude Code executable completes a deterministic coding task
  # against a pinned real vLLM backend over two Praxis paths, run sequentially
  # against one shared vLLM container:
  #   - NATIVE: Anthropic Messages traffic (/v1/messages,
  #     /v1/messages/count_tokens, /v1/models) is forwarded straight to vLLM's
  #     native Anthropic surface — with NO translation.
  #   - TRANSFORMED: Anthropic Messages traffic is translated into OpenAI Chat
  #     Completions (anthropic_messages_to_chat_completions) and forwarded to
  #     vLLM's /v1/chat/completions surface.
  # The two runs are sequential (not parallel) so they never contend for the
  # runner's CPU while a model is generating.
  #
  # Runs on the SAME ephemeral EC2 GPU runner as the full suite (machulav
  # v2.3.9 registers a non-ephemeral runner, so a second job runs on the same
  # instance), sequentially AFTER it (`needs: vllm-gpu-full-suite`), reusing the
  # Qwen3-8B weights the full suite already downloaded via a shared on-disk HF
  # cache. It starts its OWN vLLM container WITH --api-key (the full suite's is
  # keyless and torn down first): the credential-isolation proof requires the
  # backend to REJECT an un-injected bearer, and two Qwen3-8B cannot coexist on
  # the 24GB A10G, so a separate sequential keyed container is mandatory.
  #
  # Reproducibility-critical: depends on the pins recorded in
  # tests/integration/fixtures/claude-code-cli/pin.toml (consumed via the `pins`
  # job's outputs, since the GPU AMI ships Python 3.9 and cannot parse TOML). It
  # never runs on push / pull_request / merge_group (it needs the GPU runner,
  # started only on schedule / run_live_vllm / an acceptance dispatch / the
  # vllm-full-suite label), so PR and merge-queue CI stay green. On the nightly
  # schedule it stays dormant until pin.toml is qualified (needs.pins.qualified);
  # a `run_claude_acceptance` dispatch runs it regardless to gather qualification
  # passes. The backend credential is generated per job; the client receives a
  # distinct gateway credential, so successful inference proves replacement.
  # ----------------------------------------------------------------------------

  vllm-gpu-claude-acceptance:
    name: Claude Code acceptance on real vLLM (GPU)
    needs: [gpu-start-runner, vllm-gpu-full-suite, pins]
    # Reuse the GPU runner started for the full suite. `!cancelled()` lets this
    # run even when the full suite was skipped (a run_claude_acceptance-only
    # dispatch) or failed (salvage the warm instance), but never on cancellation.
    # It only proceeds when the runner actually started, and only on a
    # full-suite/acceptance dispatch, a labeled PR, or on the nightly schedule
    # once qualified.
    if: |
      !cancelled() &&
      needs.gpu-start-runner.result == 'success' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.run_live_vllm || inputs.run_claude_acceptance)
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'vllm-full-suite'
        ) ||
        (github.event_name == 'schedule' && needs.pins.outputs.qualified == 'true')
      )
    runs-on: ${{ needs.gpu-start-runner.outputs.label }}
    # Comfortable on the nightly (the full suite already warmed the on-disk HF
    # cache), but a run_claude_acceptance-only dispatch — the path used to gather
    # qualification passes — hits a COLD cache and must download ~16GB of
    # Qwen3-8B before serving. With retries_allowed=0 a slow HF download must not
    # burn a qualification attempt, so allow headroom (still under the 90-minute
    # instance budget the full suite uses).
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Pins resolved by the `pins` job (parsed on ubuntu; the GPU AMI's Python
      # 3.9 lacks tomllib). Every value is runnable; qualification only flips
      # pins.qualified via qualification.status.
      CLAUDE_URL: ${{ needs.pins.outputs.claude_url }}
      CLAUDE_SHA256: ${{ needs.pins.outputs.claude_sha256 }}
      CLAUDE_VERSION: ${{ needs.pins.outputs.claude_version }}
      CLAUDE_PLATFORM: ${{ needs.pins.outputs.claude_platform }}
      VLLM_IMAGE_PIN: ${{ needs.pins.outputs.vllm_image }}
      VLLM_SERVED_MODEL: ${{ needs.pins.outputs.vllm_served_model }}
      VLLM_FLAGS: ${{ needs.pins.outputs.vllm_flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify GPU and container runtime
        run: |
          nvidia-smi
          if command -v docker >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"
            docker info >/dev/null
          elif command -v podman >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=podman" >> "$GITHUB_ENV"
            podman info >/dev/null
          else
            echo "Neither docker nor podman is available on this runner" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Verify pins are resolvable
        run: |
          set -euo pipefail
          # The `pins` job exports these; guard against a stray TBD reaching the
          # backend (e.g. a partially filled manifest) with a clear, actionable
          # error rather than an opaque vLLM startup failure. On the nightly
          # schedule the job is already gated on needs.pins.outputs.qualified, so
          # this mainly protects run_claude_acceptance dispatches.
          for pin in "$CLAUDE_URL" "$CLAUDE_SHA256" "$CLAUDE_VERSION" "$CLAUDE_PLATFORM" \
                     "$VLLM_IMAGE_PIN" "$VLLM_SERVED_MODEL" "$VLLM_FLAGS"; do
            case "$pin" in
              "" )
                echo "::error::a required pin is empty; the pins job did not export it"
                exit 1 ;;
              *TBD* )
                echo "::error::pin.toml still carries an unresolved TBD value ($pin); complete "\
                     "the qualification in tests/integration/fixtures/claude-code-cli/pin.toml"
                exit 1 ;;
            esac
          done

      - name: Install and checksum pinned Claude Code executable
        run: |
          set -euo pipefail
          # The pinned archive is a single self-contained executable. If the
          # qualified pin is a tarball instead, add extraction here alongside the
          # checksum during qualification.
          download="$RUNNER_TEMP/claude.download"
          dest="$GITHUB_WORKSPACE/target/acceptance-bin/claude"
          mkdir -p "$(dirname "$dest")"
          curl -fsSL "$CLAUDE_URL" -o "$download"
          echo "${CLAUDE_SHA256}  ${download}" | sha256sum -c -
          # The GPU AMI denies exec from the Actions _temp mount after entering
          # a network namespace. Install beside the executable Rust artifacts.
          install -m 0755 "$download" "$dest"
          # Confirm the pinned version before anything else uses the binary.
          "$dest" --version | grep -F "$CLAUDE_VERSION"
          echo "PRAXIS_TEST_CLAUDE_CODE_BIN=$dest" >> "$GITHUB_ENV"

      - name: Generate ephemeral vLLM backend credential
        run: |
          # Prefix the random value so it can never begin with "-" and be
          # misparsed by vLLM's argparse as another command-line option.
          token="praxis-$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$token"
          echo "VLLM_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Start native-Anthropic vLLM with backend auth
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          gpu_args=()
          if [ "$CONTAINER_RUNTIME" = "podman" ]; then
            gpu_args=(--device nvidia.com/gpu=all)
          else
            gpu_args=(--gpus all)
          fi
          cache_mount="$GPU_HF_CACHE_DIR:/root/.cache/huggingface"
          if [ "$CONTAINER_RUNTIME" = "podman" ]; then
            cache_mount="${cache_mount}:Z"
          fi
          # Reuse the Qwen3-8B weights the full-suite job downloaded earlier on
          # this same ephemeral instance via a shared on-disk HF cache, so this
          # keyed container only pays CUDA init + weight load, not a ~16GB
          # re-download. On a run_claude_acceptance-only dispatch (no full suite)
          # the cache is cold and vLLM downloads the weights itself.
          mkdir -p "$GPU_HF_CACHE_DIR"
          "$CONTAINER_RUNTIME" pull "$VLLM_IMAGE_PIN"
          # Native Anthropic Messages serving (/v1/messages,
          # /v1/messages/count_tokens) is on by default in this image (verified
          # by the preflight below). --api-key makes vLLM require the same bearer
          # token Praxis injects, so unauthenticated upstream calls fail — the
          # credential-isolation proof this job uniquely provides.
          # shellcheck disable=SC2086
          "$CONTAINER_RUNTIME" run -d --name vllm \
            "${gpu_args[@]}" \
            -p 8000:8000 \
            -e HUGGING_FACE_HUB_TOKEN \
            -v "$cache_mount" \
            "$VLLM_IMAGE_PIN" \
            $VLLM_FLAGS \
            --served-model-name "$VLLM_SERVED_MODEL" \
            --api-key "$VLLM_API_KEY"

      - name: Preflight vLLM endpoints
        id: claude_vllm_preflight
        run: |
          set -euo pipefail
          echo "Waiting for vLLM..."
          # Allow a generous deadline: on a cold cache (run_claude_acceptance-only
          # dispatch) vLLM downloads ~16GB of Qwen3-8B weights before serving.
          deadline=$((SECONDS + 1200))
          until curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; do
            if ! "$CONTAINER_RUNTIME" inspect --format='{{.State.Running}}' vllm 2>/dev/null | grep -q true; then
              echo "::error::vLLM container exited before readiness"
              "$CONTAINER_RUNTIME" logs vllm 2>&1 || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::vLLM did not become ready within 1200s"
              "$CONTAINER_RUNTIME" logs vllm 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          auth="Authorization: Bearer ${VLLM_API_KEY}"
          curl -sf -H "$auth" http://127.0.0.1:8000/v1/models > /dev/null
          # Prove the native Messages surface is up and gated by the bearer token
          # (used by the native acceptance run).
          curl -sf -H "$auth" -H 'content-type: application/json' \
            -d "{\"model\":\"${VLLM_SERVED_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
            http://127.0.0.1:8000/v1/messages/count_tokens > /dev/null
          # Prove the OpenAI Chat Completions surface is up (used by the
          # transformed acceptance run, which rewrites /v1/messages to it).
          curl -sf -H "$auth" -H 'content-type: application/json' \
            -d "{\"model\":\"${VLLM_SERVED_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
            http://127.0.0.1:8000/v1/chat/completions > /dev/null
          echo "native and chat-completions endpoints ready"

      - name: Build Praxis and acceptance test
        run: |
          cargo build -p praxis-ai-proxy
          cargo test -p praxis-tests-integration --test suite --no-run

      - name: Create restricted network namespace
        id: claude_namespace
        run: |
          set -euo pipefail
          # The RHEL-family GPU AMI runs the GitHub runner as a service domain.
          # Enforcing SELinux rejects both the test veth connect and execution of
          # the checksum-verified downloaded CLI before the network namespace can
          # enforce the isolation this test is meant to prove. The EC2 security
          # group remains the host boundary, and the namespace still has no
          # default route. Restore enforcing mode in the always() cleanup step.
          if command -v getenforce >/dev/null 2>&1; then
            selinux_mode="$(getenforce)"
            echo "SELinux mode before Claude acceptance: $selinux_mode"
            if [ "$selinux_mode" = Enforcing ]; then
              sudo setenforce 0
              echo "CLAUDE_RESTORE_SELINUX=1" >> "$GITHUB_ENV"
            fi
          fi
          NS=praxis-claude-ns
          sudo ip netns add "$NS"
          sudo ip link add veth-host type veth peer name veth-ns
          sudo ip link set veth-ns netns "$NS"
          # The client lives in the namespace and reaches Praxis over the veth
          # pair, so Praxis binds the host-side veth address (10.200.0.1) rather
          # than loopback. vLLM stays host-side on loopback (127.0.0.1:8000).
          sudo ip addr add 10.200.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip -n "$NS" addr add 10.200.0.2/24 dev veth-ns
          sudo ip -n "$NS" link set veth-ns up
          sudo ip -n "$NS" link set lo up
          # The GPU AMI drops new traffic to the host across custom veths.
          # Admit only this namespace peer to the Praxis-bound host address;
          # the namespace still has no default route or other egress path.
          sudo iptables -I INPUT 1 -i veth-host -s 10.200.0.2 -d 10.200.0.1 -j ACCEPT
          # On firewalld/nftables hosts an ACCEPT from the iptables compatibility
          # chain is not final: a later firewalld base chain can still drop the
          # packet. Trust the dedicated interface there as well. The peer has no
          # default route, so this does not grant internet or vLLM reachability.
          if sudo firewall-cmd --state >/dev/null 2>&1; then
            sudo firewall-cmd --zone=trusted --add-interface=veth-host
            echo "CLAUDE_FIREWALLD_VETH=1" >> "$GITHUB_ENV"
          fi
          # Some AMIs enforce an additional native nftables input chain after
          # the iptables-compat chain. Insert the same narrow allow rule into
          # every IPv4-capable input base chain so a later policy cannot turn
          # the earlier ACCEPT into EACCES at connect(2).
          if command -v nft >/dev/null 2>&1; then
            sudo nft -j list ruleset | python3 -c '
          import json, sys
          for item in json.load(sys.stdin)["nftables"]:
              chain = item.get("chain", {})
              if chain.get("hook") == "input" and chain.get("family") in {"ip", "inet"}:
                  print(chain["family"], chain["table"], chain["name"], sep="\t")
          ' | while IFS=$'\t' read -r family table chain; do
              sudo nft insert rule "$family" "$table" "$chain" \
                iifname veth-host ip saddr 10.200.0.2 ip daddr 10.200.0.1 \
                accept comment '"praxis-claude-veth"'
            done
            echo "CLAUDE_NFT_VETH=1" >> "$GITHUB_ENV"
          fi
          # No default route and no DNS: the client can reach ONLY 10.200.0.1,
          # so it cannot bypass Praxis to talk to anything else. Prove it.
          if sudo ip -n "$NS" route show default | grep -q .; then
            echo "::error::namespace has a default route; egress is not blocked"
            sudo ip -n "$NS" route show
            exit 1
          fi
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "restricted namespace ready"

      - name: Locate compiled suite test binary
        id: claude_test_binary
        run: |
          set -uo pipefail
          # Locate the already-built suite binary without recompiling; both
          # acceptance runs below reuse it. Parse cargo's JSON with python3
          # (stdlib `json`, 3.9-safe) rather than jq, which the GPU AMI may lack.
          TEST_BIN=$(cargo test -p praxis-tests-integration --test suite --no-run \
              --message-format=json 2>/dev/null \
            | python3 -c 'import json,sys; objs=[json.loads(l) for l in sys.stdin if l.lstrip().startswith("{")]; paths=[o["executable"] for o in objs if o.get("executable") and o.get("target",{}).get("name")=="suite"]; print(paths[-1] if paths else "")')
          if [ -z "$TEST_BIN" ]; then
            echo "::error::could not locate the compiled suite test binary"
            exit 1
          fi
          echo "TEST_BIN=$TEST_BIN" >> "$GITHUB_ENV"

      - name: Run Claude Code native-vLLM acceptance test (once, no retry)
        env:
          PRAXIS_TEST_VLLM_BASE_URL: http://127.0.0.1:8000
          PRAXIS_TEST_VLLM_MODEL: ${{ env.VLLM_SERVED_MODEL }}
          PRAXIS_TEST_CLAUDE_CODE_NETNS: ${{ env.NS }}
          PRAXIS_TEST_LISTEN_ADDRESS: 10.200.0.1
          # Fail hard rather than silently skip: a Rust test that early-returns
          # reports as PASSED, so a variable dropped by `sudo --preserve-env`
          # would be a false green. REQUIRE_LIVE demands all live vars; the
          # egress guard demands the namespace be enforced.
          PRAXIS_TEST_CLAUDE_CODE_REQUIRE_LIVE: "1"
          PRAXIS_TEST_REQUIRE_EGRESS_ISOLATION: "1"
        run: |
          set -uo pipefail
          # The child enters the network namespace via `ip netns exec`, which
          # needs CAP_NET_ADMIN, so the test binary runs under sudo. Only the
          # native acceptance test runs, exactly once, with no retry.
          sudo --preserve-env=PRAXIS_TEST_CLAUDE_CODE_BIN,PRAXIS_TEST_VLLM_BASE_URL,PRAXIS_TEST_VLLM_MODEL,VLLM_API_KEY,PRAXIS_TEST_CLAUDE_CODE_NETNS,PRAXIS_TEST_LISTEN_ADDRESS,PRAXIS_TEST_CLAUDE_CODE_REQUIRE_LIVE,PRAXIS_TEST_REQUIRE_EGRESS_ISOLATION \
            "$TEST_BIN" \
            claude_code_vllm::pinned_claude_code_drives_native_vllm_through_full_flow \
            --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/acceptance-native.log"
          exit "${PIPESTATUS[0]}"

      - name: Run Claude Code transformed-vLLM acceptance test (once, no retry)
        if: ${{ always() && !cancelled() && steps.claude_vllm_preflight.outcome == 'success' && steps.claude_namespace.outcome == 'success' && steps.claude_test_binary.outcome == 'success' }}
        env:
          PRAXIS_TEST_VLLM_BASE_URL: http://127.0.0.1:8000
          PRAXIS_TEST_VLLM_MODEL: ${{ env.VLLM_SERVED_MODEL }}
          PRAXIS_TEST_CLAUDE_CODE_NETNS: ${{ env.NS }}
          PRAXIS_TEST_LISTEN_ADDRESS: 10.200.0.1
          PRAXIS_TEST_CLAUDE_CODE_REQUIRE_LIVE: "1"
          PRAXIS_TEST_REQUIRE_EGRESS_ISOLATION: "1"
        run: |
          set -uo pipefail
          # Same shared vLLM container and restricted namespace, run sequentially
          # after the native test so the two never contend for the runner. This
          # path routes through anthropic_messages_to_chat_completions to vLLM's
          # /v1/chat/completions surface. Runs once, no retry.
          sudo --preserve-env=PRAXIS_TEST_CLAUDE_CODE_BIN,PRAXIS_TEST_VLLM_BASE_URL,PRAXIS_TEST_VLLM_MODEL,VLLM_API_KEY,PRAXIS_TEST_CLAUDE_CODE_NETNS,PRAXIS_TEST_LISTEN_ADDRESS,PRAXIS_TEST_CLAUDE_CODE_REQUIRE_LIVE,PRAXIS_TEST_REQUIRE_EGRESS_ISOLATION \
            "$TEST_BIN" \
            claude_code_vllm::pinned_claude_code_drives_transformed_vllm_through_full_flow \
            --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/acceptance-transformed.log"
          exit "${PIPESTATUS[0]}"

      - name: Acceptance log tail on failure
        if: failure()
        run: |
          # Interleaved client and Praxis diagnostics for each run. The gateway
          # and native secrets are test constants, and Praxis does not emit auth
          # headers at the default log level, so these logs are safe to surface.
          for log in acceptance-native acceptance-transformed; do
            echo "=== $log ==="
            tail -n 400 "$RUNNER_TEMP/$log.log" 2>/dev/null || echo "no $log log captured"
          done

      - name: vLLM container logs on failure
        if: failure()
        run: |
          # Surface a tail inline and persist the full log for artifact upload.
          "$CONTAINER_RUNTIME" logs vllm > "$RUNNER_TEMP/vllm.log" 2>&1 || true
          tail -n 400 "$RUNNER_TEMP/vllm.log" 2>/dev/null || true

      - name: Upload acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-code-native-vllm-diagnostics
          # The gateway and native secrets are test constants and Praxis does not
          # emit auth headers at the default log level, so these logs are safe to
          # retain.
          path: |
            ${{ runner.temp }}/acceptance-native.log
            ${{ runner.temp }}/acceptance-transformed.log
            ${{ runner.temp }}/vllm.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down network namespace
        if: always()
        run: |
          if [ "${CLAUDE_FIREWALLD_VETH:-}" = 1 ]; then
            sudo firewall-cmd --zone=trusted --remove-interface=veth-host 2>/dev/null || true
          fi
          if [ "${CLAUDE_NFT_VETH:-}" = 1 ]; then
            sudo nft -j -a list ruleset | python3 -c '
          import json, sys
          for item in json.load(sys.stdin)["nftables"]:
              rule = item.get("rule", {})
              if rule.get("comment") == "praxis-claude-veth":
                  print(rule["family"], rule["table"], rule["chain"], rule["handle"], sep="\t")
          ' | while IFS=$'\t' read -r family table chain handle; do
              sudo nft delete rule "$family" "$table" "$chain" handle "$handle" 2>/dev/null || true
            done
          fi
          sudo iptables -D INPUT -i veth-host -s 10.200.0.2 -d 10.200.0.1 -j ACCEPT 2>/dev/null || true
          sudo ip netns del praxis-claude-ns 2>/dev/null || true
          sudo ip link del veth-host 2>/dev/null || true
          if [ "${CLAUDE_RESTORE_SELINUX:-}" = 1 ]; then
            sudo setenforce 1
          fi

      - name: Stop vLLM
        if: always()
        run: |
          "${CONTAINER_RUNTIME:-docker}" rm -f vllm || true

  # ----------------------------------------------------------------------------
  # Pinned Codex drives both native Responses and translated Chat Completions
  # paths against real vLLM.
  #
  # This complements the required deterministic #1223 scripted-backend test:
  # that test remains the provider-wire oracle, while this job proves the real
  # pinned client can select and execute a coding tool through Praxis against
  # Qwen3-8B. The child runs in a namespace whose only route reaches Praxis, and
  # vLLM requires a provider credential Codex never receives, proving Praxis
  # replaced the gateway credential. It reuses the full suite's on-disk model
  # cache when available and starts its own keyed container sequentially.
  # -----------------------------------------------------------------------------

  vllm-gpu-codex-acceptance:
    name: Codex acceptance on real vLLM (GPU)
    needs: [gpu-start-runner, vllm-gpu-full-suite]
    if: |
      !cancelled() &&
      needs.gpu-start-runner.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.run_live_vllm || inputs.run_codex_acceptance)
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'vllm-full-suite'
        )
      )
    runs-on: ${{ needs.gpu-start-runner.outputs.label }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CODEX_ARCHIVE: codex-x86_64-unknown-linux-musl.tar.gz
      CODEX_BIN: codex-x86_64-unknown-linux-musl
      CODEX_VERSION: 0.144.1
      CODEX_VLLM_MODEL: qwen3-8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify GPU and container runtime
        run: |
          nvidia-smi
          if command -v docker >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"
            docker info >/dev/null
          elif command -v podman >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=podman" >> "$GITHUB_ENV"
            podman info >/dev/null
          else
            echo "Neither docker nor podman is available on this runner" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          cache-suffix: codex-gpu-acceptance-cargo

      - name: Start PostgreSQL response store for native Codex
        run: |
          set -euo pipefail
          "$CONTAINER_RUNTIME" rm -f praxis-postgres >/dev/null 2>&1 || true
          "$CONTAINER_RUNTIME" pull docker.io/library/postgres:17-alpine
          "$CONTAINER_RUNTIME" run --detach --name praxis-postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=praxis \
            -e POSTGRES_PASSWORD=praxis \
            -e POSTGRES_DB=praxis \
            docker.io/library/postgres:17-alpine
          deadline=$((SECONDS + 120))
          until "$CONTAINER_RUNTIME" exec praxis-postgres pg_isready -U praxis -d praxis >/dev/null 2>&1; do
            if ! "$CONTAINER_RUNTIME" inspect --format='{{.State.Running}}' praxis-postgres 2>/dev/null | grep -q true; then
              echo "::error::PostgreSQL exited before becoming ready"
              "$CONTAINER_RUNTIME" logs praxis-postgres 2>&1 || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::PostgreSQL did not become ready within 120s"
              "$CONTAINER_RUNTIME" logs praxis-postgres 2>&1 || true
              exit 1
            fi
            sleep 2
          done

      - name: Download and verify pinned Codex CLI
        run: |
          set -euo pipefail
          codex_dir="$RUNNER_TEMP/codex-$CODEX_VERSION"
          mkdir -p "$codex_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$codex_dir/$CODEX_ARCHIVE" \
            "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/${CODEX_ARCHIVE}"
          (
            cd "$codex_dir"
            sha256sum --check \
              "$GITHUB_WORKSPACE/tests/integration/fixtures/codex-cli/${CODEX_VERSION}-x86_64-unknown-linux-musl.sha256"
          )
          tar --extract --gzip --file "$codex_dir/$CODEX_ARCHIVE" --directory "$codex_dir"
          dest="$GITHUB_WORKSPACE/target/acceptance-bin/codex"
          mkdir -p "$(dirname "$dest")"
          # The GPU AMI denies exec from the Actions _temp mount after entering
          # a network namespace. Install beside the executable Rust artifacts.
          install -m 0755 "$codex_dir/$CODEX_BIN" "$dest"
          test "$("$dest" --version)" = "codex-cli $CODEX_VERSION"
          echo "PRAXIS_TEST_CODEX_BIN=$dest" >> "$GITHUB_ENV"

      - name: Generate ephemeral vLLM backend credential
        run: |
          # Prefix the random value so it can never begin with "-" and be
          # misparsed by vLLM's argparse as another command-line option.
          token="praxis-$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$token"
          echo "CODEX_BACKEND_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start keyed vLLM for Codex
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          set -euo pipefail
          gpu_args=()
          if [ "$CONTAINER_RUNTIME" = "podman" ]; then
            gpu_args=(--device nvidia.com/gpu=all)
          else
            gpu_args=(--gpus all)
          fi
          cache_mount="$GPU_HF_CACHE_DIR:/root/.cache/huggingface"
          if [ "$CONTAINER_RUNTIME" = "podman" ]; then
            cache_mount="${cache_mount}:Z"
          fi
          mkdir -p "$GPU_HF_CACHE_DIR"
          "$CONTAINER_RUNTIME" pull "$VLLM_GPU_IMAGE"
          "$CONTAINER_RUNTIME" run -d --name vllm \
            "${gpu_args[@]}" \
            -p 8000:8000 \
            -e HUGGING_FACE_HUB_TOKEN \
            -v "$cache_mount" \
            "$VLLM_GPU_IMAGE" \
            --model "$VLLM_GPU_MODEL" \
            --served-model-name "$CODEX_VLLM_MODEL" \
            --max-model-len 16384 \
            --enable-auto-tool-choice \
            --tool-call-parser hermes \
            --reasoning-parser deepseek_r1 \
            --gpu-memory-utilization 0.9 \
            --seed 0 \
            --api-key "$CODEX_BACKEND_TOKEN"

      - name: Preflight vLLM Responses and Chat Completions
        id: codex_vllm_preflight
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          until curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; do
            if ! "$CONTAINER_RUNTIME" inspect --format='{{.State.Running}}' vllm 2>/dev/null | grep -q true; then
              echo "::error::vLLM container exited before readiness"
              "$CONTAINER_RUNTIME" logs vllm 2>&1 || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::vLLM did not become ready within 1200s"
              "$CONTAINER_RUNTIME" logs vllm 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          auth="Authorization: Bearer ${CODEX_BACKEND_TOKEN}"
          curl -sf -H "$auth" http://127.0.0.1:8000/v1/models >/dev/null
          curl -sf -H "$auth" -H 'content-type: application/json' \
            -d "{\"model\":\"${CODEX_VLLM_MODEL}\",\"input\":\"reply ready /no_think\",\"max_output_tokens\":64}" \
            http://127.0.0.1:8000/v1/responses >/dev/null
          curl -sf -H "$auth" -H 'content-type: application/json' \
            -d "{\"model\":\"${CODEX_VLLM_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"reply ready\"}],\"max_tokens\":1}" \
            http://127.0.0.1:8000/v1/chat/completions >/dev/null

      - name: Build Praxis and Codex acceptance test
        run: |
          cargo build -p praxis-ai-proxy
          cargo test -p praxis-tests-integration --test suite --no-run

      - name: Create restricted Codex network namespace
        id: codex_namespace
        run: |
          set -euo pipefail
          # See the Claude acceptance namespace above. The namespace and random
          # backend credential are the isolation controls under test; SELinux on
          # this AMI otherwise blocks the staged pinned CLI before it can run.
          if command -v getenforce >/dev/null 2>&1; then
            selinux_mode="$(getenforce)"
            echo "SELinux mode before Codex acceptance: $selinux_mode"
            if [ "$selinux_mode" = Enforcing ]; then
              sudo setenforce 0
              echo "CODEX_RESTORE_SELINUX=1" >> "$GITHUB_ENV"
            fi
          fi
          NS=praxis-codex-ns
          sudo ip netns add "$NS"
          sudo ip link add codex-veth-host type veth peer name codex-veth-ns
          sudo ip link set codex-veth-ns netns "$NS"
          sudo ip addr add 10.201.0.1/24 dev codex-veth-host
          sudo ip link set codex-veth-host up
          sudo ip -n "$NS" addr add 10.201.0.2/24 dev codex-veth-ns
          sudo ip -n "$NS" link set codex-veth-ns up
          sudo ip -n "$NS" link set lo up
          sudo iptables -I INPUT 1 -i codex-veth-host -s 10.201.0.2 -d 10.201.0.1 -j ACCEPT
          if sudo firewall-cmd --state >/dev/null 2>&1; then
            sudo firewall-cmd --zone=trusted --add-interface=codex-veth-host
            echo "CODEX_FIREWALLD_VETH=1" >> "$GITHUB_ENV"
          fi
          if command -v nft >/dev/null 2>&1; then
            sudo nft -j list ruleset | python3 -c '
          import json, sys
          for item in json.load(sys.stdin)["nftables"]:
              chain = item.get("chain", {})
              if chain.get("hook") == "input" and chain.get("family") in {"ip", "inet"}:
                  print(chain["family"], chain["table"], chain["name"], sep="\t")
          ' | while IFS=$'\t' read -r family table chain; do
              sudo nft insert rule "$family" "$table" "$chain" \
                iifname codex-veth-host ip saddr 10.201.0.2 ip daddr 10.201.0.1 \
                accept comment '"praxis-codex-veth"'
            done
            echo "CODEX_NFT_VETH=1" >> "$GITHUB_ENV"
          fi
          if sudo ip -n "$NS" route show default | grep -q .; then
            echo "::error::Codex namespace has a default route" >&2
            exit 1
          fi
          if sudo ip -n "$NS" route get 1.1.1.1 >/dev/null 2>&1; then
            echo "::error::Codex namespace can route to the public internet" >&2
            exit 1
          fi
          echo "CODEX_NS=$NS" >> "$GITHUB_ENV"

      - name: Locate compiled suite test binary
        id: codex_test_binary
        run: |
          set -uo pipefail
          TEST_BIN=$(cargo test -p praxis-tests-integration --test suite --no-run \
              --message-format=json 2>/dev/null \
            | python3 -c 'import json,sys; objs=[json.loads(l) for l in sys.stdin if l.lstrip().startswith("{")]; paths=[o["executable"] for o in objs if o.get("executable") and o.get("target",{}).get("name")=="suite"]; print(paths[-1] if paths else "")')
          if [ -z "$TEST_BIN" ]; then
            echo "::error::could not locate the compiled suite test binary"
            exit 1
          fi
          echo "TEST_BIN=$TEST_BIN" >> "$GITHUB_ENV"

      - name: Run Codex native-Responses vLLM acceptance test (once, no retry)
        env:
          PRAXIS_TEST_CODEX_VLLM_BASE_URL: http://127.0.0.1:8000
          PRAXIS_TEST_CODEX_VLLM_MODEL: ${{ env.CODEX_VLLM_MODEL }}
          PRAXIS_TEST_CODEX_DATABASE_URL: postgres://praxis:praxis@127.0.0.1:5432/praxis
          PRAXIS_TEST_CODEX_NETNS: ${{ env.CODEX_NS }}
          PRAXIS_TEST_CODEX_LISTEN_ADDRESS: 10.201.0.1
          PRAXIS_TEST_CODEX_REQUIRE_LIVE: "1"
          PRAXIS_TEST_REQUIRE_EGRESS_ISOLATION: "1"
        run: |
          set -uo pipefail
          sudo --preserve-env=PRAXIS_TEST_CODEX_BIN,PRAXIS_TEST_CODEX_VLLM_BASE_URL,PRAXIS_TEST_CODEX_VLLM_MODEL,PRAXIS_TEST_CODEX_DATABASE_URL,CODEX_BACKEND_TOKEN,PRAXIS_TEST_CODEX_NETNS,PRAXIS_TEST_CODEX_LISTEN_ADDRESS,PRAXIS_TEST_CODEX_REQUIRE_LIVE,PRAXIS_TEST_REQUIRE_EGRESS_ISOLATION \
            "$TEST_BIN" \
            codex_http::pinned_codex_completes_native_vllm_coding_workflow_over_http \
            --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/codex-acceptance-native.log"
          exit "${PIPESTATUS[0]}"

      - name: Run Codex translated-Chat vLLM acceptance test (once, no retry)
        if: ${{ always() && !cancelled() && steps.codex_vllm_preflight.outcome == 'success' && steps.codex_namespace.outcome == 'success' && steps.codex_test_binary.outcome == 'success' }}
        env:
          PRAXIS_TEST_CODEX_VLLM_BASE_URL: http://127.0.0.1:8000
          PRAXIS_TEST_CODEX_VLLM_MODEL: ${{ env.CODEX_VLLM_MODEL }}
          PRAXIS_TEST_CODEX_DATABASE_URL: postgres://praxis:praxis@127.0.0.1:5432/praxis
          PRAXIS_TEST_CODEX_NETNS: ${{ env.CODEX_NS }}
          PRAXIS_TEST_CODEX_LISTEN_ADDRESS: 10.201.0.1
          PRAXIS_TEST_CODEX_REQUIRE_LIVE: "1"
          PRAXIS_TEST_REQUIRE_EGRESS_ISOLATION: "1"
        run: |
          set -uo pipefail
          sudo --preserve-env=PRAXIS_TEST_CODEX_BIN,PRAXIS_TEST_CODEX_VLLM_BASE_URL,PRAXIS_TEST_CODEX_VLLM_MODEL,PRAXIS_TEST_CODEX_DATABASE_URL,CODEX_BACKEND_TOKEN,PRAXIS_TEST_CODEX_NETNS,PRAXIS_TEST_CODEX_LISTEN_ADDRESS,PRAXIS_TEST_CODEX_REQUIRE_LIVE,PRAXIS_TEST_REQUIRE_EGRESS_ISOLATION \
            "$TEST_BIN" \
            codex_http::pinned_codex_completes_translated_vllm_coding_workflow_over_http \
            --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/codex-acceptance-translated.log"
          exit "${PIPESTATUS[0]}"

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          "$CONTAINER_RUNTIME" logs vllm > "$RUNNER_TEMP/codex-vllm.log" 2>&1 || true
          "$CONTAINER_RUNTIME" logs praxis-postgres > "$RUNNER_TEMP/codex-postgres.log" 2>&1 || true
          for log in codex-acceptance-native codex-acceptance-translated; do
            echo "=== $log ==="
            tail -n 400 "$RUNNER_TEMP/$log.log" 2>/dev/null || true
          done
          echo "=== vLLM ==="
          tail -n 400 "$RUNNER_TEMP/codex-vllm.log" 2>/dev/null || true
          echo "=== PostgreSQL ==="
          tail -n 200 "$RUNNER_TEMP/codex-postgres.log" 2>/dev/null || true

      - name: Upload Codex acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-vllm-gpu-diagnostics
          path: |
            ${{ runner.temp }}/codex-acceptance-native.log
            ${{ runner.temp }}/codex-acceptance-translated.log
            ${{ runner.temp }}/codex-vllm.log
            ${{ runner.temp }}/codex-postgres.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down Codex network namespace
        if: always()
        run: |
          if [ "${CODEX_FIREWALLD_VETH:-}" = 1 ]; then
            sudo firewall-cmd --zone=trusted --remove-interface=codex-veth-host 2>/dev/null || true
          fi
          if [ "${CODEX_NFT_VETH:-}" = 1 ]; then
            sudo nft -j -a list ruleset | python3 -c '
          import json, sys
          for item in json.load(sys.stdin)["nftables"]:
              rule = item.get("rule", {})
              if rule.get("comment") == "praxis-codex-veth":
                  print(rule["family"], rule["table"], rule["chain"], rule["handle"], sep="\t")
          ' | while IFS=$'\t' read -r family table chain handle; do
              sudo nft delete rule "$family" "$table" "$chain" handle "$handle" 2>/dev/null || true
            done
          fi
          sudo iptables -D INPUT -i codex-veth-host -s 10.201.0.2 -d 10.201.0.1 -j ACCEPT 2>/dev/null || true
          sudo ip netns del praxis-codex-ns 2>/dev/null || true
          sudo ip link del codex-veth-host 2>/dev/null || true
          if [ "${CODEX_RESTORE_SELINUX:-}" = 1 ]; then
            sudo setenforce 1
          fi

      - name: Stop vLLM
        if: always()
        run: |
          "${CONTAINER_RUNTIME:-docker}" rm -f vllm || true

      - name: Stop PostgreSQL
        if: always()
        run: |
          "${CONTAINER_RUNTIME:-docker}" rm -f praxis-postgres || true

  # ----------------------------------------------------------------------------
  # Complete live vLLM Responses suite on a real GPU. Runs nightly, on a
  # `run_live_vllm` dispatch, and on a vllm-full-suite PR label. An ephemeral
  # EC2 g4dn.xlarge runner is provisioned for the run and torn down
  # unconditionally afterwards.
  # ----------------------------------------------------------------------------

  gpu-start-runner:
    name: Start ephemeral EC2 GPU runner
    if: |
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.run_live_vllm || inputs.run_claude_acceptance || inputs.run_codex_acceptance)
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'vllm-full-suite'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start EC2 GPU runner
        id: start
        uses: ./.github/actions/start-ec2-runner
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          ami-id: ${{ vars.AWS_GPU_AMI_ID }}
          subnet-id: ${{ vars.AWS_SUBNET_ID || vars.US_EAST_2A_SUBNET_ID }}
          security-group-id: ${{ vars.AWS_SECURITY_GROUP_ID || vars.US_EAST_2_SG_ID }}
          instance-type: ${{ inputs.gpu_instance_type || env.GPU_INSTANCE_TYPE }}
          github-token: ${{ secrets.PRAXIS_RUNNER_PAT }}

  vllm-gpu-full-suite:
    name: Run complete live vLLM Responses suite (GPU)
    needs: [gpu-start-runner]
    # Runs on schedule, a run_live_vllm dispatch, or a vllm-full-suite label —
    # but NOT on an acceptance-only dispatch, which starts the runner purely for
    # pinned Claude/Codex validation and must skip the ~90-minute suite.
    if: |
      !cancelled() &&
      needs.gpu-start-runner.result == 'success' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_live_vllm) ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'vllm-full-suite'
        )
      )
    runs-on: ${{ needs.gpu-start-runner.outputs.label }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify GPU and container runtime
        run: |
          nvidia-smi
          if command -v docker >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"
            docker info >/dev/null
          elif command -v podman >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=podman" >> "$GITHUB_ENV"
            podman info >/dev/null
          else
            echo "Neither docker nor podman is available on this runner" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Start PostgreSQL response store
        run: |
          set -euo pipefail
          "$CONTAINER_RUNTIME" pull docker.io/library/postgres:17-alpine
          "$CONTAINER_RUNTIME" run --detach --name praxis-postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=praxis \
            -e POSTGRES_PASSWORD=praxis \
            -e POSTGRES_DB=praxis \
            docker.io/library/postgres:17-alpine
          deadline=$((SECONDS + 120))
          until "$CONTAINER_RUNTIME" exec praxis-postgres pg_isready -U praxis -d praxis >/dev/null 2>&1; do
            if ! "$CONTAINER_RUNTIME" inspect --format='{{.State.Running}}' praxis-postgres 2>/dev/null | grep -q true; then
              echo "::error::PostgreSQL container exited before readiness"
              "$CONTAINER_RUNTIME" logs praxis-postgres 2>&1 || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::PostgreSQL did not become ready within 120s"
              "$CONTAINER_RUNTIME" logs praxis-postgres 2>&1 || true
              exit 1
            fi
            sleep 2
          done

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The GPU AMI ships Python 3.9; ogx[starter] needs >=3.12, so pin the
          # interpreter setup-uv provisions. Cache is repo-scoped (GH cache
          # service), so it still warms across ephemeral runners.
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            tests/integration/ogx-constraints.txt

      - name: Start vLLM on GPU (background)
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: |
          # Background the image pull + container launch so the multi-GB CUDA
          # image download and model weight load overlap `cargo build` below.
          # `run -d` needs the image present, so pull and run are chained in one
          # detached subshell; the readiness wait then joins on the serving port.
          # Runtime, image, model and GPU flags are passed positionally so they
          # expand in the inner shell without leaking outer-shell quoting.
          gpu_args=()
          if [ "$CONTAINER_RUNTIME" = "podman" ]; then
            gpu_args=(--device nvidia.com/gpu=all)
          else
            gpu_args=(--gpus all)
          fi
          # Persist the HF weight cache on the instance so the later Claude Code
          # acceptance job (a second job on this same ephemeral runner) loads
          # Qwen3-8B from disk instead of re-downloading ~16GB.
          mkdir -p "$GPU_HF_CACHE_DIR"
          cache_mount="$GPU_HF_CACHE_DIR:/root/.cache/huggingface"
          if [ "$CONTAINER_RUNTIME" = "podman" ]; then
            # The GPU AMI enforces SELinux; relabel the host directory so the
            # rootless container can populate and reuse the model cache.
            cache_mount="${cache_mount}:Z"
          fi
          gpu_args+=(-v "$cache_mount")

          # The single-quoted body is the inner script; $1/$runtime/... expand
          # there, not in this outer shell, which is the whole point.
          # shellcheck disable=SC2016
          nohup bash -c '
            set -euo pipefail
            runtime="$1"; image="$2"; model="$3"; shift 3
            "$runtime" pull "$image"
            "$runtime" run -d --name vllm \
              "$@" \
              -p 8000:8000 \
              -e HUGGING_FACE_HUB_TOKEN \
              "$image" \
              --model "$model" \
              --max-model-len 16384 \
              --served-model-name "$model" \
              --enable-auto-tool-choice \
              --tool-call-parser hermes \
              --reasoning-parser deepseek_r1 \
              --gpu-memory-utilization 0.9
          ' bash "$CONTAINER_RUNTIME" "$VLLM_GPU_IMAGE" "$VLLM_GPU_MODEL" "${gpu_args[@]}" \
            > /tmp/vllm-launch.log 2>&1 &
          echo $! > /tmp/vllm-launch.pid
          echo "vLLM launch (pull + run) started in background, pid $(cat /tmp/vllm-launch.pid)"

      - name: Pre-install OGX dependencies
        run: |
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx --help > /dev/null

      - name: Start OGX
        run: |
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx run starter --insecure > /tmp/ogx.log 2>&1 &
          echo $! > /tmp/ogx.pid

      - name: Build Praxis
        run: cargo build -p praxis-ai-proxy

      - name: Wait for vLLM readiness
        run: |
          # The image pull + container launch run in the background so they can
          # overlap `cargo build`; join on them here. Model weights download from
          # Hugging Face on first start, so allow a generous deadline. Poll the
          # serving endpoints directly (runtime agnostic), but fail fast if the
          # background launcher exited before the port ever came up (bad pull,
          # OOM on load) rather than waiting out the whole deadline.
          dump_launch_log() {
            echo "----- /tmp/vllm-launch.log -----"
            cat /tmp/vllm-launch.log 2>/dev/null || echo "No vLLM launch log found"
          }
          echo "Waiting for vLLM health and model endpoints..."
          launch_pid="$(cat /tmp/vllm-launch.pid)"
          deadline=$((SECONDS + 1200))
          until curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1 && \
                curl -sf http://127.0.0.1:8000/v1/models > /dev/null 2>&1; do
            if ! kill -0 "$launch_pid" 2>/dev/null; then
              # `podman run -d` exits successfully as soon as it creates the
              # container, often before vLLM binds its port. Only fail when the
              # launcher is gone AND no running container remains.
              if ! "$CONTAINER_RUNTIME" inspect --format='{{.State.Running}}' vllm 2>/dev/null | grep -q true; then
                echo "::error::vLLM launcher exited without a running container"
                dump_launch_log
                exit 1
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::vLLM did not become ready within 1200s"
              dump_launch_log
              exit 1
            fi
            sleep 5
          done
          echo "vLLM is ready"
          curl -sf http://127.0.0.1:8000/v1/models | head -c 500
          echo

      - name: Wait for OGX readiness
        run: |
          dump_ogx_log() {
            echo "----- /tmp/ogx.log (tail -n 200) -----"
            tail -n 200 /tmp/ogx.log 2>/dev/null || echo "No OGX log found"
          }
          OGX_PID="$(cat /tmp/ogx.pid)"
          deadline=$((SECONDS + 300))
          until curl -sf http://127.0.0.1:8321/v1/files > /dev/null 2>&1; do
            if ! kill -0 "$OGX_PID" 2>/dev/null; then
              echo "::error::OGX process (pid $OGX_PID) exited before binding port 8321"
              dump_ogx_log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::OGX did not become ready within 300s"
              dump_ogx_log
              exit 1
            fi
            sleep 2
          done
          echo "OGX is ready"

      - name: Run complete live vLLM Responses suite
        env:
          DATABASE_URL: postgres://praxis:praxis@127.0.0.1:5432/praxis
          VLLM_TEST_BACKEND: live
          VLLM_MODEL: ${{ env.VLLM_GPU_MODEL }}
        run: |
          uv run tests/integration/sdk/openai/test_openai_responses_vllm.py -s \
            -k "not live_tavily_web_search_returns_real_sources"

      - name: Run credentialed live Tavily web search
        env:
          DATABASE_URL: postgres://praxis:praxis@127.0.0.1:5432/praxis
          # The generated YAML keeps the ${TAVILY_API_KEY} reference, so the
          # secret is consumed only by this one-test process and is never written
          # into or printed with the config.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Scheduled/manual full runs are controlled environments and must prove
          # the real provider path. Labeled fork PRs do not receive secrets, so
          # they retain deterministic coverage and skip only this credentialed test.
          PRAXIS_TEST_REQUIRE_LIVE_WEB_SEARCH: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          VLLM_TEST_BACKEND: live
          VLLM_MODEL: ${{ env.VLLM_GPU_MODEL }}
        run: |
          uv run tests/integration/sdk/openai/test_openai_responses_vllm.py -s \
            -k live_tavily_web_search_returns_real_sources

      - name: vLLM container logs
        if: failure()
        run: |
          "$CONTAINER_RUNTIME" logs vllm 2>&1 || echo "(no vllm container)"

      - name: OGX logs
        if: failure()
        run: cat /tmp/ogx.log 2>/dev/null || echo "No OGX log found"

      - name: PostgreSQL logs
        if: failure()
        run: |
          "$CONTAINER_RUNTIME" logs praxis-postgres 2>&1 || echo "(no PostgreSQL container)"

      - name: Stop vLLM
        if: always()
        run: |
          "$CONTAINER_RUNTIME" rm -f vllm || true

      - name: Stop PostgreSQL
        if: always()
        run: |
          "${CONTAINER_RUNTIME:-docker}" rm -f praxis-postgres || true

      - name: Stop OGX
        if: always()
        run: |
          if [ -f /tmp/ogx.pid ]; then
            kill "$(cat /tmp/ogx.pid)" 2>/dev/null || true
          fi

  gpu-stop-runner:
    name: Stop ephemeral EC2 GPU runner
    # MUST depend on every job that runs on the instance; otherwise the runner
    # could be deregistered while an acceptance job is still queued/running.
    needs:
      - gpu-start-runner
      - vllm-gpu-full-suite
      - vllm-gpu-claude-acceptance
      - vllm-gpu-codex-acceptance
    # Always tear down the instance, even on failure/cancel, but skip when the
    # runner was never started (non-GPU triggers).
    if: always() && needs.gpu-start-runner.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop EC2 GPU runner
        uses: ./.github/actions/stop-ec2-runner
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          github-token: ${{ secrets.PRAXIS_RUNNER_PAT }}
          label: ${{ needs.gpu-start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.gpu-start-runner.outputs.ec2-instance-id }}

  # ----------------------------------------------------------------------------
  # Fast Responses API integration tests with PostgreSQL store backend
  # ----------------------------------------------------------------------------

  vllm-responses-postgres:
    needs: [changes]
    if: |
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.action != 'labeled') &&
      (github.event_name != 'workflow_dispatch' || !inputs.run_live_vllm) &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --filter "label!=com.github.actions.runner"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Persist uv's wheel/download cache across runs so the multi-GB OGX
          # closure (torch, CUDA, faiss, transformers) is not re-downloaded every
          # run. Key ONLY on the pins file: setup-uv has no restore-key/prefix
          # fallback, so any globbed file that changes forces a full cold
          # re-download (~8 min). The workflow YAML and test files are
          # deliberately NOT globbed -- editing them must not bust the cache; uv
          # still downloads any small new PEP-723 test dep incrementally on top
          # of the restored cache.
          enable-cache: true
          cache-dependency-glob: |
            tests/integration/ogx-constraints.txt

      - name: Start inference simulator
        run: |
          docker run --detach --name inference-sim --network host \
            "$INFERENCE_SIM_IMAGE" \
            --model="$INFERENCE_SIM_MODEL" \
            --served-model-name="$INFERENCE_SIM_MODEL" \
            --mode=echo \
            --max-model-len=8192 \
            --skip-tool-validation \
            --port=8000

      - name: Pre-install OGX dependencies
        run: |
          # Resolve + download the full OGX dependency closure (torch, CUDA
          # wheels, faiss, transformers, ...) synchronously and OFF the readiness
          # clock. Without this the download runs backgrounded inside the
          # "Wait for OGX readiness" window and loses the race under network
          # variance, so the server never binds port 8321 in time (exit 124).
          echo "Pre-installing OGX from $OGX_CONSTRAINTS..."
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx --help > /dev/null
          echo "OGX environment ready"

      - name: Start OGX
        run: |
          # Same "$OGX_CONSTRAINTS" as the pre-install above, so uv reuses the
          # already materialized environment and the server binds within seconds.
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx run starter --insecure > /tmp/ogx.log 2>&1 &
          echo $! > /tmp/ogx.pid

      - name: Build Praxis
        run: |
          cargo build -p praxis-ai-proxy
          cargo build -p praxis-test-utils --example conversations_tenant_proxy

      - name: Wait for inference simulator readiness
        run: |
          simulator_ready=false
          for _ in {1..60}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1 && \
               curl -sf http://127.0.0.1:8000/v1/models > /dev/null 2>&1; then
              simulator_ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' inference-sim)" != true ]; then
              echo "::error::inference simulator exited before becoming ready"
              docker logs inference-sim 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          if [ "$simulator_ready" != true ]; then
            echo "::error::inference simulator did not become ready within 60s"
            docker logs inference-sim 2>&1 || true
            exit 1
          fi

      - name: Run Conversations SDK integration tests (PostgreSQL store)
        env:
          DATABASE_URL: postgres://praxis:praxis@127.0.0.1:5432/praxis
          PRAXIS_TENANT_TEST_BIN: target/debug/examples/conversations_tenant_proxy
          VLLM_MODEL: ${{ env.INFERENCE_SIM_MODEL }}
        run: |
          uv run tests/integration/sdk/openai/test_openai_conversations.py -s

      - name: Wait for OGX readiness
        run: |
          echo "Waiting for OGX server..."
          # Poll in the current shell (no nested `bash -c`) so we can both bound
          # the wait and check process liveness: fail fast if the backgrounded
          # OGX process dies, and dump the log inline so a readiness failure is
          # diagnosable from this step (mirrors the vLLM liveness check, which
          # previously produced only an opaque exit 124 here).
          dump_ogx_log() {
            echo "----- /tmp/ogx.log (tail -n 200) -----"
            tail -n 200 /tmp/ogx.log 2>/dev/null || echo "No OGX log found"
          }
          OGX_PID="$(cat /tmp/ogx.pid)"
          deadline=$((SECONDS + 300))
          until curl -sf http://127.0.0.1:8321/v1/files > /dev/null 2>&1; do
            if ! kill -0 "$OGX_PID" 2>/dev/null; then
              echo "::error::OGX process (pid $OGX_PID) exited before binding port 8321"
              dump_ogx_log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::OGX did not become ready within 300s"
              dump_ogx_log
              exit 1
            fi
            sleep 2
          done
          echo "OGX is ready"

      - name: Run simulated Responses integration tests (PostgreSQL store)
        env:
          DATABASE_URL: postgres://praxis:praxis@127.0.0.1:5432/praxis
          VLLM_MODEL: ${{ env.INFERENCE_SIM_MODEL }}
          VLLM_TEST_BACKEND: simulator
        run: |
          test_cmd=(
            uv run tests/integration/sdk/openai/test_openai_responses_vllm.py
            -s -m "not real_inference and not vllm_compat"
          )
          if "${test_cmd[@]}"; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "merge_group" ]; then
            exit 1
          fi
          echo "::warning::Retrying failed simulator tests once for the merge queue"
          "${test_cmd[@]}" --last-failed --last-failed-no-failures none

      - name: Inference simulator logs
        if: failure()
        run: docker logs inference-sim 2>&1 || echo "(no simulator container)"

      - name: OGX logs
        if: failure()
        run: cat /tmp/ogx.log 2>/dev/null || echo "No OGX log found"

      - name: Stop inference simulator
        if: always()
        run: docker rm -f inference-sim || true

      - name: Stop OGX
        if: always()
        run: |
          if [ -f /tmp/ogx.pid ]; then
            kill "$(cat /tmp/ogx.pid)" 2>/dev/null || true
          fi
