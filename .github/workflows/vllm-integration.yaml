name: vLLM Integration
run-name: >-
  ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'vllm-full-suite' &&
      format('vLLM full suite label - PR #{0}', github.event.pull_request.number) ||
      format('vLLM Integration - {0}', github.ref_name) }}

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - "apis/src/openai/responses/**"
      - "apis/src/openai/conversations/**"
      - "apis/src/openai/sse/**"
      - "apis/src/store/**"
      - "server/**"
      - "tests/integration/sdk/openai/**"
      - "tests/utils/examples/conversations_tenant_proxy.rs"
      - "tests/integration/ogx-constraints.txt"
      - "examples/configs/openai/responses/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/actions/start-vllm/**"
      - ".github/actions/wait-vllm/**"
      - ".github/workflows/vllm-integration.yaml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    branches: [main]
  schedule:
    # Avoid overlapping the repository's 02:47 UTC nightly workflow and
    # 03:02 UTC CodeQL schedule.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      run_live_vllm:
        description: Run the complete Responses SDK suite only against live CPU vLLM
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  VLLM_IMAGE: "quay.io/opendatahub/vllm-cpu:Qwen3-0.6B-granite-embedding-125m-english@sha256:0212dc82981178033cb71c7477ba8ad1998fb6c0b1ee40646119fb9724ac951b"
  VLLM_MODEL: "Qwen/Qwen3-0.6B"
  # llm-d-inference-sim v0.11.2 multi-architecture image index.
  INFERENCE_SIM_IMAGE: "ghcr.io/llm-d/llm-d-inference-sim@sha256:32144df791330a0006b747edfdf2b114a0fe728e023a9d1b3463eeb48d32abb9"
  INFERENCE_SIM_MODEL: "praxis-test-model"
  # OGX + transformers pins live in tests/integration/ogx-constraints.txt (with
  # the rationale for each pin). Single-sourcing them there lets the uv download
  # cache key depend only on the pins, so editing this workflow or a test file
  # no longer forces a cold multi-GB OGX re-download. Both OGX steps install from
  # this file via `uv run --with-requirements`.
  OGX_CONSTRAINTS: "tests/integration/ogx-constraints.txt"

jobs:
  # ----------------------------------------------------------------------------
  # Path filter for pull_request and merge_group. The pull_request trigger is
  # intentionally unfiltered so a vllm-full-suite label can request a run on
  # any PR; ordinary PR events still avoid the expensive jobs when irrelevant.
  # ----------------------------------------------------------------------------

  changes:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant path changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'apis/src/openai/responses/' \
            'apis/src/openai/conversations/' \
            'apis/src/openai/sse/' \
            'apis/src/store/' \
            'server/' \
            'tests/integration/sdk/openai/' \
            'tests/utils/examples/conversations_tenant_proxy.rs' \
            'tests/integration/ogx-constraints.txt' \
            'examples/configs/openai/responses/' \
            'Cargo.toml' \
            'Cargo.lock' \
            'Makefile' \
            '.github/actions/start-vllm/' \
            '.github/actions/wait-vllm/' \
            '.github/workflows/vllm-integration.yaml')
          if [ -n "$CHANGED" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # Fast Responses API integration tests against llm-d-inference-sim
  # ----------------------------------------------------------------------------

  vllm-responses:
    needs: [changes]
    if: |
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.action != 'labeled') &&
      (github.event_name != 'workflow_dispatch' || !inputs.run_live_vllm) &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Persist uv's wheel/download cache across runs so the multi-GB OGX
          # closure (torch, CUDA, faiss, transformers) is not re-downloaded every
          # run. Key ONLY on the pins file: setup-uv has no restore-key/prefix
          # fallback, so any globbed file that changes forces a full cold
          # re-download (~8 min). The workflow YAML and test files are
          # deliberately NOT globbed -- editing them must not bust the cache; uv
          # still downloads any small new PEP-723 test dep incrementally on top
          # of the restored cache.
          enable-cache: true
          cache-dependency-glob: |
            tests/integration/ogx-constraints.txt

      - name: Start inference simulator
        run: |
          docker run --detach --name inference-sim --network host \
            "$INFERENCE_SIM_IMAGE" \
            --model="$INFERENCE_SIM_MODEL" \
            --served-model-name="$INFERENCE_SIM_MODEL" \
            --mode=echo \
            --max-model-len=8192 \
            --skip-tool-validation \
            --port=8000

      - name: Pre-install OGX dependencies
        run: |
          # Resolve + download the full OGX dependency closure (torch, CUDA
          # wheels, faiss, transformers, ...) synchronously and OFF the readiness
          # clock. Without this the download runs backgrounded inside the
          # "Wait for OGX readiness" window and loses the race under network
          # variance, so the server never binds port 8321 in time (exit 124).
          echo "Pre-installing OGX from $OGX_CONSTRAINTS..."
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx --help > /dev/null
          echo "OGX environment ready"

      - name: Start OGX
        run: |
          # Same "$OGX_CONSTRAINTS" as the pre-install above, so uv reuses the
          # already materialized environment and the server binds within seconds.
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx run starter --insecure > /tmp/ogx.log 2>&1 &
          echo $! > /tmp/ogx.pid

      - name: Build Praxis
        run: |
          cargo build -p praxis-ai-proxy --no-default-features --features store-sqlite
          cargo build -p praxis-test-utils --example conversations_tenant_proxy --no-default-features --features store-sqlite

      - name: Wait for inference simulator readiness
        run: |
          simulator_ready=false
          for _ in {1..60}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1 && \
               curl -sf http://127.0.0.1:8000/v1/models > /dev/null 2>&1; then
              simulator_ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' inference-sim)" != true ]; then
              echo "::error::inference simulator exited before becoming ready"
              docker logs inference-sim 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          if [ "$simulator_ready" != true ]; then
            echo "::error::inference simulator did not become ready within 60s"
            docker logs inference-sim 2>&1 || true
            exit 1
          fi

      - name: Run Conversations SDK integration tests
        env:
          PRAXIS_TENANT_TEST_BIN: target/debug/examples/conversations_tenant_proxy
          VLLM_MODEL: ${{ env.INFERENCE_SIM_MODEL }}
        run: |
          uv run tests/integration/sdk/openai/test_openai_conversations.py -s

      - name: Wait for OGX readiness
        run: |
          echo "Waiting for OGX server..."
          # Poll in the current shell (no nested `bash -c`) so we can both bound
          # the wait and check process liveness: fail fast if the backgrounded
          # OGX process dies, and dump the log inline so a readiness failure is
          # diagnosable from this step (mirrors the vLLM liveness check, which
          # previously produced only an opaque exit 124 here).
          dump_ogx_log() {
            echo "----- /tmp/ogx.log (tail -n 200) -----"
            tail -n 200 /tmp/ogx.log 2>/dev/null || echo "No OGX log found"
          }
          OGX_PID="$(cat /tmp/ogx.pid)"
          deadline=$((SECONDS + 300))
          until curl -sf http://127.0.0.1:8321/v1/files > /dev/null 2>&1; do
            if ! kill -0 "$OGX_PID" 2>/dev/null; then
              echo "::error::OGX process (pid $OGX_PID) exited before binding port 8321"
              dump_ogx_log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::OGX did not become ready within 300s"
              dump_ogx_log
              exit 1
            fi
            sleep 2
          done
          echo "OGX is ready"

      - name: Run simulated Responses integration tests
        env:
          VLLM_MODEL: ${{ env.INFERENCE_SIM_MODEL }}
          VLLM_TEST_BACKEND: simulator
        run: |
          test_cmd=(
            uv run tests/integration/sdk/openai/test_openai_responses_vllm.py
            -s -m "not real_inference and not vllm_compat"
          )
          if "${test_cmd[@]}"; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "merge_group" ]; then
            exit 1
          fi
          echo "::warning::Retrying failed simulator tests once for the merge queue"
          "${test_cmd[@]}" --last-failed --last-failed-no-failures none

      - name: Inference simulator logs
        if: failure()
        run: docker logs inference-sim 2>&1 || echo "(no simulator container)"

      - name: OGX logs
        if: failure()
        run: cat /tmp/ogx.log 2>/dev/null || echo "No OGX log found"

      - name: Stop inference simulator
        if: always()
        run: docker rm -f inference-sim || true

      - name: Stop OGX
        if: always()
        run: |
          if [ -f /tmp/ogx.pid ]; then
            kill "$(cat /tmp/ogx.pid)" 2>/dev/null || true
          fi

  # ----------------------------------------------------------------------------
  # Critical live CPU smoke tests on every relevant change. Nightly, explicitly
  # requested dispatches, and vllm-full-suite labels run the complete suite.
  # ----------------------------------------------------------------------------

  vllm-live-cpu:
    needs: [changes]
    if: |
      always() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_live_vllm) ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'vllm-full-suite'
        ) ||
        (
          github.event_name != 'workflow_dispatch' &&
          github.event_name != 'schedule' &&
          (github.event_name != 'pull_request' || github.event.action != 'labeled') &&
          (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            tests/integration/ogx-constraints.txt

      - name: Start vLLM
        uses: ./.github/actions/start-vllm
        with:
          image: ${{ env.VLLM_IMAGE }}
          model: ${{ env.VLLM_MODEL }}

      - name: Pre-install OGX dependencies
        run: |
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx --help > /dev/null

      - name: Start OGX
        run: |
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx run starter --insecure > /tmp/ogx.log 2>&1 &
          echo $! > /tmp/ogx.pid

      - name: Build Praxis
        run: cargo build -p praxis-ai-proxy --no-default-features --features store-sqlite

      - name: Wait for vLLM readiness
        uses: ./.github/actions/wait-vllm

      - name: Wait for OGX readiness
        run: |
          dump_ogx_log() {
            echo "----- /tmp/ogx.log (tail -n 200) -----"
            tail -n 200 /tmp/ogx.log 2>/dev/null || echo "No OGX log found"
          }
          OGX_PID="$(cat /tmp/ogx.pid)"
          deadline=$((SECONDS + 300))
          until curl -sf http://127.0.0.1:8321/v1/files > /dev/null 2>&1; do
            if ! kill -0 "$OGX_PID" 2>/dev/null; then
              echo "::error::OGX process (pid $OGX_PID) exited before binding port 8321"
              dump_ogx_log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::OGX did not become ready within 300s"
              dump_ogx_log
              exit 1
            fi
            sleep 2
          done

      - name: Run critical live vLLM smoke tests
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.action != 'labeled')
        env:
          VLLM_TEST_BACKEND: live
        run: |
          uv run tests/integration/sdk/openai/test_openai_responses_vllm.py \
            -s -m "critical_vllm"

      - name: Run complete live vLLM Responses suite
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_live_vllm) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'vllm-full-suite')
        env:
          VLLM_TEST_BACKEND: live
        run: |
          uv run tests/integration/sdk/openai/test_openai_responses_vllm.py -s

      - name: vLLM container logs
        if: failure()
        run: docker logs vllm 2>&1 || echo "(no vllm container)"

      - name: OGX logs
        if: failure()
        run: cat /tmp/ogx.log 2>/dev/null || echo "No OGX log found"

      - name: Stop vLLM
        if: always()
        run: docker rm -f vllm || true

      - name: Stop OGX
        if: always()
        run: |
          if [ -f /tmp/ogx.pid ]; then
            kill "$(cat /tmp/ogx.pid)" 2>/dev/null || true
          fi

  # ----------------------------------------------------------------------------
  # Pinned Claude Code drives Anthropic Messages to real vLLM, native + transformed
  # (issue #1025)
  #
  # A pinned real Claude Code executable completes a deterministic coding task
  # against a pinned real vLLM backend over two Praxis paths, run sequentially
  # against one shared vLLM container:
  #   - NATIVE: Anthropic Messages traffic (/v1/messages,
  #     /v1/messages/count_tokens, /v1/models) is forwarded straight to vLLM's
  #     native Anthropic surface — with NO translation.
  #   - TRANSFORMED: Anthropic Messages traffic is translated into OpenAI Chat
  #     Completions (anthropic_messages_to_chat_completions) and forwarded to
  #     vLLM's /v1/chat/completions surface.
  # The two runs are sequential (not parallel) so they never contend for the
  # 4-vCPU runner's CPU while a model is generating.
  #
  # Gated to workflow_dispatch: this job is reproducibility-critical and depends
  # on a qualified model + a pinned Claude Code archive recorded in
  # tests/integration/fixtures/claude-code-cli/pin.toml. Until that manifest is
  # qualified (status = "qualified" and no TBD pins remain), the job fails fast
  # with an explanatory error rather than running against unqualified pins. It
  # never runs on push / pull_request / merge_group, so PR and merge-queue CI
  # stay green while qualification is pending. Requires the VLLM_API_KEY secret.
  # ----------------------------------------------------------------------------

  claude-code-native-vllm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Backend bearer token Praxis injects toward vLLM and vLLM requires. The
      # acceptance test also reads this to confirm the client's gateway secret
      # is swapped for it and never leaks upstream.
      VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Load and qualify pins
        run: |
          # Single source of truth: the committed pin manifest. Export the pins
          # this job needs and FAIL FAST if the manifest is not qualified or
          # still carries TBD placeholders, so a premature dispatch produces a
          # clear, actionable error instead of a confusing runtime failure.
          python3 - "$GITHUB_ENV" <<'PY'
          import pathlib, sys, tomllib

          manifest = pathlib.Path("tests/integration/fixtures/claude-code-cli/pin.toml")
          data = tomllib.loads(manifest.read_text())
          claude, vllm, qual = data["claude_code"], data["vllm"], data["qualification"]
          exported = {
              "CLAUDE_URL": claude["url"],
              "CLAUDE_SHA256": claude["sha256"],
              "CLAUDE_VERSION": claude["version"],
              "CLAUDE_PLATFORM": claude["platform"],
              "VLLM_IMAGE_PIN": vllm["image"],
              "VLLM_SERVED_MODEL": vllm["served_model_name"],
              "VLLM_FLAGS": " ".join(vllm["launch"]["flags"]),
          }
          with open(sys.argv[1], "a", encoding="utf-8") as env_file:
              for key, value in exported.items():
                  env_file.write(f"{key}={value}\n")

          unresolved = sorted(key for key, value in exported.items() if "TBD" in value)
          if qual["status"] != "qualified" or unresolved:
              print(
                  f"::error::pin.toml is not ready (status={qual['status']!r}, "
                  f"unresolved={unresolved}); complete the qualification described in "
                  "tests/integration/fixtures/claude-code-cli/pin.toml "
                  "(select a model that passes the required consecutive runs, then fill "
                  "in the served model, image digest, revision, and the Claude Code "
                  "archive url + sha256) before dispatching this job.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Install and checksum pinned Claude Code executable
        run: |
          set -euo pipefail
          # The pinned archive is a single self-contained executable. If the
          # qualified pin is a tarball instead, add extraction here alongside the
          # checksum during qualification.
          dest="$RUNNER_TEMP/claude"
          curl -fsSL "$CLAUDE_URL" -o "$dest"
          echo "${CLAUDE_SHA256}  ${dest}" | sha256sum -c -
          chmod +x "$dest"
          # Confirm the pinned version before anything else uses the binary.
          "$dest" --version | grep -F "$CLAUDE_VERSION"
          echo "PRAXIS_TEST_CLAUDE_CODE_BIN=$dest" >> "$GITHUB_ENV"

      - name: Start native-Anthropic vLLM with backend auth
        run: |
          set -euo pipefail
          if [ -z "${VLLM_API_KEY:-}" ]; then
            echo "::error::VLLM_API_KEY secret is not set; the backend requires it"
            exit 1
          fi
          docker pull "$VLLM_IMAGE_PIN"
          # Native Anthropic Messages serving (/v1/messages,
          # /v1/messages/count_tokens) is enabled by the pinned $VLLM_FLAGS and
          # validated during qualification. --api-key makes vLLM require the same
          # bearer token Praxis injects, so unauthenticated upstream calls fail.
          # shellcheck disable=SC2086
          docker run -d --name vllm \
            -p 8000:8000 \
            --privileged=true \
            "$VLLM_IMAGE_PIN" \
            $VLLM_FLAGS \
            --served-model-name "$VLLM_SERVED_MODEL" \
            --api-key "$VLLM_API_KEY"

      - name: Preflight vLLM endpoints
        run: |
          set -euo pipefail
          echo "Waiting for vLLM..."
          deadline=$((SECONDS + 900))
          until curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; do
            if ! docker inspect --format='{{.State.Running}}' vllm 2>/dev/null | grep -q true; then
              echo "::error::vLLM container exited before readiness"
              docker logs vllm 2>&1 || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::vLLM did not become ready within 900s"
              docker logs vllm 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          auth="Authorization: Bearer ${VLLM_API_KEY}"
          curl -sf -H "$auth" http://127.0.0.1:8000/v1/models > /dev/null
          # Prove the native Messages surface is up and gated by the bearer token
          # (used by the native acceptance run).
          curl -sf -H "$auth" -H 'content-type: application/json' \
            -d "{\"model\":\"${VLLM_SERVED_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
            http://127.0.0.1:8000/v1/messages/count_tokens > /dev/null
          # Prove the OpenAI Chat Completions surface is up (used by the
          # transformed acceptance run, which rewrites /v1/messages to it).
          curl -sf -H "$auth" -H 'content-type: application/json' \
            -d "{\"model\":\"${VLLM_SERVED_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
            http://127.0.0.1:8000/v1/chat/completions > /dev/null
          echo "native and chat-completions endpoints ready"

      - name: Build Praxis and acceptance test
        run: |
          cargo build -p praxis-ai-proxy
          cargo test -p praxis-tests-integration --test suite --no-run

      - name: Create restricted network namespace
        run: |
          set -euo pipefail
          NS=praxis-claude-ns
          sudo ip netns add "$NS"
          sudo ip link add veth-host type veth peer name veth-ns
          sudo ip link set veth-ns netns "$NS"
          # The client lives in the namespace and reaches Praxis over the veth
          # pair, so Praxis binds the host-side veth address (10.200.0.1) rather
          # than loopback. vLLM stays host-side on loopback (127.0.0.1:8000).
          sudo ip addr add 10.200.0.1/24 dev veth-host
          sudo ip link set veth-host up
          sudo ip -n "$NS" addr add 10.200.0.2/24 dev veth-ns
          sudo ip -n "$NS" link set veth-ns up
          sudo ip -n "$NS" link set lo up
          # No default route and no DNS: the client can reach ONLY 10.200.0.1,
          # so it cannot bypass Praxis to talk to anything else. Prove it.
          if sudo ip -n "$NS" route show default | grep -q .; then
            echo "::error::namespace has a default route; egress is not blocked"
            sudo ip -n "$NS" route show
            exit 1
          fi
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "restricted namespace ready"

      - name: Locate compiled suite test binary
        run: |
          set -uo pipefail
          # Locate the already-built suite binary without recompiling; both
          # acceptance runs below reuse it.
          TEST_BIN=$(cargo test -p praxis-tests-integration --test suite --no-run \
              --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null and .target.name == "suite") | .executable' \
            | tail -n1)
          if [ -z "$TEST_BIN" ]; then
            echo "::error::could not locate the compiled suite test binary"
            exit 1
          fi
          echo "TEST_BIN=$TEST_BIN" >> "$GITHUB_ENV"

      - name: Run Claude Code native-vLLM acceptance test (once, no retry)
        env:
          PRAXIS_TEST_VLLM_BASE_URL: http://127.0.0.1:8000
          PRAXIS_TEST_VLLM_MODEL: ${{ env.VLLM_SERVED_MODEL }}
          PRAXIS_TEST_CLAUDE_CODE_NETNS: ${{ env.NS }}
          PRAXIS_TEST_LISTEN_ADDRESS: 10.200.0.1
        run: |
          set -uo pipefail
          # The child enters the network namespace via `ip netns exec`, which
          # needs CAP_NET_ADMIN, so the test binary runs under sudo. Only the
          # native acceptance test runs, exactly once, with no retry.
          sudo --preserve-env=PRAXIS_TEST_CLAUDE_CODE_BIN,PRAXIS_TEST_VLLM_BASE_URL,PRAXIS_TEST_VLLM_MODEL,VLLM_API_KEY,PRAXIS_TEST_CLAUDE_CODE_NETNS,PRAXIS_TEST_LISTEN_ADDRESS \
            "$TEST_BIN" \
            claude_code_vllm::pinned_claude_code_drives_native_vllm_through_full_flow \
            --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/acceptance-native.log"
          exit "${PIPESTATUS[0]}"

      - name: Run Claude Code transformed-vLLM acceptance test (once, no retry)
        env:
          PRAXIS_TEST_VLLM_BASE_URL: http://127.0.0.1:8000
          PRAXIS_TEST_VLLM_MODEL: ${{ env.VLLM_SERVED_MODEL }}
          PRAXIS_TEST_CLAUDE_CODE_NETNS: ${{ env.NS }}
          PRAXIS_TEST_LISTEN_ADDRESS: 10.200.0.1
        run: |
          set -uo pipefail
          # Same shared vLLM container and restricted namespace, run sequentially
          # after the native test so the two never contend for the 4-vCPU runner.
          # This path routes through anthropic_messages_to_chat_completions to
          # vLLM's /v1/chat/completions surface. Runs once, no retry.
          sudo --preserve-env=PRAXIS_TEST_CLAUDE_CODE_BIN,PRAXIS_TEST_VLLM_BASE_URL,PRAXIS_TEST_VLLM_MODEL,VLLM_API_KEY,PRAXIS_TEST_CLAUDE_CODE_NETNS,PRAXIS_TEST_LISTEN_ADDRESS \
            "$TEST_BIN" \
            claude_code_vllm::pinned_claude_code_drives_transformed_vllm_through_full_flow \
            --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/acceptance-transformed.log"
          exit "${PIPESTATUS[0]}"

      - name: Acceptance log tail on failure
        if: failure()
        run: |
          # Interleaved client and Praxis diagnostics for each run. The gateway
          # and native secrets are test constants, and Praxis does not emit auth
          # headers at the default log level, so these logs are safe to surface.
          for log in acceptance-native acceptance-transformed; do
            echo "=== $log ==="
            tail -n 400 "$RUNNER_TEMP/$log.log" 2>/dev/null || echo "no $log log captured"
          done

      - name: vLLM container logs on failure
        if: failure()
        run: |
          # Surface a tail inline and persist the full log for artifact upload.
          docker logs vllm > "$RUNNER_TEMP/vllm.log" 2>&1 || true
          tail -n 400 "$RUNNER_TEMP/vllm.log" 2>/dev/null || true

      - name: Upload acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-code-native-vllm-diagnostics
          # The gateway and native secrets are test constants and Praxis does not
          # emit auth headers at the default log level, so these logs are safe to
          # retain.
          path: |
            ${{ runner.temp }}/acceptance-native.log
            ${{ runner.temp }}/acceptance-transformed.log
            ${{ runner.temp }}/vllm.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down network namespace
        if: always()
        run: |
          sudo ip netns del praxis-claude-ns 2>/dev/null || true
          sudo ip link del veth-host 2>/dev/null || true

      - name: Stop vLLM
        if: always()
        run: docker rm -f vllm || true

  # ----------------------------------------------------------------------------
  # Fast Responses API integration tests with PostgreSQL store backend
  # ----------------------------------------------------------------------------

  vllm-responses-postgres:
    needs: [changes]
    if: |
      always() &&
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.action != 'labeled') &&
      (github.event_name != 'workflow_dispatch' || !inputs.run_live_vllm) &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --filter "label!=com.github.actions.runner"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Persist uv's wheel/download cache across runs so the multi-GB OGX
          # closure (torch, CUDA, faiss, transformers) is not re-downloaded every
          # run. Key ONLY on the pins file: setup-uv has no restore-key/prefix
          # fallback, so any globbed file that changes forces a full cold
          # re-download (~8 min). The workflow YAML and test files are
          # deliberately NOT globbed -- editing them must not bust the cache; uv
          # still downloads any small new PEP-723 test dep incrementally on top
          # of the restored cache.
          enable-cache: true
          cache-dependency-glob: |
            tests/integration/ogx-constraints.txt

      - name: Start inference simulator
        run: |
          docker run --detach --name inference-sim --network host \
            "$INFERENCE_SIM_IMAGE" \
            --model="$INFERENCE_SIM_MODEL" \
            --served-model-name="$INFERENCE_SIM_MODEL" \
            --mode=echo \
            --max-model-len=8192 \
            --skip-tool-validation \
            --port=8000

      - name: Pre-install OGX dependencies
        run: |
          # Resolve + download the full OGX dependency closure (torch, CUDA
          # wheels, faiss, transformers, ...) synchronously and OFF the readiness
          # clock. Without this the download runs backgrounded inside the
          # "Wait for OGX readiness" window and loses the race under network
          # variance, so the server never binds port 8321 in time (exit 124).
          echo "Pre-installing OGX from $OGX_CONSTRAINTS..."
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx --help > /dev/null
          echo "OGX environment ready"

      - name: Start OGX
        run: |
          # Same "$OGX_CONSTRAINTS" as the pre-install above, so uv reuses the
          # already materialized environment and the server binds within seconds.
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx run starter --insecure > /tmp/ogx.log 2>&1 &
          echo $! > /tmp/ogx.pid

      - name: Build Praxis
        run: |
          cargo build -p praxis-ai-proxy
          cargo build -p praxis-test-utils --example conversations_tenant_proxy

      - name: Wait for inference simulator readiness
        run: |
          simulator_ready=false
          for _ in {1..60}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1 && \
               curl -sf http://127.0.0.1:8000/v1/models > /dev/null 2>&1; then
              simulator_ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' inference-sim)" != true ]; then
              echo "::error::inference simulator exited before becoming ready"
              docker logs inference-sim 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          if [ "$simulator_ready" != true ]; then
            echo "::error::inference simulator did not become ready within 60s"
            docker logs inference-sim 2>&1 || true
            exit 1
          fi

      - name: Run Conversations SDK integration tests (PostgreSQL store)
        env:
          DATABASE_URL: postgres://praxis:praxis@127.0.0.1:5432/praxis
          PRAXIS_TENANT_TEST_BIN: target/debug/examples/conversations_tenant_proxy
          VLLM_MODEL: ${{ env.INFERENCE_SIM_MODEL }}
        run: |
          uv run tests/integration/sdk/openai/test_openai_conversations.py -s

      - name: Wait for OGX readiness
        run: |
          echo "Waiting for OGX server..."
          # Poll in the current shell (no nested `bash -c`) so we can both bound
          # the wait and check process liveness: fail fast if the backgrounded
          # OGX process dies, and dump the log inline so a readiness failure is
          # diagnosable from this step (mirrors the vLLM liveness check, which
          # previously produced only an opaque exit 124 here).
          dump_ogx_log() {
            echo "----- /tmp/ogx.log (tail -n 200) -----"
            tail -n 200 /tmp/ogx.log 2>/dev/null || echo "No OGX log found"
          }
          OGX_PID="$(cat /tmp/ogx.pid)"
          deadline=$((SECONDS + 300))
          until curl -sf http://127.0.0.1:8321/v1/files > /dev/null 2>&1; do
            if ! kill -0 "$OGX_PID" 2>/dev/null; then
              echo "::error::OGX process (pid $OGX_PID) exited before binding port 8321"
              dump_ogx_log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::OGX did not become ready within 300s"
              dump_ogx_log
              exit 1
            fi
            sleep 2
          done
          echo "OGX is ready"

      - name: Run simulated Responses integration tests (PostgreSQL store)
        env:
          DATABASE_URL: postgres://praxis:praxis@127.0.0.1:5432/praxis
          VLLM_MODEL: ${{ env.INFERENCE_SIM_MODEL }}
          VLLM_TEST_BACKEND: simulator
        run: |
          test_cmd=(
            uv run tests/integration/sdk/openai/test_openai_responses_vllm.py
            -s -m "not real_inference and not vllm_compat"
          )
          if "${test_cmd[@]}"; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "merge_group" ]; then
            exit 1
          fi
          echo "::warning::Retrying failed simulator tests once for the merge queue"
          "${test_cmd[@]}" --last-failed --last-failed-no-failures none

      - name: Inference simulator logs
        if: failure()
        run: docker logs inference-sim 2>&1 || echo "(no simulator container)"

      - name: OGX logs
        if: failure()
        run: cat /tmp/ogx.log 2>/dev/null || echo "No OGX log found"

      - name: Stop inference simulator
        if: always()
        run: docker rm -f inference-sim || true

      - name: Stop OGX
        if: always()
        run: |
          if [ -f /tmp/ogx.pid ]; then
            kill "$(cat /tmp/ogx.pid)" 2>/dev/null || true
          fi
