# Live provider calls are billable. Results apply to the tested checkout.
name: Hosted Translation Nightly

on:
  schedule:
    - cron: "53 5 * * *"
    - cron: "53 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  messages-to-openai:
    name: Anthropic Messages to OpenAI Chat Completions
    if: (github.repository == 'praxis-proxy/ai' || github.event_name == 'workflow_dispatch') && github.event.schedule != '53 5 * * 1'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check provider credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Qualification unavailable: set the OPENAI_API_KEY Actions secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@4c5423e4197eadfe606d0397bed190e65ad86cf2 # v0.7.0
        with:
          cache-suffix: ci-split-registry
          cache-target: "false"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build Praxis
        run: cargo build --locked -p praxis-ai-proxy

      - name: Qualify Messages translation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRAXIS_LIVE_MESSAGES_BASE_URL: http://127.0.0.1:8080
        run: |
          log="$RUNNER_TEMP/hosted-messages-to-openai-praxis.log"
          target/debug/praxis-ai \
            -c tests/integration/fixtures/anthropic/messages-to-openai-live.yaml >"$log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..30}; do
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              break
            fi
            if curl --silent --output /dev/null --max-time 1 "$PRAXIS_LIVE_MESSAGES_BASE_URL"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$log"
            echo "::error::Praxis did not start."
            exit 1
          fi

          {
            echo "### Anthropic Messages to OpenAI Chat Completions"
            echo "- Gateway commit: $(git rev-parse HEAD)"
            echo "- Configuration: tests/integration/fixtures/anthropic/messages-to-openai-live.yaml"
          } >> "$GITHUB_STEP_SUMMARY"

          env -u OPENAI_API_KEY uv run --script \
            tests/integration/sdk/anthropic/test_anthropic_messages_to_openai_live.py \
            --junitxml="$RUNNER_TEMP/hosted-messages-to-openai-junit.xml" --tb=line

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-messages-to-openai-results
          path: |
            ${{ runner.temp }}/hosted-messages-to-openai-junit.xml
            ${{ runner.temp }}/hosted-messages-to-openai-praxis.log
          if-no-files-found: ignore

  responses-to-chat:
    name: OpenAI Responses to OpenAI Chat Completions
    if: (github.repository == 'praxis-proxy/ai' || github.event_name == 'workflow_dispatch') && github.event.schedule != '53 5 * * 1'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check provider credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Qualification unavailable: set the OPENAI_API_KEY Actions secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@4c5423e4197eadfe606d0397bed190e65ad86cf2 # v0.7.0
        with:
          cache-suffix: ci-split-registry
          cache-target: "false"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build Praxis
        run: cargo build --locked -p praxis-ai-proxy --features openai-responses

      - name: Qualify Responses translation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRAXIS_LIVE_OPENAI_BASE_URL: http://127.0.0.1:8080/v1
        run: |
          log="$RUNNER_TEMP/hosted-responses-to-chat-praxis.log"
          target/debug/praxis-ai \
            -c tests/integration/fixtures/openai/responses-to-chat-live.yaml >"$log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..30}; do
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              break
            fi
            if curl --silent --output /dev/null --max-time 1 "$PRAXIS_LIVE_OPENAI_BASE_URL"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$log"
            echo "::error::Praxis did not start."
            exit 1
          fi

          {
            echo "### OpenAI Responses to OpenAI Chat Completions"
            echo "- Gateway commit: $(git rev-parse HEAD)"
            echo "- Configuration: tests/integration/fixtures/openai/responses-to-chat-live.yaml"
          } >> "$GITHUB_STEP_SUMMARY"

          OPENAI_API_KEY=gateway-test uv run --script \
            tests/integration/sdk/openai/test_openai_chat_completions_live.py \
            -k test_responses_ \
            --junitxml="$RUNNER_TEMP/hosted-responses-to-chat-junit.xml" --tb=line

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-responses-to-chat-results
          path: |
            ${{ runner.temp }}/hosted-responses-to-chat-junit.xml
            ${{ runner.temp }}/hosted-responses-to-chat-praxis.log
          if-no-files-found: ignore

  anthropic-translation:
    name: OpenAI Chat Completions to Anthropic Messages
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'praxis-proxy/ai' && github.event.schedule == '53 5 * * 1')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check provider credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::Qualification unavailable: set the ANTHROPIC_API_KEY Actions secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@4c5423e4197eadfe606d0397bed190e65ad86cf2 # v0.7.0
        with:
          cache-suffix: ci-split-registry
          cache-target: "false"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build Praxis
        run: cargo build --locked -p praxis-ai-proxy

      - name: Qualify official Anthropic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRAXIS_LIVE_ANTHROPIC: chat
          GATEWAY_CONFIG: tests/integration/fixtures/anthropic/chat-to-anthropic-live.yaml
        run: |
          umask 077
          credential_dir=$(mktemp -d)
          trap 'rm -r -- "$credential_dir"' EXIT
          mkdir -p "$credential_dir/grid-fixture/anthropic-fixture-secret"
          printf '%s' "$ANTHROPIC_API_KEY" > "$credential_dir/grid-fixture/anthropic-fixture-secret/api-key"
          unset ANTHROPIC_API_KEY
          sed "s|/tmp/praxis-hosted-anthropic|$credential_dir|" "$GATEWAY_CONFIG" > "$credential_dir/gateway.yaml"
          GATEWAY_CONFIG="$credential_dir/gateway.yaml"
          target/debug/praxis-ai -c "$GATEWAY_CONFIG" >"$RUNNER_TEMP/anthropic-praxis.log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true; rm -r -- "$credential_dir"' EXIT
          ready=false
          for _ in {1..30}; do
            kill -0 "$gateway_pid" || break
            if curl --silent --output /dev/null --max-time 1 http://127.0.0.1:8080/; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Praxis did not start."
            exit 1
          fi
          env -u ANTHROPIC_API_KEY uv run --script \
            tests/integration/sdk/anthropic/test_official_anthropic_live.py -k test_chat_translation \
            --junitxml="$RUNNER_TEMP/hosted-anthropic-junit.xml" --tb=line

      - name: Upload Anthropic test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-anthropic-translation-results
          path: ${{ runner.temp }}/hosted-anthropic-junit.xml
          if-no-files-found: ignore
