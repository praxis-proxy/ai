# Live provider calls are billable. Results apply to the tested checkout.
name: Hosted Translation Nightly

on:
  schedule:
    - cron: "53 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  messages-to-openai:
    name: Anthropic Messages to OpenAI Chat Completions
    if: github.repository == 'praxis-proxy/ai' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check provider credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Qualification unavailable: set the OPENAI_API_KEY Actions secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@2a0d28ddd3690ed73347ddbe59d08dac02f604ce # v0.5.0
        with:
          cache-suffix: ci-split-registry
          cache-target: "false"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build Praxis
        run: cargo build --locked -p praxis-ai-proxy

      - name: Qualify Messages translation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRAXIS_LIVE_MESSAGES_BASE_URL: http://127.0.0.1:8080
        run: |
          log="$RUNNER_TEMP/hosted-messages-to-openai-praxis.log"
          target/debug/praxis-ai \
            -c tests/integration/fixtures/anthropic/messages-to-openai-live.yaml >"$log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..30}; do
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              break
            fi
            if curl --silent --output /dev/null --max-time 1 "$PRAXIS_LIVE_MESSAGES_BASE_URL"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$log"
            echo "::error::Praxis did not start."
            exit 1
          fi

          {
            echo "### Anthropic Messages to OpenAI Chat Completions"
            echo "- Gateway commit: $(git rev-parse HEAD)"
            echo "- Configuration: tests/integration/fixtures/anthropic/messages-to-openai-live.yaml"
          } >> "$GITHUB_STEP_SUMMARY"

          env -u OPENAI_API_KEY uv run --script \
            tests/integration/sdk/anthropic/test_anthropic_messages_to_openai_live.py \
            --junitxml="$RUNNER_TEMP/hosted-messages-to-openai-junit.xml" --tb=line

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-messages-to-openai-results
          path: |
            ${{ runner.temp }}/hosted-messages-to-openai-junit.xml
            ${{ runner.temp }}/hosted-messages-to-openai-praxis.log
          if-no-files-found: ignore
