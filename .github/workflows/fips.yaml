name: FIPS

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# The FIPS build on UBI 9, checked the way Red Hat checks it: first the
# compliance report (a reason and a pointer for every finding), then Red Hat's
# own scanner, openshift/check-payload at its Rust-support revision, against
# the runtime image with warnings fatal. Runs on every pull request and push
# to main so a change that breaks FIPS compliance never reaches a release.
# Also runs on merge_group: ubi-image is a required merge-queue check, so it
# must report on the queue ref or the queue times out waiting for it.
#
# Everything runs through the Makefile targets developers use locally (see
# docs/developing/fips.md), with podman: Red Hat's image signatures can only
# be verified with podman, and the scanner reads podman's image store.
# Ubuntu's podman packaging ships no registries.d entry for Red Hat's
# registry, so the job first tells podman where the signatures live
# (make fips-signature-store), as a developer on Debian or Ubuntu would.
#
# The second job, fips-host, is the runtime proof the hosted job cannot
# give: on the self-hosted RHEL 9 runner in FIPS mode it attests the host
# and the image's module build, runs the test suites as the FIPS build
# inside the toolchain image, and probes the exact image the hosted job
# built and scanned, handed over as an artifact and checked by id. It never
# runs a fork's code, and it stays out of the merge queue so queue
# throughput never depends on the single runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    # Nightly runtime proof; clear of the other nightly schedules.
    - cron: "53 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # UBI 9 image: compliance report, then Red Hat's scanner
  # ----------------------------------------------------------------------------

  ubi-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          # Only xtask (without its default features) is built on the host;
          # keep that off the shared cache key and skip caching its target.
          cache-suffix: fips
          cache-target: "false"

      - name: Set up Go (builds Red Hat's scanner)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: "1.26"
          # The scanner is fetched by make fips-scanner and vendors its modules.
          cache: false

      - name: Build Red Hat's scanner (check-payload) at the pinned revision
        run: make fips-scanner

      - name: Download the OpenShift CLI the scanner insists on (pinned, checksum-verified)
        run: make fips-oc

      - name: Point podman at Red Hat's signature store (Ubuntu's podman has no entry for it)
        run: make fips-signature-store

      - name: Verify the Red Hat base images are signed by Red Hat
        run: make fips-verify-image

      - name: Build on UBI 9 with Red Hat's toolchain and print the compliance report
        run: make fips-check

      - name: Build the FIPS runtime image
        run: make container-fips

      - name: Run the image once (validates its built-in config with the system OpenSSL)
        run: make fips-smoke

      - name: Scan the image with check-payload (warnings fatal)
        run: make fips-scan

      # The merge queue never runs fips-host, so it skips the handoff too.
      - name: Save the image for the FIPS runner
        id: save
        if: github.event_name != 'merge_group'
        run: |
          make fips-image-save
          echo "image-id=$(cat target/fips/praxis-ai-fips-image.tar.id)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'merge_group'
        with:
          name: fips-image
          path: |
            target/fips/praxis-ai-fips-image.tar
            target/fips/praxis-ai-fips-image.tar.id
          if-no-files-found: error
          retention-days: 3

  # ----------------------------------------------------------------------------
  # FIPS host: the runtime proof, on the RHEL 9 runner in FIPS mode
  # ----------------------------------------------------------------------------

  fips-host:
    needs: ubi-image
    # Never a fork's code on the self-hosted runner: pull requests only from
    # this repository's own branches. Not in the merge queue: ubi-image is
    # the required check there, and the queue must not wait on one runner.
    if: >-
      needs.ubi-image.result == 'success'
      && github.event_name != 'merge_group'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, fips, rhel]
    # One runner: queue behind any other run rather than share it.
    concurrency:
      group: fips-host-runner
      cancel-in-progress: false
    # Building the suites in the toolchain image from a cold cache dominates.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/fips-runner-check

      # The self-hosted RHEL runner is persistent, so podman state from earlier
      # runs piles up on the same disk as the checkout, the fetched image
      # tarball and the build-cache volumes, and a cold suite build has run it
      # to zero mid-build (No space left on device; dnf in fips-toolchain short
      # by hundreds of MB). Reclaim in three passes, BEFORE the image is fetched
      # and loaded so nothing here touches the image this run proves:
      #   1. Force-remove stale containers still bound to the dedicated FIPS
      #      cache volumes. test-fips-host runs the toolchain container with
      #      --rm, but a crashed or SIGKILLed run leaves it behind, still marked
      #      running and still holding praxis-ai-fips-host-{target,cargo}. That
      #      is exactly how the disk filled: two abandoned containers pinned a
      #      109.1 GB praxis-ai-fips-host-target, and because a referenced volume
      #      is never pruned, pass 3 could not reclaim it (the #1437 cleanup ran
      #      but freed nothing). The fips-host-runner concurrency group
      #      (cancel-in-progress: false) serialises runs on this one runner, so
      #      no other legitimate run can be holding these volumes while we
      #      execute; any container bound to them now is a leftover and safe to
      #      force-remove. Scoped to those two volumes by name so nothing else
      #      on the runner is touched, and deliberately NOT guarded with
      #      `|| true`: if a stale container cannot be removed the volume stays
      #      pinned and the build hits the same wall, so fail loudly instead of
      #      hiding it.
      #   2. podman system prune -a removes every stale image and the build
      #      cache. A prune without -a is near-useless here (that space is in
      #      tagged images from prior runs, not dangling layers).
      #   3. The volumes, not the images, dominate this disk — seen at 115.7 GB
      #      of 119 GB with ~39 GB reclaimable, while -a freed only ~8 GB and
      #      the build still ran out. podman volume prune removes only volumes
      #      no container references, so a cache in use is left alone; a cache
      #      idle between runs (or freed by pass 1) may be dropped and rebuilt
      #      within the 180-minute budget. Correctness over cache warmth:
      #      without this the disk stays full and the toolchain build fails.
      # df -h and podman ps/system df either side make a future exhaustion, and
      # which containers and volumes hold the space, visible in the log.
      - name: Reclaim disk before loading the image (remove stale FIPS cache containers, then prune images + unused volumes)
        run: |
          set -euo pipefail

          echo "== Container and disk state before cleanup =="
          df -h "$GITHUB_WORKSPACE" || df -h || true
          podman ps -a || true
          podman system df -v || podman system df || true

          # Pass 1: force-remove leftover containers pinning the FIPS cache
          # volumes. Safe because fips-host-runner serialises runs on this
          # single runner (see the note above). No `|| true`: a failure here
          # means the volume stays pinned, so let the step fail.
          for volume in praxis-ai-fips-host-target praxis-ai-fips-host-cargo; do
            stale="$(podman ps -aq --filter "volume=$volume")"
            if [ -n "$stale" ]; then
              echo "Force-removing stale container(s) pinning volume $volume:"
              echo "$stale"
              # Word-splitting is intended: $stale may hold several ids.
              # shellcheck disable=SC2086
              podman rm --force --time 0 $stale
            fi
          done

          # Pass 2 + 3: the existing image and unused-volume prune, which can
          # now reclaim any FIPS cache volume freed by pass 1.
          podman system prune -a --force || true
          podman volume prune --force || true

          echo "== Container and disk state after cleanup =="
          podman ps -a || true
          podman system df || true
          df -h "$GITHUB_WORKSPACE" || df -h || true

      - name: Fetch the image the hosted job built and scanned
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fips-image
          path: target/fips

      - name: Load it and check it is that image
        env:
          EXPECTED_ID: ${{ needs.ubi-image.outputs.image-id }}
        run: |
          make fips-image-load
          [ "$(cat target/fips/praxis-ai-fips-image.tar.id)" = "$EXPECTED_ID" ] \
            || { echo "::error::the archive's image id does not match the one the hosted job recorded"; exit 1; }

      - uses: ./.github/actions/fips-host
        with:
          run-suites: "true"

      - name: Remove the loaded image
        if: always()
        run: podman rmi --force "localhost/praxis-ai:$(make -s fips-version)-fips" || true
