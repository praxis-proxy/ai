name: FIPS

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# The FIPS build on UBI 9, checked the way Red Hat checks it: first the
# compliance report (a reason and a pointer for every finding), then Red Hat's
# own scanner, openshift/check-payload at its Rust-support revision, against
# the runtime image with warnings fatal. Runs on every pull request and push
# to main so a change that breaks FIPS compliance never reaches a release.
# Also runs on merge_group: ubi-image is a required merge-queue check, so it
# must report on the queue ref or the queue times out waiting for it.
#
# Everything runs through the Makefile targets developers use locally (see
# docs/developing/fips.md), with podman: Red Hat's image signatures can only
# be verified with podman, and the scanner reads podman's image store.
# Ubuntu's podman packaging ships no registries.d entry for Red Hat's
# registry, so the job first tells podman where the signatures live
# (make fips-signature-store), as a developer on Debian or Ubuntu would.
#
# The second job, fips-host, is the runtime proof the hosted job cannot
# give: on the self-hosted RHEL 9 runner in FIPS mode it attests the host
# and the image's module build, runs the test suites as the FIPS build
# inside the toolchain image, and probes the exact image the hosted job
# built and scanned, handed over as an artifact and checked by id. It never
# runs a fork's code, and it stays out of the merge queue so queue
# throughput never depends on the single runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    # Nightly runtime proof; clear of the other nightly schedules.
    - cron: "53 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # UBI 9 image: compliance report, then Red Hat's scanner
  # ----------------------------------------------------------------------------

  ubi-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          # Only xtask (without its default features) is built on the host;
          # keep that off the shared cache key and skip caching its target.
          cache-suffix: fips
          cache-target: "false"

      - name: Set up Go (builds Red Hat's scanner)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: "1.26"
          # The scanner is fetched by make fips-scanner and vendors its modules.
          cache: false

      - name: Build Red Hat's scanner (check-payload) at the pinned revision
        run: make fips-scanner

      - name: Download the OpenShift CLI the scanner insists on (pinned, checksum-verified)
        run: make fips-oc

      - name: Point podman at Red Hat's signature store (Ubuntu's podman has no entry for it)
        run: make fips-signature-store

      - name: Verify the Red Hat base images are signed by Red Hat
        run: make fips-verify-image

      - name: Build on UBI 9 with Red Hat's toolchain and print the compliance report
        run: make fips-check

      - name: Build the FIPS runtime image
        run: make container-fips

      - name: Run the image once (validates its built-in config with the system OpenSSL)
        run: make fips-smoke

      - name: Scan the image with check-payload (warnings fatal)
        run: make fips-scan

      # The merge queue never runs fips-host, so it skips the handoff too.
      - name: Save the image for the FIPS runner
        id: save
        if: github.event_name != 'merge_group'
        run: |
          make fips-image-save
          echo "image-id=$(cat target/fips/praxis-ai-fips-image.tar.id)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'merge_group'
        with:
          name: fips-image
          path: |
            target/fips/praxis-ai-fips-image.tar
            target/fips/praxis-ai-fips-image.tar.id
          if-no-files-found: error
          retention-days: 3

  # ----------------------------------------------------------------------------
  # FIPS host: the runtime proof, on the RHEL 9 runner in FIPS mode
  # ----------------------------------------------------------------------------

  fips-host:
    needs: ubi-image
    # Never a fork's code on the self-hosted runner: pull requests only from
    # this repository's own branches. Not in the merge queue: ubi-image is
    # the required check there, and the queue must not wait on one runner.
    if: >-
      needs.ubi-image.result == 'success'
      && github.event_name != 'merge_group'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, fips, rhel]
    # One runner: queue behind any other run rather than share it.
    concurrency:
      group: fips-host-runner
      cancel-in-progress: false
    # Building the suites in the toolchain image from a cold cache dominates.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/fips-runner-check

      - name: Fetch the image the hosted job built and scanned
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fips-image
          path: target/fips

      - name: Load it and check it is that image
        env:
          EXPECTED_ID: ${{ needs.ubi-image.outputs.image-id }}
        run: |
          make fips-image-load
          [ "$(cat target/fips/praxis-ai-fips-image.tar.id)" = "$EXPECTED_ID" ] \
            || { echo "::error::the archive's image id does not match the one the hosted job recorded"; exit 1; }

      - uses: ./.github/actions/fips-host
        with:
          run-suites: "true"

      - name: Remove the loaded image
        if: always()
        run: podman rmi --force "localhost/praxis-ai:$(make -s fips-version)-fips" || true
