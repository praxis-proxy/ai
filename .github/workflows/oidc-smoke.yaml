name: OIDC smoke

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: oidc-smoke
  cancel-in-progress: false

jobs:
  vertex:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: providers-live
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.VERTEX_AI_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Vertex AI live call (Gemini generateContent)
        env:
          VERTEX_AI_PROJECT: ${{ secrets.VERTEX_AI_PROJECT }}
          VERTEX_AI_LOCATION: global
          GEMINI_MODEL: ${{ vars.VERTEX_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          set -euo pipefail
          token=$(gcloud auth application-default print-access-token)
          echo "::add-mask::$token"
          : "${VERTEX_AI_PROJECT:?Missing Vertex project}"
          : "${VERTEX_AI_LOCATION:?Missing Vertex location}"
          : "${GEMINI_MODEL:?Missing Vertex model}"
          response=$(mktemp)
          trap 'rm -- "$response"' EXIT
          status=$(printf 'Authorization: Bearer %s\n' "$token" |
            curl --silent --max-time 60 --header @- \
              --header "Content-Type: application/json" \
              --output "$response" --write-out '%{http_code}' \
              "https://aiplatform.googleapis.com/v1/projects/${VERTEX_AI_PROJECT}/locations/${VERTEX_AI_LOCATION}/publishers/google/models/${GEMINI_MODEL}:generateContent" \
              --data '{"contents":[{"parts":[{"text":"Reply with the single word: ok"}]}],"generationConfig":{"maxOutputTokens":64}}') ||
            { echo "::error::Vertex request failed before an HTTP response."; exit 1; }
          echo "Vertex AI HTTP $status"
          if [[ "$status" != 200 ]]; then
            code=$(jq -r '.error.status' "$response" 2>/dev/null) || code=
            case "$code" in
              NOT_FOUND|PERMISSION_DENIED|UNAUTHENTICATED|INVALID_ARGUMENT|RESOURCE_EXHAUSTED|FAILED_PRECONDITION|UNAVAILABLE) ;;
              *) code=unavailable ;;
            esac
            # Classify known error details without printing provider strings.
            diagnostic=$(jq -r '
              .error as $error |
              ($error.message // "" | ascii_downcase) as $message |
              if any($error.details[]?; .reason == "USER_PROJECT_DENIED")
                then "quota project permission"
              elif any($error.details[]?; .reason == "SERVICE_DISABLED")
                then "Vertex API disabled"
              elif any($error.details[]?.fieldViolations[]?;
                       (.field // "" | test("maxOutputTokens|max_output_tokens"; "i"))) or
                   ($message | test("maxoutputtokens|max_output_tokens|output token"))
                then "output token limit"
              elif ($message | test("thinking")) then "thinking configuration"
              elif ($message | test("location|region|endpoint")) then "location or endpoint"
              elif ($message | test("billing|quota project|consumer project")) then "billing or quota project"
              elif ($message | test("role|contents|part")) then "request content"
              elif ($message | test("model|publisher")) then "model selection"
              else "unclassified"
              end
            ' "$response" 2>/dev/null) || diagnostic="unclassified"
            echo "Vertex AI diagnostic: $diagnostic"
            echo "::error::Vertex AI request failed ($code)."
            exit 1
          fi
          jq -e 'any(.candidates[]?.content.parts[]?; (.text | type == "string" and length > 0))' "$response" >/dev/null 2>&1 ||
            { echo "::error::Vertex AI returned no candidate text."; exit 1; }

  azure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: providers-live
    steps:
      - name: Authenticate to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure OpenAI live call
        env:
          AZURE_OPENAI_RESOURCE: ${{ secrets.AZURE_OPENAI_RESOURCE }}
          AZURE_OPENAI_RESOURCE_GROUP: ${{ secrets.AZURE_OPENAI_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          : "${AZURE_OPENAI_RESOURCE:?Missing Azure resource}"
          : "${AZURE_OPENAI_RESOURCE_GROUP:?Missing Azure resource group}"
          key=$(az cognitiveservices account keys list \
            --name "$AZURE_OPENAI_RESOURCE" \
            --resource-group "$AZURE_OPENAI_RESOURCE_GROUP" --query key1 -o tsv)
          : "${key:?Azure returned no account key}"
          echo "::add-mask::$key"
          response=$(mktemp)
          trap 'rm -- "$response"' EXIT
          status=$(printf 'api-key: %s\n' "$key" |
            curl --silent --max-time 60 --header @- \
              --header "Content-Type: application/json" \
              --output "$response" --write-out '%{http_code}' \
              "https://${AZURE_OPENAI_RESOURCE}.openai.azure.com/openai/v1/chat/completions" \
              --data '{"model":"gpt-4o","messages":[{"role":"user","content":"Reply with the single word: ok"}],"max_completion_tokens":64}') ||
            { echo "::error::Azure request failed before an HTTP response."; exit 1; }
          echo "Azure OpenAI HTTP $status"
          if [[ "$status" != 200 ]]; then
            code=$(jq -r '.error.code' "$response" 2>/dev/null) || code=
            case "$code" in
              DeploymentNotFound|ResourceNotFound|Unauthorized|Forbidden|InvalidRequest|BadRequest|TooManyRequests|content_filter) ;;
              *) code=unavailable ;;
            esac
            echo "::error::Azure OpenAI request failed ($code)."
            exit 1
          fi
          jq -e 'any(.choices[]?; (.message.content | type == "string" and length > 0))' "$response" >/dev/null 2>&1 ||
            { echo "::error::Azure OpenAI returned no assistant text."; exit 1; }
