name: Grid AI Rollup

on:
  push:
    branches:
      - release/grid-ai-rollup-v0.1.3

concurrency:
  group: grid-ai-rollup-v0.1.3
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_NAME: ghcr.io/praxis-proxy/grid-ai-rollup
  RELEASE_TAG: v0.1.3

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite existing tags
        run: |
          set -euo pipefail
          for tag in "${RELEASE_TAG}" "sha-${GITHUB_SHA}"; do
            if docker manifest inspect "${IMAGE_NAME}:${tag}" >/dev/null 2>&1; then
              echo "::error::Refusing to overwrite existing tag ${IMAGE_NAME}:${tag}"
              exit 1
            fi
          done

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=grid-ai-rollup-v0.1.3
          cache-to: type=gha,mode=max,scope=grid-ai-rollup-v0.1.3
          provenance: mode=max
          sbom: true
