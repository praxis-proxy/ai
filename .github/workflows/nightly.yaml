name: Nightly

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # Lint (fmt + clippy + dependency lint)
  # ----------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup Rust (lint)
        uses: praxis-proxy/conventions/.github/actions/setup-rust-lint@4c5423e4197eadfe606d0397bed190e65ad86cf2 # v0.7.0

      # 0.10.1 uses Path::is_empty, which is unstable on Rust 1.96.
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Lint
        run: make lint

  # ----------------------------------------------------------------------------
  # Documentation
  # ----------------------------------------------------------------------------

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@4c5423e4197eadfe606d0397bed190e65ad86cf2 # v0.7.0
        with:
          cache-suffix: doc

      - name: Build documentation
        run: make doc

  # ----------------------------------------------------------------------------
  # Unit tests
  # ----------------------------------------------------------------------------

  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@4c5423e4197eadfe606d0397bed190e65ad86cf2 # v0.7.0

      - name: Unit tests
        run: make test-unit

  # ----------------------------------------------------------------------------
  # Supply chain audit
  # ----------------------------------------------------------------------------

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Supply chain audit
        uses: praxis-proxy/conventions/.github/actions/supply-chain-audit@4c5423e4197eadfe606d0397bed190e65ad86cf2 # v0.7.0

  # ----------------------------------------------------------------------------
  # Coverage gate
  # ----------------------------------------------------------------------------

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Coverage check
        uses: praxis-proxy/conventions/.github/actions/coverage-check@4c5423e4197eadfe606d0397bed190e65ad86cf2 # v0.7.0
