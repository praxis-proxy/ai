name: vLLM Full Suite Notifications

on:
  workflow_run:
    workflows: [vLLM Integration]
    types: [requested, completed]

permissions: {}

jobs:
  notify-start:
    if: |
      github.event.action == 'requested' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null &&
      startsWith(github.event.workflow_run.display_title, 'vLLM full suite label - PR #')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PRAXIS_BOT_APP_ID }}
          private-key: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}

      - name: Comment that the full suite started
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REQUESTED_BY: ${{ github.event.workflow_run.actor.login }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if ! gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels \
            --jq '.labels[].name' | grep -Fxq 'vllm-full-suite'; then
            echo "vllm-full-suite is not present on PR #${PR_NUMBER}; skipping notification"
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body \
            "<!-- praxis:vllm-full-suite:${RUN_ID} -->
          Full live vLLM Responses suite started by @${REQUESTED_BY}: [run ${RUN_ID}](${RUN_URL})."

  notify-finish:
    if: |
      github.event.action == 'completed' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null &&
      startsWith(github.event.workflow_run.display_title, 'vLLM full suite label - PR #')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PRAXIS_BOT_APP_ID }}
          private-key: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}

      - name: Comment with the full suite result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- praxis:vllm-full-suite:${RUN_ID} -->"
          started=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --paginate --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
          if [ "$started" -eq 0 ]; then
            echo "No start notification found for run ${RUN_ID}; skipping completion notification"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/qualification"
          GH_TOKEN="$GH_READ_TOKEN" gh run download "$RUN_ID" --repo "$GH_REPO" \
            --name vllm-qualification --dir "$RUNNER_TEMP/qualification" || true
          python3 - "$RUNNER_TEMP/qualification/qualification.json" "$RUN_URL" \
            > "$RUNNER_TEMP/qualification-notification.md" <<'PY'
          import json, pathlib, sys
          try:
              report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          except (OSError, ValueError):
              report = {"status": "incomplete", "reason": "report artifact unavailable"}
          counts = report.get("suites", {}).get("native_responses", {}).get("totals", {})
          totals = ", ".join(f"{key} {counts.get(key, 0)}" for key in
                             ("passed", "failed", "skipped", "xfailed", "xpassed", "unexecuted"))
          checkout = report.get("gateway", {}).get("checkout_sha") or "unavailable"
          print(f"Native vLLM GPU qualification **{report['status']}** for `{checkout}`: "
                f"{totals}. {report.get('reason', '')} [Run and report]({sys.argv[2]}).")
          PY
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" \
            --body-file "$RUNNER_TEMP/qualification-notification.md"
