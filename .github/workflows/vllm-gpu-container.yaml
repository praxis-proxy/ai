name: vLLM GPU Container

# ------------------------------------------------------------------------------
# Build the model-baked vLLM GPU image, prove it serves Praxis traffic on a real
# GPU, and only then publish it.
#
# The gate is the repository's own live-vLLM coverage -- the `critical_vllm`
# subset of tests/integration/sdk/openai/test_openai_responses_vllm.py, run with
# VLLM_TEST_BACKEND=live, exactly as the vllm-live-cpu job in
# vllm-integration.yaml runs it against the CPU image. That drives real
# Responses API traffic through Praxis into this image (including the OGX
# file_search / file_resolve paths), rather than curling the backend directly.
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - "vllm/Containerfile"
      - ".github/actions/build-vllm-gpu/**"
      - ".github/actions/start-vllm/**"
      - ".github/actions/wait-vllm/**"
      - ".github/actions/start-ec2-runner/**"
      - ".github/actions/stop-ec2-runner/**"
      - ".github/workflows/vllm-gpu-container.yaml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "vllm/Containerfile"
      - ".github/actions/build-vllm-gpu/**"
      - ".github/actions/start-vllm/**"
      - ".github/actions/wait-vllm/**"
      - ".github/actions/start-ec2-runner/**"
      - ".github/actions/stop-ec2-runner/**"
      - ".github/workflows/vllm-gpu-container.yaml"
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      inference_model:
        description: "Inference model (HuggingFace ID) — default is Qwen/Qwen3-8B"
        type: string
      gpu_instance_type:
        description: >-
          Optional EC2 GPU instance-type override for transient capacity
          shortages (for example, g5.2xlarge).
        required: false
        default: g5.xlarge
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/praxis-proxy/vllm-gpu
  # Same model the GPU jobs in vllm-integration.yaml serve (VLLM_GPU_MODEL), so
  # the image this workflow publishes is the one that coverage is qualified on.
  INFERENCE_MODEL: ${{ inputs.inference_model || 'Qwen/Qwen3-8B' }}
  # Instance type for the ephemeral GPU runner, matching vllm-integration.yaml.
  # g5.xlarge = A10G (24 GiB, compute capability 8.6), which holds the 15.3 GiB
  # bf16 Qwen3-8B checkpoint with room for a KV cache and has FlashAttention-2.
  GPU_INSTANCE_TYPE: "g5.xlarge"
  # The CPU job runs at 0.5; 0.9 here matches what the GPU jobs in
  # vllm-integration.yaml give vLLM on the same card.
  GPU_MEMORY_UTILIZATION: "0.9"
  # OGX + transformers pins live in tests/integration/ogx-constraints.txt (with
  # the rationale for each pin), single-sourced so the uv download cache key
  # depends only on the pins. Same file the vllm-integration jobs install from.
  OGX_CONSTRAINTS: "tests/integration/ogx-constraints.txt"

jobs:
  changes:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant path changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'vllm/Containerfile' \
            '.github/actions/build-vllm-gpu/' \
            '.github/actions/start-vllm/' \
            '.github/actions/wait-vllm/' \
            '.github/actions/start-ec2-runner/' \
            '.github/actions/stop-ec2-runner/' \
            '.github/workflows/vllm-gpu-container.yaml')
          if [ -n "$CHANGED" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # No GPU runner is standing by for this workflow, so provision an ephemeral
  # EC2 instance for the run and tear it down unconditionally afterwards --
  # the same pattern the nightly GPU jobs in vllm-integration.yaml use.
  # ----------------------------------------------------------------------------

  gpu-start-runner:
    name: Start ephemeral EC2 GPU runner
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true') &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start EC2 GPU runner
        id: start
        uses: ./.github/actions/start-ec2-runner
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          ami-id: ${{ vars.AWS_GPU_AMI_ID }}
          subnet-id: ${{ vars.AWS_SUBNET_ID || vars.US_EAST_2A_SUBNET_ID }}
          security-group-id: ${{ vars.AWS_SECURITY_GROUP_ID || vars.US_EAST_2_SG_ID }}
          instance-type: ${{ inputs.gpu_instance_type || env.GPU_INSTANCE_TYPE }}
          github-token: ${{ secrets.PRAXIS_RUNNER_PAT }}

  build-test:
    needs: [changes, gpu-start-runner]
    if: |
      !cancelled() && needs.gpu-start-runner.result == 'success'
    # The dynamically generated label of the instance provisioned above; there
    # is no statically registered GPU runner to fall back to.
    runs-on: ${{ needs.gpu-start-runner.outputs.label }}
    # Covers the CUDA base image pull, the ~16 GiB bf16 checkpoint baked into
    # the build, the OGX dependency closure, a debug Praxis build, the live
    # suite, and the GHCR push of the resulting image.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image tag
        run: echo "IMAGE_TAG=${INFERENCE_MODEL#*/}" >> "$GITHUB_ENV"

      - name: Verify GPU and select container runtime
        run: |
          set -euo pipefail
          # Fail here, before a 10+ GiB build, if the provisioned instance came
          # up without a usable GPU.
          nvidia-smi
          if command -v docker > /dev/null 2>&1 && docker info > /dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"
            echo "GPU_DEVICE_ARGS=--gpus all" >> "$GITHUB_ENV"
          elif command -v podman > /dev/null 2>&1 && podman info > /dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=podman" >> "$GITHUB_ENV"
            echo "GPU_DEVICE_ARGS=--device nvidia.com/gpu=all" >> "$GITHUB_ENV"
          else
            echo "::error::neither docker nor podman is usable on this runner"
            exit 1
          fi

      - name: Free disk space
        run: |
          # The CUDA base image plus the baked model weights need tens of GiB.
          # The instance is ephemeral and the runner agent is a host service,
          # not a container, so reclaiming every cached image on the AMI is
          # safe -- nothing here outlives the job.
          "$CONTAINER_RUNTIME" system prune -af || true
          df -h /

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The GPU AMI ships Python 3.9; ogx[starter] needs >=3.12, so pin the
          # interpreter setup-uv provisions.
          python-version: "3.12"
          # Key ONLY on the pins file, matching vllm-integration.yaml: setup-uv
          # has no restore-key fallback, so globbing anything else would force a
          # cold multi-GB OGX re-download whenever this workflow is edited. The
          # cache is repo-scoped, so it still warms across ephemeral runners.
          enable-cache: true
          cache-dependency-glob: |
            tests/integration/ogx-constraints.txt

      - name: Build image
        uses: ./.github/actions/build-vllm-gpu
        with:
          model: ${{ env.INFERENCE_MODEL }}
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          runtime: ${{ env.CONTAINER_RUNTIME }}
          hugging-face-token: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}

      - name: Start vLLM on GPU
        uses: ./.github/actions/start-vllm
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          # Serve under the full HuggingFace id so the test harness's VLLM_MODEL
          # matches the CPU job's. The short form is only the image tag.
          model: ${{ env.INFERENCE_MODEL }}
          model-path: /opt/vllm/models/${{ env.INFERENCE_MODEL }}
          runtime: ${{ env.CONTAINER_RUNTIME }}
          # Built locally in the step above; there is nothing to pull.
          pull: "false"
          device-args: ${{ env.GPU_DEVICE_ARGS }}
          gpu-memory-utilization: ${{ env.GPU_MEMORY_UTILIZATION }}

      - name: Pre-install OGX dependencies
        run: |
          # Resolve + download the full OGX closure synchronously and OFF the
          # readiness clock, so it never races the "Wait for OGX readiness"
          # window under network variance.
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx --help > /dev/null

      - name: Start OGX
        run: |
          uv run --with-requirements "$OGX_CONSTRAINTS" ogx run starter --insecure > /tmp/ogx.log 2>&1 &
          echo $! > /tmp/ogx.pid

      - name: Build Praxis
        run: cargo build -p praxis-ai-proxy --no-default-features --features standard,openai-all,store-sqlite

      - name: Wait for vLLM readiness
        uses: ./.github/actions/wait-vllm
        with:
          runtime: ${{ env.CONTAINER_RUNTIME }}
          # No pull window to absorb: only the GPU model load.
          timeout: "600"

      - name: Wait for OGX readiness
        run: |
          dump_ogx_log() {
            echo "----- /tmp/ogx.log (tail -n 200) -----"
            tail -n 200 /tmp/ogx.log 2>/dev/null || echo "No OGX log found"
          }
          OGX_PID="$(cat /tmp/ogx.pid)"
          deadline=$((SECONDS + 300))
          until curl -sf http://127.0.0.1:8321/v1/files > /dev/null 2>&1; do
            if ! kill -0 "$OGX_PID" 2>/dev/null; then
              echo "::error::OGX process (pid $OGX_PID) exited before binding port 8321"
              dump_ogx_log
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::OGX did not become ready within 300s"
              dump_ogx_log
              exit 1
            fi
            sleep 2
          done
          echo "OGX is ready"

      - name: Run critical live vLLM tests against the GPU image
        env:
          VLLM_TEST_BACKEND: live
          VLLM_MODEL: ${{ env.INFERENCE_MODEL }}
        run: |
          uv run tests/integration/sdk/openai/test_openai_responses_vllm.py \
            -s -m "critical_vllm"

      - name: vLLM container logs
        if: failure()
        run: |
          "$CONTAINER_RUNTIME" logs vllm 2>&1 || echo "(no vllm container)"

      - name: OGX logs
        if: failure()
        run: cat /tmp/ogx.log 2>/dev/null || echo "No OGX log found"

      - name: Stop vLLM
        if: always()
        run: |
          "$CONTAINER_RUNTIME" rm -f vllm || true

      - name: Stop OGX
        if: always()
        run: |
          if [ -f /tmp/ogx.pid ]; then
            kill "$(cat /tmp/ogx.pid)" 2>/dev/null || true
          fi

      # Publishing runs only after the live suite passed: these steps carry the
      # implicit success() condition, so a failed test skips the push.
      - name: Log in to GHCR (docker)
        if: contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && env.CONTAINER_RUNTIME == 'docker'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (podman)
        if: contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && env.CONTAINER_RUNTIME == 'podman'
        env:
          # docker/login-action shells out to the docker CLI, which a
          # podman-only runner does not have.
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | podman login "$REGISTRY" \
            --username "$GHCR_USERNAME" --password-stdin

      - name: Push image
        if: contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name)
        run: |
          set -euo pipefail
          "$CONTAINER_RUNTIME" push "${IMAGE_NAME}:${IMAGE_TAG}"
          if [ "${{ github.event_name }}" = "push" ]; then
            "$CONTAINER_RUNTIME" tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_NAME}:latest"
            "$CONTAINER_RUNTIME" push "${IMAGE_NAME}:latest"
          fi

  gpu-stop-runner:
    name: Stop ephemeral EC2 GPU runner
    # MUST depend on every job that runs on the instance; otherwise the runner
    # could be deregistered while build-test is still queued/running.
    needs: [gpu-start-runner, build-test]
    # Always tear down the instance, even on failure/cancel, but skip when the
    # runner was never started.
    if: always() && needs.gpu-start-runner.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop EC2 GPU runner
        uses: ./.github/actions/stop-ec2-runner
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          github-token: ${{ secrets.PRAXIS_RUNNER_PAT }}
          label: ${{ needs.gpu-start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.gpu-start-runner.outputs.ec2-instance-id }}
