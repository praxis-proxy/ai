name: CI Status

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # Aggregate CI Check Status
  # ----------------------------------------------------------------------------

  ci-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      checks: read
      pull-requests: read
    steps:
      - name: Wait for CI checks to complete
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Wait for other workflows to get queued
            core.info('Waiting 60s for CI workflows to get queued...');
            await new Promise(r => setTimeout(r, 60000));

            const excludedChecks = new Set([
              'ci-status',
              'test-praxis-main',
            ]);

            const terminalStatuses = new Set(['completed']);
            const successConclusions = new Set(['success', 'skipped', 'neutral']);
            const failureConclusions = new Set([
              'failure', 'timed_out', 'cancelled',
              'action_required', 'startup_failure', 'stale',
            ]);

            while (true) {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });

              // Only include GitHub Actions checks, excluding ourselves
              const filtered = checkRuns.filter(cr => {
                if (excludedChecks.has(cr.name)) return false;
                if (!cr.app || cr.app.slug !== 'github-actions') return false;
                return true;
              });

              // Deduplicate by check name, keeping the most recently started run.
              // When cancel-in-progress supersedes a run, both the cancelled and
              // the replacement run appear as separate check_run entries on the
              // same SHA. Without dedup the cancelled run blocks forever.
              const latestByName = new Map();
              for (const cr of filtered) {
                const prev = latestByName.get(cr.name);
                if (!prev || new Date(cr.started_at) > new Date(prev.started_at)) {
                  latestByName.set(cr.name, cr);
                }
              }
              const relevant = [...latestByName.values()];

              if (relevant.length === 0) {
                core.info('No other CI checks found yet, waiting...');
                await new Promise(r => setTimeout(r, 30000));
                continue;
              }

              // A check is done when its status is "completed", OR when the API
              // reports a conclusion despite the status still being "in_progress"
              // (a known GitHub glitch where status never flips).
              const isDone = cr => terminalStatuses.has(cr.status) || cr.conclusion != null;
              const pending = relevant.filter(cr => !isDone(cr));
              const completed = relevant.filter(cr => isDone(cr));

              core.info(`Checks: ${completed.length} completed, ${pending.length} pending out of ${relevant.length} total`);

              for (const cr of completed) {
                core.info(`  ✓ ${cr.name}: ${cr.conclusion}`);
              }
              for (const cr of pending) {
                core.info(`  ⏳ ${cr.name}: ${cr.status}`);
              }

              if (pending.length > 0) {
                core.info('Waiting 30s for pending checks...');
                await new Promise(r => setTimeout(r, 30000));
                continue;
              }

              // All checks completed — evaluate conclusions
              const failed = completed.filter(cr => failureConclusions.has(cr.conclusion));

              if (failed.length > 0) {
                for (const cr of failed) {
                  core.warning(`${cr.name} concluded with: ${cr.conclusion} — waiting for re-run`);
                }
                core.info(`${failed.length} check(s) failed. Waiting 30s for re-runs before giving up...`);
                core.info('Re-run the failed job(s) and ci-status will pick up the result automatically.');
                await new Promise(r => setTimeout(r, 30000));
                continue;
              }

              const succeeded = completed.filter(cr => successConclusions.has(cr.conclusion));
              core.info(`All ${succeeded.length} CI checks passed.`);
              return;
            }
