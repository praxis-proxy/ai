name: Tests

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose test output (V=1)"
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Line-tables-only debuginfo: faster codegen and much smaller target/ caches
  # (debuginfo dominates artifact size), which also eases the hard 10 GB cache
  # cap so caches survive longer. Backtraces still resolve.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  V: ${{ inputs.debug && '1' || '' }}

jobs:
  release-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test CI and GPU qualification reporting
        run: python3 -m unittest discover -s tests/qualification

  # ----------------------------------------------------------------------------
  # Lint (fmt + clippy)
  #
  # Split into lint-clippy and lint-xtask so the workspace clippy passes and the
  # xtask meta-lint build run in parallel. They share no build artifacts (clippy
  # output is unusable by `cargo run`, and xtask's `dev` feature resolves a
  # distinct dependency graph), so serially the xtask build recompiled the tree a
  # second time — ~26m end to end. As two jobs the wall-clock collapses to the
  # heavier half. Each job takes its own cache-suffix; local `make lint` still
  # runs both serially.
  # ----------------------------------------------------------------------------

  lint-clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        uses: ./.github/actions/install-actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Setup Rust (lint)
        uses: praxis-proxy/conventions/.github/actions/setup-rust-lint@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: lint-clippy-cargo

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Lint (clippy + fmt + deps)
        run: make lint-clippy

  lint-xtask:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust (lint)
        uses: praxis-proxy/conventions/.github/actions/setup-rust-lint@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: lint-xtask-cargo

      - name: Lint (xtask meta lints)
        run: make lint-xtask

  # ----------------------------------------------------------------------------
  # Unit tests
  #
  # Split by crate so praxis-ai-apis, praxis-ai-filters, and praxis-ai-proxy
  # compile their feature permutations in parallel. Run serially in one job (nine
  # `cargo test` invocations recompiling the tree across feature sets), this was
  # the workflow's ~38m long pole; as three jobs the wall-clock collapses to the
  # heaviest crate (proxy, top of the dep graph). Each job takes its own
  # cache-suffix; local `make test-unit` still runs all three serially.
  # ----------------------------------------------------------------------------

  test-apis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: test-unit-apis-cargo

      - name: Unit tests (apis + build-support)
        run: make test-unit-apis

  test-filters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: test-unit-filters-cargo

      - name: Unit tests (filters)
        run: make test-unit-filters

  # ----------------------------------------------------------------------------
  # Model-to-provider latency microbenchmark (release profile)
  #
  # Split out of test-filters: `--release` is a separate compile profile whose
  # artifacts are not shared with the dev/test build, so running it inline
  # recompiled praxis-ai-filters from scratch and added ~8.6m to that job's
  # critical path. Runs in parallel now, off the pole. Cache-neutral:
  # registry-only cache (cache-target: false) under the shared split suffix, so
  # it adds no new target/ cache family against the hard 10 GB cap.
  # ----------------------------------------------------------------------------

  bench-model-to-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: ci-split-registry
          cache-target: "false"

      - name: Model-to-provider latency benchmark (release)
        run: make bench-model-to-provider

  test-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: test-unit-proxy-cargo

      - name: Unit tests (proxy)
        run: make test-unit-proxy

  # Feature-graph checks: compile each store permutation and assert no backend
  # leaks across the graphs. Keeps the store-features-cargo cache.
  store-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: store-features-cargo

      - name: Store backend feature-graph checks
        run: make test-store-features-check

  # ----------------------------------------------------------------------------
  # Per-group gate-leak clippy, fanned out as a matrix so the ~10 clippy passes
  # run in parallel instead of serializing (~25m -> the slowest single pass). The
  # matrix is generated from the Makefile's STORE_FEATURE_CLIPPY_GROUPS (via
  # print-store-clippy-groups) so the list has a single source of truth and
  # cannot silently drift. Cache-neutral (registry-only) under the hard 10 GB cap.
  # ----------------------------------------------------------------------------

  store-clippy-groups:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build clippy group matrix from the Makefile
        id: list
        run: |
          groups="$(make --no-print-directory print-store-clippy-groups)"
          if [ -z "${groups//[[:space:]]/}" ]; then
            echo "::error::STORE_FEATURE_CLIPPY_GROUPS is empty; no Clippy matrix can be created." >&2
            exit 1
          fi
          json="$(printf '%s' "$groups" | tr ' ' '\n' | jq -R 'select(length > 0)' | jq -s -c .)"
          echo "groups=$json" >> "$GITHUB_OUTPUT"

  store-features-clippy:
    needs: store-clippy-groups
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.store-clippy-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: ci-split-registry
          cache-target: "false"

      - name: Clippy standard + ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
        run: make test-store-features-clippy-group GROUP="$GROUP"

  # Store API tests plus the final TLS-backend graph assertions.
  store-features-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: ci-split-registry
          cache-target: "false"

      - name: Store API tests
        run: make test-store-features-test

