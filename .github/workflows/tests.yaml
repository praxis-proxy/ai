name: Tests

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose test output (V=1)"
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  V: ${{ inputs.debug && '1' || '' }}

jobs:
  # ----------------------------------------------------------------------------
  # Lint (fmt + clippy)
  #
  # Split into lint-clippy and lint-xtask so the workspace clippy passes and the
  # xtask meta-lint build run in parallel. They share no build artifacts (clippy
  # output is unusable by `cargo run`, and xtask's `dev` feature resolves a
  # distinct dependency graph), so serially the xtask build recompiled the tree a
  # second time — ~26m end to end. As two jobs the wall-clock collapses to the
  # heavier half. Each job takes its own cache-suffix; local `make lint` still
  # runs both serially.
  # ----------------------------------------------------------------------------

  lint-clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        uses: ./.github/actions/install-actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Setup Rust (lint)
        uses: praxis-proxy/conventions/.github/actions/setup-rust-lint@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          cache-suffix: lint-clippy-cargo

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Lint (clippy + fmt + deps)
        run: make lint-clippy

  lint-xtask:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust (lint)
        uses: praxis-proxy/conventions/.github/actions/setup-rust-lint@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          cache-suffix: lint-xtask-cargo

      - name: Lint (xtask meta lints)
        run: make lint-xtask

  # ----------------------------------------------------------------------------
  # Unit tests
  #
  # Split by crate so praxis-ai-apis, praxis-ai-filters, and praxis-ai-proxy
  # compile their feature permutations in parallel. Run serially in one job (nine
  # `cargo test` invocations recompiling the tree across feature sets), this was
  # the workflow's ~38m long pole; as three jobs the wall-clock collapses to the
  # heaviest crate (proxy, top of the dep graph). Each job takes its own
  # cache-suffix; local `make test-unit` still runs all three serially.
  # ----------------------------------------------------------------------------

  test-apis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: test-unit-apis-cargo

      - name: Unit tests (apis + build-support)
        run: make test-unit-apis

  test-filters:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: test-unit-filters-cargo

      - name: Unit tests (filters)
        run: make test-unit-filters

  test-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: test-unit-proxy-cargo

      - name: Unit tests (proxy)
        run: make test-unit-proxy

  store-features:
    runs-on: ubuntu-24.04
    # Also lints each opt-in feature group on its own (one clippy pass each).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@c5837c3fdd35066b05d337594fabe9d641d08df2 # v0.3.0
        with:
          cache-suffix: store-features-cargo

      - name: Store backend feature matrix
        run: make test-store-features

