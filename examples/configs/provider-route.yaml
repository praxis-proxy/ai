# Provider-side Praxis AI inference pipeline.
#
# This listener requires downstream mTLS. `peer_identity_trust` authenticates
# and authorizes the edge gateway before AI-owned x-ai-routing-* fields can
# influence provider-local routing.

listeners:
  - name: provider
    address: "0.0.0.0:8443"
    filter_chains:
      - provider-inference
    tls:
      certificates:
        - cert_path: /etc/praxis/tls/tls.crt
          key_path: /etc/praxis/tls/tls.key
      client_ca:
        ca_path: /etc/praxis/tls/client-ca.crt
      client_cert_mode: require

filter_chains:
  - name: provider-inference
    filters:
      # This security filter must remain first, unconditional, and fail closed.
      - filter: peer_identity_trust
        trusted_peers:
          - organization: ai-grid

      # Parse the OpenAI-compatible request and promote model to X-Model.
      - filter: json_body_field
        field: model
        header: X-Model

      # Exact local policy mapping. This is not another routing engine.
      - filter: provider_route
        provider_id: site-us-west
        model_header: X-Model
        emit_demo_attribution: true
        routes:
          - candidate_id: inference_model/mock-model/site-us-west/provider-us-west
            model: mock-model
            paths:
              - /v1/chat/completions
              - /v1/responses
            cluster: mock-backend
            credential:
              strategy: bearer_token
              secretRef:
                name: openai-provider
                namespace: grid-demo
                key: token

      # Provider credentials are mounted as files and resolved at startup.
      - filter: credential_inject
        credentials:
          - strategy: bearer_token
            name: openai-provider
            namespace: grid-demo
            key: token
            file: /run/secrets/provider-credentials/openai-provider/token

      - filter: load_balancer
        clusters:
          - name: mock-backend
            endpoints:
              - "mock-backend.grid-demo.svc.cluster.local:8080"

admin:
  address: "127.0.0.1:9901"
shutdown_timeout_secs: 5
