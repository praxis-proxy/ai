# Intelligent Route: Load-Signal Scoring
#
# A `signals` block starts a background collector that polls the local grid
# operator and, within the winning locality group, routes to the least-loaded
# member. Load never crosses a group, so locality still leads. With no `signals`
# block the pick is byte-identical to static scoring.
#
# Minimal opt-in (default endpoint and signals): `signals: {}`. The block below
# is the tuned variant.
#
# Usage:
#   cargo run -p praxis-ai-proxy -- -c examples/configs/intelligent-route-load-scoring.yaml

listeners:
  - name: proxy
    address: "0.0.0.0:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: json_body_field
        field: model
        header: X-Model

      # The two candidates share a capability, so they form one group and load
      # scoring picks between them.
      - filter: intelligent_route
        local_site: site-a
        model_header: X-Model
        candidates:
          - kind: inference_model
            name: granite-3.3-8b
            site: site-a
            cluster: granite-local
            fresh: true
          - kind: inference_model
            name: granite-3.3-8b
            site: site-b
            cluster: granite-remote
            fresh: true

        signals:
          endpoint: https://grid-operator-signals:9091/v1/site/signals
          interval_ms: 1000
          window_secs: 300
          max_age_ms: 30000
          timeout_ms: 1500
          tls:
            ca_path: /etc/grid/ca.crt
            cert_path: /etc/grid/client.crt
            key_path: /etc/grid/client.key
          signals:
            - key: llm_d_epp_average_queue_size
              lower_is_better: true
              scale: relative
              deadband: 1.0
            - key: llm_d_epp_average_kv_cache_utilization
              lower_is_better: true
              scale: ratio
              deadband: 0.05

      - filter: load_balancer
        clusters:
          - name: granite-local
            endpoints:
              - "127.0.0.1:8001"
          - name: granite-remote
            endpoints:
              - "127.0.0.1:8002"

admin:
  address: "127.0.0.1:9901"
shutdown_timeout_secs: 5

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
