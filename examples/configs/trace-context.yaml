# Trace Context Propagation
#
# Propagates x-request-id and W3C traceparent across every leg of an
# AI request, so a single request is traceable end to end.
#
# An AI request reaches the backend over two paths:
#
#   forwarded   client -> proxy -> backend   (the request itself)
#   delegated   proxy  -> backend            (callouts the proxy makes
#                                             while handling it, such as
#                                             Files API lookups)
#
# The trace_context filter stamps the forwarded request. Filters that
# make delegated calls inject the same identifiers automatically,
# without configuration, and draw their own span-id from the shared
# trace-id. Both legs land in one trace while remaining individually
# measurable.
#
# A valid inbound traceparent is continued. An absent or malformed one
# starts a new sampled trace: client-supplied values are validated
# rather than forwarded.
#
# Placement: register trace_context early. Filters that make delegated
# calls read the injected values, so anything running before it
# resolves trace context independently and lands in a different trace.
#
# The one exception is the request_id core builtin: when it is used, it
# must come before trace_context. It reads only the client's headers,
# so running it later mints a second ID that wins on the forwarded
# request while the delegated calls keep the first. Ordered as below,
# trace_context adopts the ID request_id injected and every leg agrees.
#
# Usage:
#   cargo run -p praxis-ai-proxy -- -c examples/configs/trace-context.yaml
#
#   curl -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -H "traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01" \
#     -d '{"model":"gpt-4o","input":[{"role":"user","content":[{"type":"input_file","file_id":"file-abc"}]}]}'
#
# The Files API callout and the forwarded /v1/responses request both
# arrive carrying trace-id 4bf92f3577b34da6a3ce929d0e0e4736 under
# different span-ids.

listeners:
  - name: ai-gateway
    address: "127.0.0.1:8080"
    filter_chains: [traced]

filter_chains:
  - name: traced
    filters:
      # Before trace_context: it adopts the ID injected here, so the
      # forwarded request, the delegated calls, and the echoed
      # response header all carry one x-request-id.
      - filter: request_id

      # Early: everything downstream reads what this injects.
      - filter: trace_context

      - filter: openai_responses_format
        on_invalid: continue
        headers:
          format: x-praxis-ai-format
          model: x-praxis-ai-model

      # Delegated calls. Correlation headers are sent unconditionally,
      # so forward_headers only needs the application headers.
      - filter: openai_file_resolve
        files_api_url: "http://127.0.0.1:8321"
        allow_private_files_api_url: true
        allow_pre_security_callout: true
        forward_headers:
          - authorization
        on_missing: reject
        timeout_ms: 10000

      - filter: router
        routes:
          - path_prefix: "/v1/files"
            cluster: files-api
          - path_prefix: "/"
            cluster: inference-backend

      - filter: load_balancer
        clusters:
          - name: files-api
            endpoints: ["127.0.0.1:8321"]
          - name: inference-backend
            endpoints: ["127.0.0.1:8321"]
