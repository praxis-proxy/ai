# OpenAI Chat Completions clients reach the overlay-selected Anthropic Messages
# or OpenAI-compatible provider and receive translated Anthropic JSON/SSE or
# unchanged OpenAI-compatible responses.
# `intelligent_route` binds the trusted provider profile to each request before
# response and SSE processing.

listeners:
  - name: proxy
    address: "0.0.0.0:8080"
    filter_chains: [main]

filter_chains:
  - name: main
    filters:
      - filter: model_to_header
        header: X-Model

      - filter: intelligent_route
        overlay_file: /etc/praxis/routing/routing-overlay.json
        model_header: X-Model
        clusters: [anthropic-backend, openai-backend]
        reload: {enabled: true, debounce_ms: 100}

      - filter: openai_chat_completions_to_anthropic_stream
        max_partial_event_bytes: 1048576
        max_tool_blocks: 256

      - filter: openai_chat_completions_to_anthropic
        api_translation_enabled: true
        max_body_bytes: 1048576

      - filter: credential_inject
        credentials: []
        projected_credential_mount_base: /run/secrets/provider-credentials

      - filter: load_balancer
        clusters:
          - name: anthropic-backend
            endpoints: ["127.0.0.1:8001"]
          - name: openai-backend
            endpoints: ["127.0.0.1:8002"]

admin:
  address: "127.0.0.1:9901"
shutdown_timeout_secs: 5

insecure_options:
  allow_private_endpoints: true
