# Anthropic Messages to Chat Completions
#
# Transforms Anthropic Messages API requests and responses for
# Chat Completions-compatible inference backends.
#
# The `anthropic_messages_to_chat_completions` filter name reflects the
# wire formats it bridges. It targets the Chat Completions wire shape,
# so any Chat Completions-compatible backend can use it, not only OpenAI.
#
# Request: system hoisting, content block flattening, tool mapping, and
# removal of both client credential headers (`x-api-key` and `Authorization`)
# so a caller's Anthropic key cannot reach the Chat Completions backend. A
# `credential_injection` in the same chain still installs the backend's own
# token: pending header removals are applied before injected values.
# Response: content blocks, stop_reason, usage mapping back to
# Anthropic format. Streaming responses are converted by
# `anthropic_messages_to_chat_completions_stream`.
#
# API version: the translator removes `anthropic-version`, and the caller's
# version does not change translation. Requests from Anthropic SDK v1
# (`2023-06-01`) and SDK v2 (`2026-10-21`) are translated identically:
# `temperature` and `top_p` are mapped and `top_k` is forwarded, while
# `document` blocks and non-empty citations are rejected with a 400 because
# Chat Completions cannot represent them.
#
# Credentials: this chain has no gateway authentication and injects no backend
# token. Add `basic_auth` and `credential_injection` as in
# `messages-to-openai-vllm.yaml` for a deployment.
#
# Images: the cluster declares `application_provider: openai` and the
# translator lists `openai` in `image_input_providers`, so Anthropic image
# blocks in message content become Chat Completions `image_url` parts for this
# image-capable backend (for example `api.openai.com`). `base64` sources become
# data URLs; `url` sources are forwarded for the backend to fetch, and Praxis
# never fetches them. Trust comes from that cluster declaration, never from the
# endpoint address: a cluster without a listed provider rejects image requests
# with a 400. Images nested in `tool_result` content are rejected for every
# backend because a Chat Completions tool message cannot carry them.

listeners:
  - name: anthropic-gateway
    address: "127.0.0.1:8080"
    filter_chains: [anthropic-transform]

filter_chains:
  - name: anthropic-transform
    filters:
      - filter: anthropic_messages_request
        on_invalid: continue

      - filter: anthropic_messages_to_chat_completions
        max_body_bytes: 1048576
        # Selected clusters whose `application_provider` is listed here may
        # receive translated images; every other cluster fails closed.
        image_input_providers:
          - openai

      # response_conditions is optional: the filter self-arms via
      # metadata and Content-Type checks internally. Adding it
      # skips filter dispatch entirely for non-SSE responses.
      - filter: anthropic_messages_to_chat_completions_stream
        max_partial_event_bytes: 10485760
        # Cap on distinct streaming tool-call content blocks retained per
        # response. Bounds per-response memory when an upstream streams
        # many unique tool-call indices; exceeding it fails the stream
        # closed.
        max_tool_blocks: 10000
        response_conditions:
          - when:
              headers:
                content-type: "text/event-stream"

      - filter: path_rewrite
        replace:
          pattern: "^/v1/messages$"
          replacement: "/v1/chat/completions"
        conditions:
          - when:
              path_prefix: "/v1/messages"

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: "chat-completions-backend"

      - filter: load_balancer
        clusters:
          - name: "chat-completions-backend"
            http:
              # An image-capable Chat Completions backend; listed in the
              # translator's `image_input_providers` above.
              application_provider: openai
            endpoints:
              - "127.0.0.1:8000"

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
