# Anthropic Messages Web Search -> Chat Completions vLLM
#
# Runs the server-owned Anthropic Messages web-search loop against a vLLM backend
# that serves only OpenAI Chat Completions. It combines the iterative web-search
# machinery of `full-flow-agentic.yaml` with the Anthropic <-> Chat Completions
# translation of `messages-to-openai-vllm.yaml`, so a client speaks the Anthropic
# wire format while the model runs on a Chat-Completions-only vLLM deployment.
#
# The client declares a `WebSearch` tool and (optionally) forces it via
# `tool_choice`. Each round the request is translated to Chat Completions and sent
# to vLLM; when the model returns a `WebSearch` tool call, the translation layer
# rebuilds it as an Anthropic `tool_use` block, `anthropic_web_search` executes
# the search against the configured provider, appends the result, and re-enters
# the model. On re-entry the filter relaxes `tool_choice` to `auto`, so once the
# model has results it can emit a final text answer and the loop terminates.
#
# Filter ordering inside the inference step is deliberate. Response filters run in
# the reverse of request order, so `anthropic_web_search` is placed FIRST in the
# step: on the request phase it parses/rebuilds the Anthropic body before
# translation, and on the response phase it runs LAST, after
# `anthropic_messages_to_chat_completions[_stream]` has already converted the
# vLLM Chat Completions response back into Anthropic Messages for it to classify.
#
# Both transports are served from one pipeline, selected per request from the
# client's `stream` flag: a streaming request receives one coherent Anthropic
# Messages SSE lifecycle; a buffered request receives one final JSON object.
#
# Requires WEB_SEARCH_API_KEY (the search provider key; this example uses Tavily,
# whose key travels in the request body) and VLLM_API_KEY (the backend Bearer
# token injected toward the cluster). The vLLM Chat Completions backend listens
# on 127.0.0.1:8000.
#
# Run against a live vLLM backend:
#   WEB_SEARCH_API_KEY="$TAVILY_API_KEY" VLLM_API_KEY="$VLLM_API_KEY" \
#     cargo run -p praxis-ai-proxy -- \
#     -c examples/configs/anthropic/web-search-to-openai-vllm.yaml
#
# Buffered request:
#   curl http://127.0.0.1:8080/v1/messages \
#     -H 'content-type: application/json' \
#     -d '{"model":"Qwen/Qwen3-8B","max_tokens":512,"messages":[{"role":"user","content":"Use web search to look up potato, then summarize in one sentence."}],"tools":[{"name":"WebSearch","description":"Search the web","input_schema":{"type":"object","properties":{"query":{"type":"string"}},"required":["query"]}}],"tool_choice":{"type":"tool","name":"WebSearch"}}'
#
# Streaming request: send the same body with "stream": true.

listeners:
  - name: anthropic-web-search-vllm
    address: "127.0.0.1:8080"
    filter_chains: [anthropic-web-search-vllm]

filter_chains:
  - name: anthropic-web-search-vllm
    filters:
      - filter: trace_context
        # Establish typed correlation before IRR snapshots request extensions;
        # Praxis core creates a fresh span ID for each search callout hop.

      - filter: anthropic_messages_format
        on_invalid: reject
      - filter: anthropic_validate
      - filter: iterative_request_router
        initial_step: inference
        max_iterations: 6
        timeout_ms: 90000
        steps:
          - name: inference
            filters:
              # FIRST in the step so it runs LAST in the response phase, observing
              # the Chat Completions response already translated back to Anthropic
              # Messages by the filters below.
              - filter: anthropic_web_search
                provider: tavily
                api_key: ${WEB_SEARCH_API_KEY}
                default_context_size: medium
                timeout_ms: 10000

              # Translate the Anthropic request into Chat Completions and the
              # non-streaming response back into Anthropic Messages.
              - filter: anthropic_messages_to_chat_completions
                max_body_bytes: 1048576
                conditions:
                  - when:
                      path: "/v1/messages"

              # Convert streaming Chat Completions SSE back into Anthropic SSE,
              # gated to `text/event-stream` responses.
              - filter: anthropic_messages_to_chat_completions_stream
                max_partial_event_bytes: 10485760
                max_tool_blocks: 10000
                response_conditions:
                  - when:
                      headers:
                        content-type: "text/event-stream"

              # Strip the client's native Anthropic auth header; the backend
              # credential is injected below.
              - filter: headers
                request_remove:
                  - x-api-key

              # Map the Anthropic message endpoint onto the backend's Chat
              # Completions endpoint.
              - filter: path_rewrite
                replace:
                  pattern: "^/v1/messages$"
                  replacement: "/v1/chat/completions"
                conditions:
                  - when:
                      path_prefix: "/v1/messages"

              - filter: router
                routes:
                  - path_prefix: "/"
                    cluster: chat-completions-backend

              # Inject the backend's own Bearer token after routing selects the
              # cluster; strip any client-supplied Authorization first.
              - filter: credential_injection
                clusters:
                  - name: chat-completions-backend
                    header: Authorization
                    env_var: VLLM_API_KEY
                    header_prefix: "Bearer "
                    strip_client_credential: true

              - filter: load_balancer
                clusters:
                  - name: chat-completions-backend
                    endpoints: ["127.0.0.1:8000"]
            on_result:
              - filter: anthropic_web_search
                key: action
                value: loop
                next: inference
              - default: true
                done: true

insecure_options:
  allow_private_endpoints: true # example proxies to a local vLLM backend
