# Anthropic Messages to Chat Completions (text-only selected backend)
#
# Fixture-only variant of `messages-to-openai.yaml` whose selected cluster is
# text-only. The cluster declares `application_provider: vllm`, which the
# translator does not list in `image_input_providers`, so a request carrying an
# Anthropic image block is rejected with a 400 `invalid_request_error` before
# any backend call. See `messages-to-openai.yaml` for the image-capable
# variant and `messages-to-openai-vllm.yaml` for the deployable text-only vLLM
# path.
#
# This config exists to back the `messages/image-text-only` inference fixture
# (`tests/integration/fixtures/inference/`). It intentionally omits the gateway
# authentication and credential-injection filters so the deterministic fixture
# runner can replay it without secrets.

listeners:
  - name: anthropic-gateway
    address: "127.0.0.1:8080"
    filter_chains: [anthropic-transform]

filter_chains:
  - name: anthropic-transform
    filters:
      - filter: anthropic_messages_request
        on_invalid: continue

      - filter: anthropic_messages_to_chat_completions
        max_body_bytes: 1048576
        image_input_providers:
          - openai

      - filter: anthropic_messages_to_chat_completions_stream
        max_partial_event_bytes: 10485760
        max_tool_blocks: 10000
        response_conditions:
          - when:
              headers:
                content-type: "text/event-stream"

      - filter: path_rewrite
        replace:
          pattern: "^/v1/messages$"
          replacement: "/v1/chat/completions"
        conditions:
          - when:
              path_prefix: "/v1/messages"

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: "chat-completions-backend"

      - filter: load_balancer
        clusters:
          - name: "chat-completions-backend"
            http:
              # Not listed in `image_input_providers`, so images fail closed.
              application_provider: vllm
            endpoints:
              - "127.0.0.1:8000"

insecure_options:
  allow_private_endpoints: true # fixture proxies to a local replay backend
