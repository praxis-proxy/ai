# AI Inference Model Routing: Trust an Existing Model Header
#
# Routes on a model header that a trusted hop in front of Praxis has
# already set, skipping the JSON body parse when the header is there.
# With `trust_existing_header: true`, the model_to_header filter keeps
# an incoming X-AI-Model header as is. A request without one still has
# the body's "model" field promoted into X-AI-Model, as usual.
#
# Security: this turns off the anti-spoofing strip for X-AI-Model, so
# whoever sends the header picks the backend, and the header is never
# compared with the body's "model". Only use it when every request
# reaches Praxis through a hop that sets or scrubs the header. The body
# is still buffered either way.
#
# Usage:
#   cargo run -p praxis-ai-proxy -- -c examples/configs/model-to-header-trust-existing.yaml
#
#   # Routed by the header to the granite cluster; the body is not parsed.
#   curl -X POST http://localhost:8080/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -H "X-AI-Model: granite-3.1-8b" \
#     -d '{"model": "granite-3.1-8b", "messages": []}'
#
#   # No header: the body's model is promoted and routes to mistral.
#   curl -X POST http://localhost:8080/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{"model": "mistral-7b-instruct", "messages": []}'

listeners:
  - name: inference-gateway
    address: "127.0.0.1:8080"
    filter_chains:
      - extract-model
      - routing

filter_chains:
  # Keep an X-AI-Model header the trusted hop already set; otherwise
  # promote the body's "model" field into it.
  - name: extract-model
    filters:
      - filter: model_to_header
        header: X-AI-Model
        trust_existing_header: true

  # Route based on X-AI-Model, wherever it came from.
  - name: routing
    filters:
      - filter: router
        routes:
          - path_prefix: "/"
            headers:
              x-ai-model: "mistral-7b-instruct"
            cluster: mistral
          - path_prefix: "/"
            headers:
              x-ai-model: "granite-3.1-8b"
            cluster: granite
          - path_prefix: "/"
            cluster: default
      - filter: load_balancer
        clusters:
          - name: mistral
            endpoints:
              - "127.0.0.1:3000"
          - name: granite
            endpoints:
              - "127.0.0.1:3001"
          - name: default
            endpoints:
              - "127.0.0.1:3002"

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
