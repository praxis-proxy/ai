# MCP Session Broker (current profile)
#
# MCP broker for stateful backends with runtime tool discovery. Clients
# initialize with Praxis and receive a gateway
# Mcp-Session-Id. On the first tools/call for each backend
# server, the broker runs the backend initialize and
# notifications/initialized handshake, then forwards the call
# to the server's cluster with the backend Mcp-Session-Id.
# Later calls reuse that session. A backend 404 drops the
# mapping, and the next call initializes a fresh backend
# session. DELETE on the gateway session terminates its
# backend sessions. The broker accepts only gateway session
# ids it issued and that were not deleted. A well-formed id it
# did not issue, or one that was deleted, gets 404 on every
# method: the client must send a new initialize without the
# old Mcp-Session-Id header. A malformed header gets 400.
# A DELETE that would end a session other credentials still
# use answers 409 and leaves it usable. Ownership follows the
# forwarded credential, so a client whose token was refreshed
# gets 409 until its older backend sessions expire.
#
# The weather server's tools come from its own tools/list
# (discover: true), listed inside the caller's backend session
# with the caller's forwarded credential and cached per caller.
# Its static entry overrides the listed description of
# get_weather. The calendar server keeps a static catalog.
#
# The handshake runs as a filtered subrequest through a
# generated outbound chain whose load_balancer references
# each server cluster by name, so declare the clusters in
# top-level `clusters:`. The main chain's load_balancer
# references the same declarations.
#
#   cargo run -p praxis-ai-proxy -- -c examples/configs/mcp-session-broker.yaml

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains: [main]

clusters:
  - name: weather-mcp
    endpoints:
      - "127.0.0.1:3001"
  - name: calendar-mcp
    endpoints:
      - "127.0.0.1:3002"

filter_chains:
  - name: main
    filters:
      - filter: mcp
        path: /mcp
        max_body_bytes: 65536
        backend_sessions:
          max_sessions: 4096
          idle_timeout_ms: 600000
          handshake_timeout_ms: 5000
          max_response_bytes: 1048576
          forward_headers: [authorization]
        discovery:
          max_entries: 4096
          max_age_ms: 300000
          idle_timeout_ms: 600000
          max_concurrency: 8
          max_tools: 512
        servers:
          - name: weather
            cluster: weather-mcp
            path: /mcp
            tool_prefix: "weather_"
            discover: true
            tool_policy: allow_all
            tools:
              - name: get_weather
                description: Get current weather
          - name: calendar
            cluster: calendar-mcp
            path: /mcp
            tool_prefix: "cal_"
            tools:
              - name: create_event
                description: Create a calendar event

      - filter: load_balancer
        clusters:
          - name: weather-mcp
          - name: calendar-mcp

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
