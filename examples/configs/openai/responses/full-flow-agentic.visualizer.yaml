pipeline:
  filters:
  - id: trace_context
    name: trace_context
    group: trace
    filter_type: trace_context
    phase: request-phase; establishes typed correlation BEFORE the IRR snapshots request extensions; no response phase
    config: {}
    promotes: establishes a typed TraceContext extension carried across every IRR iteration; child callouts retain this request/trace identity while Praxis core assigns a fresh span ID to each outbound hop
    scenarios:
      S1:
        state: active
        note: establishes TraceContext for the single inference round
      S2:
        state: active
        note: establishes TraceContext for the streaming round
      S3:
        state: active
        note: establishes TraceContext (independent of the store flag)
      S4:
        state: active
        note: establishes TraceContext for the multi-turn request
      S5:
        state: active
        note: TraceContext propagates into the file_search vector-store callout (fresh span per hop)
      S6:
        state: active
        note: TraceContext propagates into every MCP resolve/dispatch hop (fresh span each)
      S7:
        state: active
        note: TraceContext propagates into the Brave web_search callout (fresh span per hop)
      S8:
        state: active
        note: establishes TraceContext before the store answers the GET retrieve
      S9:
        state: active
        note: establishes TraceContext on the WS handshake before the direct-services branch
      S10:
        state: active
        note: establishes TraceContext before the route-miss
      S11:
        state: active
        note: establishes TraceContext before the dedicated-service direct-services branch
      S12:
        state: active
        note: establishes TraceContext before the direct-openai passthrough forward
      S13:
        state: active
        note: establishes TraceContext for the managed chat-completions round
  - id: state_owner
    name: state_owner
    group: identity
    filter_type: state_owner
    phase: request-phase header mapping only; no response phase
    config:
      mode: trusted_headers
      tenant.header: x-auth-tenant
      issuer.static: urn:example:gateway
      subject.header: x-auth-user
    promotes: normalized StateOwner extension (tenant/issuer/subject) carried across IRR iterations
    scenarios:
      S1:
        state: active
        note: maps x-auth-* ingress into owner context (no auth verification)
      S2:
        state: active
        note: same owner mapping for streaming create
      S3:
        state: active
        note: owner mapped even though store:false
      S4:
        state: active
        note: owner mapped for multi-turn create
      S5:
        state: active
        note: owner mapped; forwarded to file_search callout
      S6:
        state: active
        note: owner mapped; forwarded to MCP connector
      S7:
        state: active
        note: owner underpins per-user brave_search slot selection
      S8:
        state: active
        note: runs before store answers the GET retrieve
      S9:
        state: active
        note: owner mapped on WS handshake before the direct-services branch
      S10:
        state: active
        note: owner mapped before route-miss
      S11:
        state: active
        note: owner mapped before the dedicated-service direct-services branch
      S12:
        state: active
        note: owner mapped before the direct-openai forward
      S13:
        state: active
        note: owner mapped for the managed chat-completions round
  - id: callout_credentials
    name: callout_credentials
    group: identity
    filter_type: callout_credentials
    phase: 'request-phase security filter; captures typed credential slots AND the trusted-boundary MCP authorization assertion (unified in #1341); does not authenticate provenance and never parses the assertion'
    config:
      credentials:
      - slot: brave_search
        source_header: x-user-brave-key
      - slot: ogx_files
        source_header: x-user-ogx-key
      - slot: mcp_gateway
        source_header: x-user-mcp-key
      assertions:
      - slot: mcp_gateway
        source_header: x-mcp-authorized
    promotes: 'the single establishing filter for scoped secrets: captures per-user brave_search / ogx_files / mcp_gateway credential slots (from x-user-brave-key / x-user-ogx-key / x-user-mcp-key) and STRIPS those raw x-user-* ingress headers; unified in #1341 it ALSO captures the mcp_gateway authorization assertion — unconditionally deleting any client-supplied x-mcp-authorized then setting the verified, short-lived assertion. Each dispatcher selects only its slot; the assertion is forwarded unchanged ONLY to configured connector_id targets (the MCP Gateway makes the authorization decision). Formerly a separate callout_authorization filter.'
    scenarios:
      S1:
        state: active
        note: strips all x-user-* provider keys defensively (slots empty if absent); also strips client x-mcp-authorized and sets the verified assertion, consumed only by MCP filters
      S2:
        state: active
        note: strips all provider-key headers and strips + sets the MCP assertion; slots/assertion unused this scenario
      S3:
        state: active
        note: strips all provider-key headers and strips + sets the assertion; unused this scenario
      S4:
        state: active
        note: strips all provider-key headers and strips + sets the assertion; unused this scenario
      S5:
        state: active
        note: captures the ogx_files key later injected on the file_search callout; strips + sets the assertion (file_search does not consume it)
      S6:
        state: active
        note: captures the mcp_gateway key AND the mcp_gateway authorization assertion (x-mcp-authorized); both consumed by openai_mcp_tool_resolve + openai_mcp_dispatch
      S7:
        state: active
        note: captures the brave_search key required by openai_web_search; strips + sets the assertion (web_search does not consume it)
      S8:
        state: active
        note: strips all provider-key headers and client x-mcp-authorized on GET before the store answers
      S9:
        state: active
        note: strips all provider-key headers and sets the assertion on the WS handshake
      S10:
        state: active
        note: strips all provider-key headers and sets the assertion before the route-miss
      S11:
        state: active
        note: strips all provider-key headers and sets the assertion before the dedicated-service direct-services branch
      S12:
        state: active
        note: strips all provider-key headers and sets the assertion before the direct-openai forward (unused this scenario)
      S13:
        state: active
        note: strips all provider-key headers and sets the assertion for the managed round (unused this scenario)
  - id: project_state_owner_headers_preirr
    name: project_state_owner_headers
    group: identity
    filter_type: project_state_owner_headers
    phase: request-phase header projection; no response phase
    config:
      tenant_header: x-tenant-id
      subject_header: x-user-id
    promotes: projects owner as x-tenant-id/x-user-id for OGX and allowlisted callouts; strips raw x-auth-* ingress
    scenarios:
      S1:
        state: active
        note: projects x-tenant-id/x-user-id, strips raw ingress
      S2:
        state: active
        note: same projection for streaming
      S3:
        state: active
        note: projection regardless of store flag
      S4:
        state: active
        note: projection for multi-turn
      S5:
        state: active
        note: projected ids forwarded to file_search callout
      S6:
        state: active
        note: projected ids forwarded to MCP connector
      S7:
        state: active
        note: projection precedes web_search
      S8:
        state: active
        note: projects before store answers GET
      S9:
        state: active
        note: projects before the WS direct-services branch
      S10:
        state: active
        note: projects before route-miss
      S11:
        state: active
        note: projects before the dedicated-service direct-services branch
      S12:
        state: active
        note: projects before the direct-openai forward
      S13:
        state: active
        note: projects before the managed chat-completions round
  - id: openai_operation
    name: openai_operation
    group: classification
    filter_type: openai_operation
    phase: request-phase classification; no response phase
    config: {}
    promotes: classifies the request head (method + path + transport) against the registered OpenAI operation registries (Conversations, Chat Completions, Responses); on a match publishes the typed operation into request extensions, sets x-praxis-ai-application-protocol + x-praxis-ai-operation, and records application_protocol/operation_id filter results consumed by on_result branches and openai_conversations; on no match strips those headers and continues. Must precede openai_conversations.
    scenarios:
      S1:
        state: active
        note: POST /v1/responses -> application_protocol openai_responses (create)
      S2:
        state: active
        note: streaming create, same head -> openai_responses
      S3:
        state: active
        note: store:false create, same head -> openai_responses
      S4:
        state: active
        note: previous_response_id create (POST /v1/responses) -> openai_responses
      S5:
        state: active
        note: file_search create -> openai_responses
      S6:
        state: active
        note: MCP create -> openai_responses
      S7:
        state: active
        note: web_search create -> openai_responses
      S8:
        state: active
        note: GET /v1/responses/{id} -> openai_responses (retrieve)
      S9:
        state: active
        note: 'GET /v1/responses + Upgrade: websocket -> openai_responses (WebSocket handshake)'
      S10:
        state: active
        note: head-based match -> openai_responses create; the Chat/unclassified body is ignored here and discriminated later by openai_responses_format
      S11:
        state: passthrough
        note: /v1/prompts|/v1/embeddings|/v1/files|/v1/vector_stores are not in any operation registry; strips routing headers
      S12:
        state: active
        note: POST /v1/responses -> openai_responses (create); gpt-5 head is classified here, provider chosen at the router
      S13:
        state: active
        note: POST /v1/responses -> openai_responses (create); vllm-chat head is classified here, provider chosen at the router
  - id: openai_responses_format
    name: openai_responses_format
    group: classification
    filter_type: openai_responses_format
    phase: request-phase classifier; promotes internal x-praxis-* routing headers
    config:
      on_invalid: continue
      headers.format: x-praxis-ai-format
      headers.model: x-praxis-ai-model
      headers.stream: x-praxis-ai-stream
      headers.mode: x-praxis-responses-mode
    promotes: x-praxis-ai-format, x-praxis-ai-model, x-praxis-ai-stream, x-praxis-responses-mode; the model header is overwritten from the parsed body so clients cannot spoof the router's model policy
    scenarios:
      S1:
        state: active
        note: classifies openai_responses; sets format/model/mode, stream=false
      S2:
        state: active
        note: classifies openai_responses; promotes x-praxis-ai-stream=true
      S3:
        state: active
        note: classifies openai_responses (store flag not classification input)
      S4:
        state: active
        note: classifies openai_responses create
      S5:
        state: active
        note: classifies openai_responses (tools present)
      S6:
        state: active
        note: classifies openai_responses (mcp tools)
      S7:
        state: active
        note: classifies openai_responses
      S8:
        state: active
        note: classifies GET as non-create; header drives later gating
      S9:
        state: active
        note: classifies GET/WS as non-create (no openai_responses create marker)
      S10:
        state: active
        note: classifies as chat/anthropic/unclassified -> not openai_responses, on_invalid:continue avoids early reject
      S11:
        state: passthrough
        note: path not /v1/responses; no Responses classification
      S12:
        state: active
        note: classifies openai_responses; model gpt-5 drives the direct-openai (application_provider=openai) route
      S13:
        state: active
        note: classifies openai_responses; model vllm-chat drives the chat-completions (managed) route
  - id: router
    name: router
    group: routing
    filter_type: router
    phase: request-phase binding router; freezes ONE logical cluster plus its application_provider/application_protocol as bound_upstream metadata; exactly one top-level router per binding pipeline
    config:
      routes:
      - 'path_prefix /v1/prompts -> prompts-api'
      - 'path_prefix /v1/embeddings -> embeddings-api'
      - 'path_prefix /v1/files -> files-api'
      - 'path_prefix /v1/conversations -> inference-backend'
      - 'path /v1/responses + upgrade:websocket -> responses-websocket-backend'
      - 'path /v1/responses + x-praxis-ai-format:openai_responses + x-praxis-ai-model:gpt-5 -> openai-responses-backend'
      - 'path /v1/responses + x-praxis-ai-format:openai_responses + x-praxis-ai-model:vllm-chat -> chat-completions-backend'
      - 'path_prefix /v1/responses + x-praxis-ai-format:openai_responses -> inference-backend'
      - 'path_prefix /v1/vector_stores -> vector-stores-backend'
    promotes: binds exactly one logical cluster per request and freezes its application_provider/application_protocol as bound_upstream metadata read by the two terminal branches and the IRR-step load balancer; the classifier-owned x-praxis-ai-model header cannot be spoofed; model gpt-5 -> openai-responses-backend (provider openai), vllm-chat -> chat-completions-backend (managed), any other Responses model -> inference-backend (managed native); a request matching no route is a route-miss (bare 404)
    scenarios:
      S1:
        state: active
        note: binds inference-backend (managed native Responses) via the /v1/responses format route
      S2:
        state: active
        note: binds inference-backend via the /v1/responses format route
      S3:
        state: active
        note: binds inference-backend via the /v1/responses format route
      S4:
        state: active
        note: binds inference-backend via the /v1/responses format route
      S5:
        state: active
        note: binds inference-backend via the /v1/responses format route
      S6:
        state: active
        note: binds inference-backend via the /v1/responses format route
      S7:
        state: active
        note: binds inference-backend via the /v1/responses format route
      S8:
        state: active
        note: binds inference-backend via the /v1/responses prefix route so the GET retrieve reaches the local store
      S9:
        state: active
        note: 'binds responses-websocket-backend (application_provider=direct) via the /v1/responses upgrade:websocket route'
      S10:
        state: active
        note: no route matches (format is not openai_responses, no upgrade header) -> route-miss (bare 404)
      S11:
        state: active
        note: binds a dedicated-service cluster by path_prefix (application_provider=direct)
      S12:
        state: active
        note: binds openai-responses-backend (application_provider=openai) via the gpt-5 route
      S13:
        state: active
        note: binds chat-completions-backend (managed vllm) via the vllm-chat route
  - id: direct_openai_branch
    name: headers (direct-openai branch)
    group: routing
    filter_type: headers
    phase: request-phase branch carrier; when bound_upstream.application_provider=openai it takes the direct-openai terminal branch and rejoins at terminal; header set is a no-op anchor only
    config:
      conditions:
      - 'when bound_upstream.application_provider: openai'
      branch_chains:
      - name: direct-openai
        rejoin: terminal
        chain: direct-openai-dispatch (load_balancer cluster_source:bound_upstream -> openai-responses-backend 127.0.0.1:3001)
    promotes: terminal branch for the direct-OpenAI path; when the router bound a cluster whose application_provider is openai, forwards the ORIGINAL Responses request unchanged to the OpenAI-compatible provider and stops the parent chain, so the managed body filters and the IRR never run
    scenarios:
      S1:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S2:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S3:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S4:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S5:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S6:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S7:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S8:
        state: inert
        note: GET bound inference-backend (managed); branch not taken
      S9:
        state: inert
        note: WS bound responses-websocket-backend (direct), not openai; branch not taken
      S10:
        state: skipped
        note: router route-miss already returned 404
      S11:
        state: inert
        note: dedicated-service bound provider=direct, not openai; branch not taken
      S12:
        state: active
        note: bound provider=openai -> takes the direct-openai terminal branch; forwards the original request to openai-responses-backend 3001 and stops the chain (no managed body work, no IRR)
      S13:
        state: inert
        note: bound provider=vllm (managed), not openai; branch not taken, chain continues to the managed body filters
  - id: direct_services_branch
    name: headers (direct-services branch)
    group: routing
    filter_type: headers
    phase: request-phase branch carrier; when bound_upstream.application_provider=direct it takes the direct-services terminal branch and rejoins at terminal
    config:
      conditions:
      - 'when bound_upstream.application_provider: direct'
      branch_chains:
      - name: direct-services
        rejoin: terminal
        chain: direct-services-dispatch (load_balancer cluster_source:bound_upstream -> prompts-api 9998 / embeddings-api 9997 / files-api 9999 / responses-websocket-backend 3001 / vector-stores-backend 3002)
    promotes: terminal branch for dedicated services; when the router bound a cluster whose application_provider is direct (/v1/prompts, /v1/embeddings, /v1/files, /v1/vector_stores, and the /v1/responses WebSocket upgrade), forwards straight upstream and rejoins terminal so the IRR never runs
    scenarios:
      S1:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S2:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S3:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S4:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S5:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S6:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S7:
        state: inert
        note: bound provider is managed native; branch condition unmet, chain continues
      S8:
        state: inert
        note: GET bound inference-backend (managed); branch not taken (store answers later)
      S9:
        state: active
        note: bound responses-websocket-backend (direct) -> takes the direct-services terminal branch; forwards the WS upgrade to 3001
      S10:
        state: skipped
        note: router route-miss already returned 404
      S11:
        state: active
        note: bound dedicated-service cluster (direct) -> takes the direct-services terminal branch; forwards to the path_prefix backend
      S12:
        state: skipped
        note: direct-openai branch already rejoined terminal at the prior filter
      S13:
        state: inert
        note: bound provider=vllm (managed), not direct; branch not taken
  - id: openai_responses_validate
    name: openai_responses_validate
    group: classification
    filter_type: openai_responses_validate
    phase: request-phase; JSON syntax + ID generation + managed-provider background/prompt policy; gated unless bound_upstream.application_provider=openai
    config:
      conditions:
      - 'unless bound_upstream.application_provider: openai'
    promotes: validates JSON syntax; generates response and conversation IDs; writes responses.* metadata (provider-owned param combos pass through); suppressed on the direct-openai path
    scenarios:
      S1:
        state: active
        note: validates syntax, generates response id
      S2:
        state: active
        note: validates + generates ids for streaming create
      S3:
        state: active
        note: validates; ids generated even if not persisted
      S4:
        state: active
        note: validates multi-turn create
      S5:
        state: active
        note: validates create with file_search tools
      S6:
        state: active
        note: validates create with mcp tools
      S7:
        state: active
        note: validates create
      S8:
        state: passthrough
        note: GET has no body to validate
      S9:
        state: skipped
        note: WS took the direct-services terminal branch before the body filters
      S10:
        state: skipped
        note: router route-miss (404) before the body filters
      S11:
        state: skipped
        note: dedicated services took the direct-services terminal branch before the body filters
      S12:
        state: skipped
        note: direct-openai terminal branch ran before the body filters
      S13:
        state: active
        note: validates the managed vllm-chat create; generates ids
  - id: openai_tool_parse
    name: openai_tool_parse
    group: classification
    filter_type: openai_tool_parse
    phase: request-phase; parses tools/tool_choice, does NOT mutate body; gated unless bound_upstream.application_provider=openai
    config:
      conditions:
      - 'unless bound_upstream.application_provider: openai'
    promotes: has_tools, has_web_search, tool_choice, function_count (summary facts to metadata/results)
    scenarios:
      S1:
        state: passthrough
        note: no tools; has_tools=false
      S2:
        state: passthrough
        note: no tools
      S3:
        state: passthrough
        note: no tools
      S4:
        state: passthrough
        note: no tools
      S5:
        state: active
        note: parses file_search tool; has_tools=true
      S6:
        state: active
        note: parses mcp tool; has_tools=true
      S7:
        state: active
        note: parses tools; may set has_web_search
      S8:
        state: passthrough
        note: GET retrieve
      S9:
        state: skipped
        note: direct-services terminal branch ran first
      S10:
        state: skipped
        note: router route-miss before this filter
      S11:
        state: skipped
        note: direct-services terminal branch ran first
      S12:
        state: skipped
        note: direct-openai terminal branch ran first
      S13:
        state: passthrough
        note: no tools; has_tools=false
  - id: openai_response_store
    name: openai_response_store
    group: store
    filter_type: openai_response_store
    phase: request-phase registers backend + serves GET retrieve (terminal); response-phase persists AFTER IRR composes terminal (reverse order); gated unless bound_upstream.application_provider=openai
    config:
      backend: sqlite
      database_url: sqlite://responses.db?mode=rwc
      responses_table: openai_responses
      conversations_table: openai_conversations
      conditions:
      - 'unless bound_upstream.application_provider: openai'
    promotes: registers store backend for rehydrate/compact; persists ResponsesState.response_object on response path; answers GET /v1/responses/{id} pre-IRR
    scenarios:
      S1:
        state: active
        note: persists buffered response on reverse path (store default true)
      S2:
        state: active
        note: persists response_object populated by openai_stream_events inside IRR
      S3:
        state: inert
        note: backend registered but store:false -> no persistence
      S4:
        state: active
        note: persists; rehydrate also reads prior response from this store
      S5:
        state: active
        note: persists final composed response after file_search loop
      S6:
        state: active
        note: persists final response after MCP loop
      S7:
        state: active
        note: persists final response after web_search loop
      S8:
        state: active
        note: SERVES GET as terminal response pre-IRR and short-circuits pipeline
      S9:
        state: skipped
        note: direct-services terminal branch ran first
      S10:
        state: skipped
        note: router route-miss before this filter
      S11:
        state: skipped
        note: direct-services terminal branch ran first
      S12:
        state: skipped
        note: direct-openai terminal branch ran first
      S13:
        state: inert
        note: backend registered but store:false -> no persistence
  - id: openai_conversations
    name: openai_conversations
    group: conversations
    filter_type: openai_conversations
    phase: request-phase (CRUD + has_conversation); response-phase appends items before Store on completed JSON or SSE; gated unless bound_upstream.application_provider=openai
    config:
      backend: sqlite
      database_url: sqlite://responses.db?mode=rwc
      conversations_table: openai_conversations
      items_table: openai_conversation_items
      conditions:
      - 'unless bound_upstream.application_provider: openai'
    promotes: sets has_conversation when Responses request carries a conversation field; on response path appends input+output items back to the conversation
    scenarios:
      S1:
        state: passthrough
        note: no conversation field; would activate on /v1/conversations CRUD or conversation-bearing create
      S2:
        state: passthrough
        note: no conversation field
      S3:
        state: passthrough
        note: no conversation field
      S4:
        state: passthrough
        note: prev_response_id path, not a conversation field
      S5:
        state: passthrough
        note: no conversation field
      S6:
        state: passthrough
        note: no conversation field
      S7:
        state: passthrough
        note: no conversation field
      S8:
        state: passthrough
        note: GET retrieve, not a conversations op
      S9:
        state: skipped
        note: direct-services terminal branch ran first
      S10:
        state: skipped
        note: router route-miss before this filter
      S11:
        state: skipped
        note: direct-services terminal branch ran first
      S12:
        state: skipped
        note: direct-openai terminal branch ran first
      S13:
        state: passthrough
        note: no conversation field
  - id: openai_responses_rehydrate
    name: openai_responses_rehydrate
    group: context
    filter_type: openai_responses_rehydrate
    phase: request-phase; loads and prepends prior history; gated unless bound_upstream.application_provider=openai
    config:
      conditions:
      - 'unless bound_upstream.application_provider: openai'
    promotes: loads context from previous_response_id or conversation, prepends message history; previous_response_id takes precedence when both present
    scenarios:
      S1:
