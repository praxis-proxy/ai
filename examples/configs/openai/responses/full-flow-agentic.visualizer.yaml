timeline:
  S1:
    summary: 'A no-tools create crosses the wire in exactly one inference round: client POST /v1/responses {model,input} -> IRR forwards the create to inference-backend 127.0.0.1:3001 -> the model returns a final assistant message with NO tool-call items -> the gateway ships that Responses object back byte-for-byte. The IRR transition is owned solely by openai_agentic_loop (full-flow-agentic.yaml:608-613): it parses each model response and publishes a single continuation signal action=loop|done, routed at :646-658 (`key: action, value: loop, next: inference` re-enters inference; the `default: true / done: true` branch finalizes). A plain assistant message has no hosted-tool items, so the loop does NOT publish action=loop and the default done branch finalizes after the first pass (mechanic mirrored by the injected on_result at openai_agentic_loop.rs:6919-6923, whose comment states ''IRR terminates after the first pass via the default `done: true` branch''). This is why tool scenarios need extra rounds and this one does not: hosted-tool items make the loop publish action=loop -> next: inference, adding a re-entry round after the callout (file_search two-round trip full_flow_agentic.rs:1189-1305 with one vector-store callout at :1283; MCP two-round trip openai_agentic_loop.rs:250-428 with model_reqs.len()==2 at :366), whereas a plain message — or even a client-owned function_call — returns after a single model request (openai_agentic_loop.rs:60-61 and :139-143). NOTE: the S1 passthrough test itself only asserts status + byte-equal body; forwarded-body and header-projection details are grounded in sibling tests, cited per step.'
    rounds: single round · no tools
    steps:
    - n: 1
      round: round 1
      from: client
      to: gateway
      kind: request
      title: Client create POST (no tools)
      channel: POST http://{proxy}/v1/responses
      note: 'Exact request body at full_flow_agentic.rs:1317. json_post() wraps it with the trusted ingress identity headers x-auth-tenant: integration-tenant, x-auth-user: integration-user, x-user-ogx-key: Bearer integration-ogx-key via the authenticated_request helper (constants TEST_TENANT/TEST_SUBJECT/TEST_OGX_CREDENTIAL at :58-60). No `store` field is sent and the test asserts nothing about persistence — this is a plain create, not verified as stateful.'
