  scenarios:
  - id: S1
    label: Stateful create
    request: POST /v1/responses {model,input} (store defaults true)
    entersIRR: true
    loopRounds: 1
  - id: S2
    label: Streaming create
    request: POST /v1/responses {model,input,stream:true}
    entersIRR: true
    loopRounds: 1
  - id: S3
    label: Stateless create
    request: POST /v1/responses {model,input,store:false}
    entersIRR: true
    loopRounds: 1
  - id: S4
    label: Multi-turn
    request: POST /v1/responses {input,previous_response_id}
    entersIRR: true
    loopRounds: 1
  - id: S5
    label: File search
    request: POST /v1/responses tools:[{type:file_search,vector_store_ids}]
    entersIRR: true
    loopRounds: 2+ (model emits file_search_call, callout via vector store 3002, re-enter, finalize)
  - id: S6
    label: MCP loop
    request: POST /v1/responses tools:[{type:mcp,server_label,server_url,allowed_tools,require_approval:never}]
    entersIRR: true
    loopRounds: 2+ (mcp_tool_resolve then model emits MCP call, dispatch via 8001, finalize)
  - id: S7
    label: Web search
    request: POST /v1/responses; model emits web_search_call (per-user brave_search key required)
    entersIRR: true
    loopRounds: 2+ (web_search via Brave, re-enter, finalize)
  - id: S8
    label: GET retrieve
    request: GET /v1/responses/{id}
    entersIRR: false
    loopRounds: 0
  - id: S9
    label: WebSocket
    request: 'GET /v1/responses with Upgrade: websocket'
    entersIRR: false
    loopRounds: 0
  - id: S10
    label: Non-Responses body on /v1/responses
    request: POST /v1/responses with Chat Completions / Anthropic / unclassified body
    entersIRR: false
    loopRounds: 0
  - id: S11
    label: Dedicated services
    request: POST /v1/prompts | /v1/embeddings | /v1/files | /v1/vector_stores
    entersIRR: false
    loopRounds: 0
  - id: S12
    label: Direct OpenAI passthrough
    request: 'POST /v1/responses {model:gpt-5,...} (application_provider=openai)'
    entersIRR: false
    loopRounds: 0
  - id: S13
    label: Chat Completions backend
    request: 'POST /v1/responses {model:vllm-chat,store:false} (managed vllm, openai_chat_completions)'
    entersIRR: true
    loopRounds: 1
  clusters:
  - name: inference-backend
    endpoints:
    - 127.0.0.1:3001
    definedIn: router route (path_prefix /v1/responses) + IRR-step load_balancer (cluster_source:bound_upstream)
    routedBy: router binds managed native Responses for gpt-4.1/default models; the IRR inference step resolves it on 3001
    note: application_provider vllm; the IRR-step load_balancer publishes application_protocol openai_responses so openai_responses_proxy fires
  - name: openai-responses-backend
    endpoints:
    - 127.0.0.1:3001
    definedIn: router route (model gpt-5) + direct-openai-dispatch load_balancer (cluster_source:bound_upstream)
    routedBy: router binds this when x-praxis-ai-model is gpt-5; the direct-openai terminal branch forwards the original request unchanged
    note: application_provider openai -> the managed body filters and the IRR are skipped; the provider owns the response
  - name: chat-completions-backend
    endpoints:
    - 127.0.0.1:3001
    definedIn: router route (model vllm-chat) + IRR-step load_balancer (cluster_source:bound_upstream)
    routedBy: router binds this when x-praxis-ai-model is vllm-chat; the IRR inference step resolves it on 3001
    note: application_provider vllm, application_protocol openai_chat_completions -> responses_to_chat_completions + path_rewrite fire instead of openai_responses_proxy
  - name: prompts-api
    endpoints:
    - 127.0.0.1:9998
    definedIn: direct-services-dispatch load_balancer
    routedBy: router path_prefix /v1/prompts (application_provider direct)
  - name: embeddings-api
    endpoints:
    - 127.0.0.1:9997
    definedIn: direct-services-dispatch load_balancer
    routedBy: router path_prefix /v1/embeddings (application_provider direct)
  - name: files-api
    endpoints:
    - 127.0.0.1:9999
    definedIn: direct-services-dispatch load_balancer
    routedBy: router path_prefix /v1/files (application_provider direct)
  - name: vector-stores-backend
    endpoints:
    - 127.0.0.1:3002
    definedIn: direct-services-dispatch load_balancer
    routedBy: router path_prefix /v1/vector_stores (application_provider direct)
  - name: responses-websocket-backend
    endpoints:
    - 127.0.0.1:3001
    definedIn: direct-services-dispatch load_balancer
    routedBy: 'router path /v1/responses + upgrade:websocket (application_provider direct)'
  externalServices:
  - name: MCP server
    endpoint: http://127.0.0.1:8001/mcp
    connectorId: trusted-mcp
    usedBy:
    - openai_mcp_tool_resolve (tools/list)
    - openai_mcp_dispatch (tool calls)
    credential: user_credential mcp_gateway (x-user-mcp-key) + opaque authorization_assertion mcp_gateway (x-mcp-authorized); both forwarded ONLY to connector_id trusted-mcp, never a client-supplied server_url
  - name: Files API
    endpoint: http://127.0.0.1:9999
    usedBy:
    - openai_file_resolve callout (files_api_url)
    - files-api cluster (/v1/files direct-services branch)
    credential: user_credential ogx_files (per-user slot from x-user-ogx-key) injected on file_id callouts; file_url downloads use the separate credential-free resolver
  - name: Vector store
    endpoint: http://127.0.0.1:3002
    usedBy:
    - openai_file_search_callout (vector_store_url)
    - vector-stores-backend cluster (/v1/vector_stores direct-services branch)
    credential: user_credential ogx_files (per-user slot from x-user-ogx-key) injected on file_search callouts
  - name: Brave Search
    endpoint: provider:brave (external Brave API)
    usedBy:
    - openai_web_search
    credential: user_credential brave_search (per-user slot from x-user-brave-key); WEB_SEARCH_API_KEY still required by provider config; missing per-user slot fails closed (no shared-key fallback)
  knobs:
    max_infer_iters: 7
    max_iterations: 8
    max_iterations_constraint: 'must be >= max_infer_iters + 1 (7+1=8): initial inference plus allowed tool-backed continuations'
    timeout_ms: 360000
    step_timeout_ms: 300000
    max_response_bytes: 67108864
    max_stream_response_bytes: 67108864
    max_state_bytes: 136314880
    file_search.timeout_ms: 5000
    file_search.max_response_bytes: 10485760
    file_search.max_total_response_bytes: 67108864
    file_search.max_state_bytes: 136314880
    file_search.on_failure: closed
    mcp_dispatch.max_calls_per_round: 32
    mcp_dispatch.max_parallel_calls: 8
    mcp_dispatch.max_result_bytes: 1048576
    mcp_dispatch.max_total_result_bytes: 8388608
    web_search.max_calls_per_round: 32
    file_resolve.timeout_ms: 10000
    file_resolve.on_missing: reject
    insecure_options.allow_private_endpoints: true
    insecure_options.allow_private_upstreams: true
scen_meta:
  overview:
    narr: '<b>Overview.</b> All filters shown at rest. trace_context opens the spine and callout_credentials anchors the identity band — since #1341 it is the single establishing filter for scoped secrets AND the MCP authorization assertion. Select a scenario chip to trace the exact path — active filters glow, and skipped / inert / passthrough filters are dimmed and labeled with their state.'
    clusters: []
    services: []
  S1:
    narr: <b>Stateful create</b> (store defaults true) runs the full pre-IRR spine, enters the IRR for one inference round, then persists the composed response on the reverse path.
    clusters:
    - inference-backend
    services: []
  S2:
    narr: <b>Streaming create.</b> openai_stream_events composes one logical SSE lifecycle inside the IRR and populates the response_object that openai_response_store persists on the reverse path.
    clusters:
    - inference-backend
    services: []
  S3:
    narr: <b>Stateless create</b> (store:false) runs identically, but the store is inert on the reverse path — nothing is persisted.
    clusters:
    - inference-backend
    services: []
  S4:
    narr: <b>Multi-turn.</b> openai_responses_rehydrate loads the prior response via previous_response_id and prepends its history, then one inference round runs.
    clusters:
    - inference-backend
    services: []
  S5:
    narr: <b>File search loop.</b> The model emits file_search_call; openai_file_search_callout queries vector store 3002 at re-entry carrying the caller-scoped ogx_files credential and the request's trace identity; the loop owner finalizes with done.
    clusters:
    - inference-backend
    - vector-stores-backend
    services:
    - Vector store
  S6:
    narr: <b>MCP loop.</b> openai_mcp_tool_resolve lists tools from connector trusted-mcp; the model emits an MCP call; openai_mcp_dispatch executes it against 127.0.0.1:8001. Both forward the mcp_gateway credential plus the opaque authorization assertion, and each hop gets a fresh trace span.
    clusters:
    - inference-backend
    services:
    - MCP server
  S7:
    narr: <b>Web search loop.</b> The model emits web_search_call; openai_web_search executes it via Brave using the per-user brave_search slot (fails closed if the slot is missing), inheriting the request's trace identity.
    clusters:
    - inference-backend
    services:
    - Brave Search
  S8:
    narr: <b>GET retrieve.</b> openai_response_store answers PRE-IRR as a terminal response and short-circuits the pipeline — rehydrate, the callouts, static_response, and the IRR never run.
    clusters: []
    services: []
  S9:
    narr: <b>WebSocket.</b> A GET /v1/responses handshake with Upgrade:websocket is bound by the router to responses-websocket-backend; the direct-services terminal branch forwards it to 3001, so the managed body filters and the IRR never run.
    clusters:
    - responses-websocket-backend
    services: []
  S10:
    narr: <b>Non-Responses body.</b> A Chat/Anthropic/unclassified body posted to /v1/responses is not classified openai_responses, so no router route matches — a route-miss returns a bare 404 before any body filter runs.
    clusters: []
    services: []
  S11:
    narr: <b>Dedicated services.</b> /v1/prompts | /v1/embeddings | /v1/files | /v1/vector_stores are bound by the router to their path_prefix cluster (application_provider direct); the direct-services terminal branch forwards straight upstream and the IRR never runs.
    clusters:
    - prompts-api
    - embeddings-api
    - files-api
    - vector-stores-backend
    services:
    - Files API
    - Vector store
  S12:
    narr: <b>Direct OpenAI passthrough.</b> A create with model gpt-5 is bound by the router to openai-responses-backend (application_provider openai); the direct-openai terminal branch forwards the ORIGINAL Responses request unchanged to 3001. The managed body filters and the IRR are skipped — the provider owns the response.
    clusters:
    - openai-responses-backend
    services: []
  S13:
    narr: <b>Chat Completions backend.</b> A create with model vllm-chat is bound by the router to chat-completions-backend (managed). The IRR runs one round; the IRR-step load_balancer selects openai_chat_completions, so responses_to_chat_completions translates the request to Chat Completions (path_rewrite retargets /v1/chat/completions) and translates the Chat response back into a Responses resource.
    clusters:
    - chat-completions-backend
    services: []
