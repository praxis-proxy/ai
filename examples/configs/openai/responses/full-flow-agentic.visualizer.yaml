      replace.pattern: ^/v1/responses/?$
      replace.replacement: /v1/chat/completions
      conditions:
      - 'when selected_upstream.application_protocol: openai_chat_completions + path_prefix /v1/responses + methods [POST]'
    promotes: the translator leaves the request URI unchanged, so this rewrites POST /v1/responses -> /v1/chat/completions for the Chat backend; the identical protocol gate plus the create verb/path guards ensure only translated create requests are rewritten
    scenarios:
