# Responses to Chat Completions Conformance
#
# Minimal Responses-to-Chat-Completions translation chain used by the
# external OpenResponses conformance suite to validate the translator in
# isolation. This chain intentionally omits the response store, rehydrate,
# and stream-events filters: the suite exercises only stateless Responses
# requests (input arrays, no previous_response_id), so no persistence layer
# is required to translate them.
#
# Pipeline:
#   1. openai_responses_format classifies the client request.
#   2. openai_responses_validate performs the canonical JSON parse.
#   3. responses_to_chat_completions converts the request to Chat
#      Completions, converts finite JSON responses back to a Responses
#      resource, and translates streaming Chat Completions SSE into
#      Responses SSE incrementally.
#   4. path_rewrite changes the upstream endpoint to /v1/chat/completions.
#   5. router and load_balancer forward to a Chat-Completions-only backend.
#
# Backend endpoints: 127.0.0.1:3001 (Chat Completions).

listeners:
  - name: responses-chat-conformance-gateway
    address: "127.0.0.1:8080"
    filter_chains: [responses-chat-conformance]

filter_chains:
  - name: responses-chat-conformance
    filters:
      - filter: openai_responses_format
        on_invalid: reject
        headers:
          format: x-praxis-ai-format
          model: x-praxis-ai-model
          stream: x-praxis-ai-stream

      - filter: openai_responses_validate

      - filter: responses_to_chat_completions
        max_rewritten_body_bytes: 33554432
        max_emitted_sse_frame_bytes: 50331648
        max_stream_events: 100000
        stream_timeout_secs: 300

      - filter: path_rewrite
        replace:
          pattern: "^/v1/responses/?$"
          replacement: "/v1/chat/completions"
        conditions:
          - when:
              path_prefix: "/v1/responses"
              methods: [POST]

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: "chat-completions-backend"

      - filter: load_balancer
        clusters:
          - name: "chat-completions-backend"
            endpoints:
              - "127.0.0.1:3001"

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
