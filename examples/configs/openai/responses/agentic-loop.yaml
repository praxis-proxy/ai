# Agentic Loop Controller
#
# Demonstrates the agentic_loop filter that manages the inference
# loop lifecycle for the Responses API. The filter observes whether
# tool calls are present in the response and signals whether to
# loop back for another inference round or exit to the client.
#
# Tool call classification and execution are NOT handled here —
# those are the responsibility of tool_parse and sub-filters
# routed via branch chains.
#
# Pipeline ordering:
#   1. openai_responses_format — classifies body, promotes metadata
#   2. openai_responses_validate — validates parameters, generates IDs
#   3. openai_response_store — registers the store backend
#   4. openai_responses_rehydrate — loads previous_response_id context
#      and creates ResponsesState (required by agentic_loop)
#   5. responses_proxy — rebuilds outbound request from ResponsesState
#   6. agentic_loop — checks exit conditions, sets loop control signal
#
# Loop control is via filter_results + branch chain re-entrance:
#   agentic_loop.action = "loop"  — branch re-enters at responses_proxy
#   agentic_loop.action = "done"  — exit the loop
#
# The branch chain on agentic_loop uses the praxis-core ReEnter
# rejoin mode (see examples/configs/branching/reentrance.yaml in
# praxis-core). max_iterations on the branch chain provides an
# infrastructure-level safety cap; max_infer_iters on the filter
# provides application-level semantics (marking the response as
# incomplete when the iteration limit is reached).
#
# Config knobs:
#   max_infer_iters: caps total inference loop iterations (default 10)
#
# Example requests:
#
#   # First turn (stored, agentic_loop passes through)
#   curl -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -d '{"model":"gpt-4.1","input":"Hello"}'
#
#   # Multi-turn with agentic_loop active
#   curl -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -d '{
#       "model": "gpt-4.1",
#       "input": "What is the weather in SF?",
#       "previous_response_id": "resp_abc",
#       "tools": [{"type": "function", "name": "get_weather",
#                  "parameters": {"type":"object","properties":
#                  {"location":{"type":"string"}}}}]
#     }'
#
# Build:
#   cargo build -p praxis-ai-proxy

listeners:
  - name: ai-gateway
    address: "127.0.0.1:8080"
    filter_chains: [agentic-pipeline]

filter_chains:
  - name: agentic-pipeline
    filters:
      - filter: openai_responses_format
        on_invalid: reject
        headers:
          format: x-praxis-ai-format
          model: x-praxis-ai-model
          stream: x-praxis-ai-stream

      - filter: openai_responses_validate

      - filter: openai_response_store
        backend: sqlite
        database_url: "sqlite://responses.db?mode=rwc"
        responses_table: openai_responses
        conversations_table: openai_conversations

      - filter: openai_responses_rehydrate

      - filter: openai_responses_proxy
        name: inference

      - filter: agentic_loop
        max_infer_iters: 10
        branch_chains:
          - name: tool-loop
            on_result:
              filter: agentic_loop
              key: action
              result: loop
            rejoin: inference
            max_iterations: 15
            chains:
              - name: tool-execution
                filters:
                  - filter: openai_web_search

      - filter: router
        routes:
          - path: "/v1/responses"
            headers:
              x-praxis-ai-format: "openai_responses"
            cluster: "inference-backend"

      - filter: load_balancer
        clusters:
          - name: "inference-backend"
            endpoints:
              - "127.0.0.1:3001"
