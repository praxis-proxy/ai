# Responses API Full Flow — Streaming Persistence Gateway
#
# Combines conversations, format classification, request validation,
# file resolution, streaming accumulation, and backend routing into a
# single pipeline. This is the unified config that operators would
# deploy for a Responses API gateway that must persist BOTH buffered and
# streaming (`stream: true`) responses:
#
#   1. openai_conversations handles CRUD for the Conversations API
#      (/v1/conversations) and sets has_conversation metadata when
#      a Responses request carries a conversation field. On the
#      response path it appends input+output items back to the
#      conversation after a successful non-streaming response.
#
#   2. openai_format classifies the request and promotes
#      format, model, stream, and mode to internal routing headers.
#      on_invalid is left at the default (passthrough) so that
#      Conversations API traffic is not rejected before the
#      conversations filter can handle it in the body phase.
#
#   3. openai_validate checks JSON syntax, generates response
#      and conversation IDs, and writes responses.* metadata for downstream
#      filters. Provider-owned parameter combinations pass through.
#
#   4. openai_tool_parse parses the tools array and tool_choice from
#      Responses API requests and promotes summary facts (has_tools,
#      has_web_search, tool_choice, function_count, etc.) to
#      metadata and filter results. Does not mutate the request body.
#
#   5. openai_store persists responses to SQLite and registers
#      the store backend so downstream filters (rehydrate, compact) can
#      read from it. It runs PRE-IRR (before the iterative_request_router
#      below), so on the response path — which runs in reverse config
#      order — it persists AFTER the IRR step has composed the terminal
#      event. This is what makes streaming persistence work: the store
#      reads the accumulated response object that openai_stream_events
#      builds inside the IRR (see step 11).
#
#   6. openai_rehydrate loads conversation context from
#      previous_response_id or conversation field by fetching
#      stored responses/conversations and prepending their message
#      history to the current request. previous_response_id takes
#      precedence when both are present.
#
#   7. openai_file_resolve resolves file_id references in the current
#      input and rehydrated history through a configured Files API.
#      Runs after rehydrate so stored history is available, and before
#      responses_proxy so the rebuilt upstream body contains file_data
#      or image_url rather than stale file_id references.
#
#   8. openai_doc_extract converts input_file content parts to
#      input_text for backends that do not natively support input_file
#      (e.g. vLLM, llm-d). Text-safe content (text/*, application/json,
#      application/xml) is decoded from base64, validated as UTF-8, and
#      forwarded as plain text. Unsupported formats are left unchanged
#      (on_unsupported: continue). This filter is optional — omit it
#      when the inference backend natively supports input_file.
#
#   9. openai_mcp_tool_resolve resolves MCP tool entries from the tools
#      array by calling tools/list on each upstream MCP server.
#      Runs after rehydrate so previous_tools is available for
#      cross-request caching. Writes mcp_tool_map to
#      ResponsesState for downstream tool dispatch.
#
#   10. The bypass gateway (a no-op `headers` carrier hosting a
#      branch_chains bypass) routes everything EXCEPT classified
#      `POST /v1/responses` create requests directly to a backend. The IRR
#      below fully owns the sub-request lifecycle, which is incompatible
#      with WebSocket upgrades and with the dedicated
#      prompts/embeddings/files/vector_stores services — so those, plus
#      `GET /v1/responses` WebSocket handshakes, take the bypass branch.
#      The carrier's `unless` condition skips it only when the request is
#      `POST /v1/responses` AND classified as x-praxis-ai-format:
#      openai_responses, so genuine create requests fall through to the
#      IRR while a Chat Completions body posted to /v1/responses (or a
#      GET WebSocket handshake) still runs the carrier. Discrimination
#      lives here, PRE-IRR, because the IRR strips x-praxis-* headers from
#      its sub-request (see step 11). Inside the bypass, the `/v1/responses`
#      route matches on the WebSocket `Upgrade` header (routes cannot match
#      on HTTP method), so a WS handshake reaches the backend while a Chat
#      Completions body gets a route-miss (404). The bypass
#      router/load_balancer live INSIDE the branch: a top-level router or
#      load_balancer cannot coexist with an IRR in the same chain, and the
#      branch rejoins at `terminal` so its selected cluster is forwarded
#      upstream directly.
#
#   11. openai_proxy reads the assembled ResponsesState and
#      rebuilds the outbound request body with the full conversation
#      history, then automatically selects the typed
#      streaming transport so each backend SSE chunk reaches
#      openai_stream_events incrementally. openai_stream_events composes
#      the inference round into one logical Responses stream and
#      accumulates the response object into ResponsesState. Because the
#      IRR is the terminal filter, all backend routing for create requests
#      lives inside the IRR step. That step router is path-only: the IRR
#      strips every x-praxis-* reserved-prefix header from its sub-request
#      before the step runs, so it cannot route on x-praxis-ai-format.
#      Responses-vs-Chat discrimination therefore happens PRE-IRR at the
#      bypass carrier (step 10); only a classified openai_responses create
#      request reaches this step.
#
# Streaming persistence:
#   Removing openai_stream_events (or moving openai_store after
#   the IRR) silently breaks streaming persistence: the store persists
#   ResponsesState.response_object, and only openai_stream_events
#   populates it for `stream: true` responses. Keep the store PRE-IRR and
#   openai_stream_events INSIDE the IRR step so both buffered and
#   streaming responses are persisted and retrievable via
#   GET /v1/responses/{id} (served pre-IRR by openai_store).
#
# Agentic loop:
#   This config runs the IRR with max_iterations: 1 — a single inference
#   round, streamed and persisted. For MCP-driven agentic tool loops, see
#   agentic-loop.yaml. For file-search callout (vector store backed) with
#   the full pipeline, see full-flow-agentic.yaml (buffered only; the
#   file_search callout is not yet compatible with the streaming IRR).
#
# Security: StreamBuffer body callouts run before this listener's
# header-phase filters. Deploy this example behind an outer
# authentication and authorization boundary before enabling the
# required allow_pre_security_callout acknowledgement below.
#
# A request is stateful when any of these hold:
#   - previous_response_id is set
#   - tools array is non-empty
#   - store is true (the OpenAI spec default when omitted)
#   - background is true
#   - conversation is set
#   - prompt.id is set
#
# Example requests:
#
#   # Stateful (store defaults to true) — validated, streamed, persisted
#   curl -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -d '{"model":"gpt-4.1","input":"Hello, world!"}'
#
#   # Streaming with persistence (store defaults to true)
#   curl -N -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -d '{"model":"gpt-4.1","input":"Hello","stream":true}'
#
#   # Stateless (store=false, no stateful markers) — validated and routed
#   curl -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -d '{"model":"gpt-4.1","input":"Hello","store":false}'
#
#   # Multi-turn with previous_response_id
#   curl -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -d '{"model":"gpt-4.1","input":"What next?","previous_response_id":"resp_abc"}'
#
#   # Multi-turn with conversation
#   curl -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -d '{"model":"gpt-4.1","input":"What next?","conversation":"conv_abc"}'
#
#   # Retrieve a stored response (buffered or streamed)
#   curl http://localhost:8080/v1/responses/<response-id>
#
#   # File reference resolved through the configured Files API
#   curl -X POST http://localhost:8080/v1/responses \
#     -H "Content-Type: application/json" \
#     -H "Authorization: Bearer token" \
#     -d '{"model":"gpt-4.1","input":[{"type":"message","role":"user","content":[{"type":"input_file","file_id":"file_abc"}]}]}'
#
#   # Responses WebSocket (requires a WebSocket-capable backend) —
#   # takes the bypass branch, never the IRR
#   websocat -H="Authorization: Bearer $OPENAI_API_KEY" \
#     ws://localhost:8080/v1/responses
#
# Listener and cluster transport timeouts are intentionally omitted.
# Configured downstream read and upstream idle/read/write timeouts remain
# active after a 101 upgrade and can terminate long-lived WebSockets.
#
# Direct OpenAI upstream variant:
#   - Replace the local inference-backend endpoint with api.openai.com:443 and
#     configure tls.sni: api.openai.com (in BOTH the bypass branch's
#     load_balancer and the IRR step's load_balancer).
#   - Add this headers filter inside the IRR step after the router to
#     replace the downstream Host:
#
#       - filter: headers
#         request_set:
#           - name: Host
#             value: api.openai.com
#
#   - Either pass through the client's Authorization header or add a
#     credential_injection filter inside the IRR step to inject a
#     server-owned credential:
#
#       - filter: credential_injection
#         clusters:
#           - name: inference-backend
#             header: Authorization
#             env_var: OPENAI_API_KEY
#             header_prefix: "Bearer "
#
#   - Configure the inference cluster as:
#
#       - name: "inference-backend"
#         endpoints:
#           - "api.openai.com:443"
#         tls:
#           sni: api.openai.com
#
# Build:
#   cargo build -p praxis-ai-proxy

listeners:
  - name: ai-gateway
    address: "127.0.0.1:8080"
    filter_chains: [responses-pipeline]

filter_chains:
  - name: responses-pipeline
    filters:
      - filter: openai_conversations
        backend: sqlite
        database_url: "sqlite://responses.db?mode=rwc"
        conversations_table: openai_conversations
        items_table: openai_conversation_items

      - filter: openai_format
        on_invalid: continue
        headers:
          format: x-praxis-ai-format
          model: x-praxis-ai-model
          stream: x-praxis-ai-stream
          mode: x-praxis-responses-mode

      - filter: openai_validate

      - filter: openai_tool_parse

      - filter: openai_store
        backend: sqlite
        # In-memory:
        #   database_url: "sqlite::memory:"
        # File-backed:
        database_url: "sqlite://responses.db?mode=rwc"
        responses_table: openai_responses
        conversations_table: openai_conversations

      - filter: openai_rehydrate

      - filter: openai_file_resolve
        files_api_url: "http://127.0.0.1:9999"
        allow_private_files_api_url: true
        allow_pre_security_callout: true
        forward_headers:
          - authorization
          - x-tenant-id
        on_missing: reject
        timeout_ms: 10000

      - filter: openai_doc_extract
        allow_pre_security_callout: true
        on_unsupported: continue

      - filter: openai_mcp_tool_resolve

      # Bypass gateway: a no-op carrier that runs for everything EXCEPT a
      # classified `POST /v1/responses` create request. When it runs, its
      # unconditional branch routes the request directly (WebSocket
      # upgrades, /v1/prompts, /v1/embeddings, /v1/files, /v1/vector_stores)
      # and rejoins at `terminal`, forwarding the selected cluster upstream
      # without entering the IRR. The router and load_balancer live inside
      # the branch because a top-level router/load_balancer cannot coexist
      # with the IRR below. The `unless` condition skips this carrier only
      # for `POST /v1/responses` bearing x-praxis-ai-format:
      # openai_responses, so create requests fall through to the IRR while a
      # Chat Completions body on /v1/responses (classified
      # openai_chat_completions, or unclassified) still runs the carrier and
      # gets a route-miss (404). Discrimination lives here because the IRR
      # strips x-praxis-* headers from its sub-request; inside the branch
      # the /v1/responses route matches the WebSocket Upgrade header (routes
      # cannot match on HTTP method), so a WS handshake reaches the backend
      # while a Chat Completions body does not.
      - filter: headers
        conditions:
          - unless:
              path: "/v1/responses"
              methods: [POST]
              headers:
                x-praxis-ai-format: "openai_responses"
        branch_chains:
          - name: bypass-irr
            rejoin: terminal
            chains:
              - name: bypass-chain
                filters:
                  - filter: router
                    routes:
                      - path_prefix: "/v1/prompts"
                        cluster: "prompts-api"
                      - path_prefix: "/v1/embeddings"
                        cluster: "embeddings-api"
                      - path_prefix: "/v1/files"
                        cluster: "files-api"
                      # WebSocket handshakes are GET /v1/responses with an
                      # Upgrade header. Routes cannot match on HTTP method, so
                      # the Upgrade header discriminates: a WS handshake routes
                      # to the backend, while a Chat Completions body posted to
                      # /v1/responses carries no Upgrade header and gets a
                      # route-miss (404) here instead of reaching the backend.
                      - path: "/v1/responses"
                        headers:
                          upgrade: "websocket"
                        cluster: "inference-backend"
                      - path_prefix: "/v1/vector_stores"
                        cluster: "vector-stores-backend"
                  - filter: load_balancer
                    clusters:
                      - name: "prompts-api"
                        endpoints:
                          - "127.0.0.1:9998"
                      - name: "embeddings-api"
                        endpoints:
                          - "127.0.0.1:9997"
                      - name: "files-api"
                        endpoints:
                          - "127.0.0.1:9999"
                      - name: "inference-backend"
                        endpoints:
                          - "127.0.0.1:3001"
                      - name: "vector-stores-backend"
                        endpoints:
                          - "127.0.0.1:3002"

      # Classified openai_responses POST /v1/responses create requests flow
      # here. The IRR runs a single inference round; openai_proxy
      # automatically selects the typed streaming transport, and
      # openai_stream_events composes the round into one logical Responses
      # stream while accumulating the response object into ResponsesState.
      # The pre-IRR openai_store then persists that object on the
      # response path (reverse order). The step router is path-only because
      # the IRR strips x-praxis-* headers from its sub-request; the bypass
      # carrier above has already excluded non-Responses traffic.
      - filter: iterative_request_router
        initial_step: inference
        max_iterations: 1
        # The IRR's default 30s end-to-end deadline is too short for model
        # inference. This single step inherits a 6-minute total deadline for
        # time-to-first-byte plus response streaming.
        timeout_ms: 360000
        steps:
          - name: inference
            filters:
              - filter: openai_proxy

              # Composes the inference stream into one logical Responses
              # lifecycle and accumulates the response object for
              # persistence. Armed by a `stream: true` request; always
              # composes, so it must run inside this IRR step.
              - filter: openai_stream_events

              - filter: headers
                request_set:
                  - name: Content-Type
                    value: application/json

              # Path-only routing. The x-praxis-ai-format header cannot be
              # matched here: the IRR strips every x-praxis-* reserved-prefix
              # header from the sub-request before this step's router runs, so
              # a header match would always miss (404). Responses-vs-Chat
              # discrimination therefore happens PRE-IRR at the bypass carrier
              # (only a classified openai_responses POST reaches this step).
              - filter: router
                routes:
                  - path: "/v1/responses"
                    cluster: "inference-backend"

              - filter: load_balancer
                clusters:
                  - name: "inference-backend"
                    endpoints:
                      - "127.0.0.1:3001"
            on_result:
              - default: true
                done: true

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
