# Responses Inline Document Extraction
# Requires `--features openai-file-resolve-filter` because document extraction is opt-in.
#
# Converts inline text-safe input_file data to input_text, including a single
# object-form input. File IDs and URLs require the separate file-resolve example.
#
# Build:
#   cargo build -p praxis-ai-proxy --features openai-file-resolve-filter

listeners:
  - name: inline-documents
    address: "127.0.0.1:8080"
    filter_chains: [inline-documents]

filter_chains:
  - name: inline-documents
    filters:
      - filter: ai_operation
      - filter: openai_responses_request
        on_invalid: reject
      - filter: openai_doc_extract
        # Enable behind an outer authentication and authorization boundary.
        allow_pre_security_callout: true
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend
      - filter: load_balancer
        clusters:
          - name: backend
            endpoints: ["127.0.0.1:3001"]

insecure_options:
  allow_private_endpoints: true # example proxies to a local backend
