# Token Rate Limiting -- llm-d priority class on soft over-quota
#
# When Praxis is the front door, an over-quota request continues and carries
# `x-llm-d-inference-priority-class: sheddable` for the Endpoint Picker.
# Inside quota the header is absent, which the picker treats as critical.
# A client-supplied copy of the header is stripped, so the quota result is
# the only writer. Protective denials still return 429.
#
# Usage:
#   cargo run -p praxis-ai-proxy --features token-rate-limit-filter -- \
#     -c examples/configs/token-rate-limit-priority-class.yaml
#
# Supported token_count provider values:
#   openai | anthropic | google | bedrock | azure

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: router
        routes:
          - path: "/v1/chat/completions"
            cluster: backend

      - filter: token_rate_limit
        backend:
          kind: memory
        rules:
          - name: llm-d-priority-class
            algorithm: sliding_window
            window: 1h
            capacity: 100000
            reserved_tokens: 500
            enforcement: soft
            over_quota:
              headers:
                x-llm-d-inference-priority-class: sheddable

      - filter: token_count
        provider: openai

      - filter: access_log

      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"

insecure_options:
  allow_private_endpoints: true
