[package]
name = "praxis-ai-apis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "AI provider API types and persistence for Praxis"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "praxis_ai_apis"

[features]
default = ["store-postgres", "callout-rustls"]
store = ["dep:sqlx", "dep:dashmap"]
store-postgres = ["store", "sqlx/postgres", "sqlx/tls-native-tls"]
store-sqlite = ["store", "sqlx/sqlite"]
store-all = ["store-postgres", "store-sqlite"]
callout-rustls = ["reqwest/rustls", "rmcp/reqwest"]
callout-native-tls = ["reqwest/native-tls", "rmcp/reqwest-native-tls"]
praxis-main = []

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true, optional = true }
futures = { workspace = true }
http = { workspace = true }
jsonschema = { workspace = true }
percent-encoding = { workspace = true }
pingora-core = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
sse-stream = { workspace = true }
thiserror = { workspace = true }
tiktoken-rs = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }
