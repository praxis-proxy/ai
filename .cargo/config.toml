[alias]
# Developer commands inspect the complete, explicitly opted-in filter registry.
xtask = "run --package xtask --features openai-all,store-all --"

[build]
rustdocflags = ["-D", "warnings"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "force-frame-pointers=yes"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "force-frame-pointers=yes"]
