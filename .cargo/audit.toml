# cargo-audit configuration
#
# Advisories listed here are from Pingora transitive
# dependencies that we cannot control.

[advisories]
ignore = [
    # derivative 2.2.0: unmaintained
    "RUSTSEC-2024-0388",
    # rustls-pemfile 2.2.0: unmaintained (via pingora-rustls)
    "RUSTSEC-2025-0134",
    # zstd 0.13 / zstd-safe 7 via quixotic header-serde; no patched
    # compatible release exists. Remove when quixotic migrates to
    # zstd >=0.14.3 and zstd-safe >=8.2.0.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    # zstd-safe 7.3.0: use-after-free with `CParameter::StableInBuffer`
    "RUSTSEC-2026-0414",
]
