surfaces:

  # -------------------------------------------------------------------------
  - id: anthropic-messages-to-chat-completions
    short: "Anthropic -> CC"
    client_api: Anthropic Messages
    backend_api: OpenAI Chat Completions
    filters:
      - anthropic_messages_to_chat_completions
      - anthropic_messages_to_chat_completions_stream
    clean_rejection_requires: [anthropic_messages_request]
    unknown_field_policy: >-
      Sixteen top-level fields are rejected 400: thirteen Chat-only fields
      (service_tier, container, inference_geo, mcp_servers, n, logprobs,
      top_logprobs, audio, modalities, functions, function_call,
      web_search_options, moderation) and three Anthropic-only fields
      (thinking, context_management, cache_control) unless
      allow_lossy_features opts them in. Any other unrecognized top-level
      field is forwarded verbatim to the Chat backend
      (forward_unmapped_fields); a translated key wins over a forwarded one.
    cells:
      text-chat:
        status: translated
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:820-881
      system-prompt:
        status: translated-lossy
        note: >-
          An array of text blocks is joined with newlines into one string, so
          per-block boundaries are lost. A block carrying cache_control is
          rejected 400 by default; with allow_lossy_features: [prompt_caching]
          the marker is stripped and signalled (see the request-side controls
          row).
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:859-881; apis/src/anthropic/messages_to_chat_completions/request.rs:497-502; apis/src/anthropic/messages_to_chat_completions/request.rs:703-711
      multi-turn:
        status: translated
        note: In-array system messages are accepted deliberately (Claude Code emits them).
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:537-542
      multimodal-image:
        status: translated
        note: >-
          User messages only. An image in an assistant message, or in any
          message that also carries tool_use, is rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:627-641; apis/src/anthropic/messages_to_chat_completions/request.rs:688
      multimodal-audio:
        status: n-a
      documents-files:
        status: rejected
        note: All document source types rejected 400; no PDF support.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:688
      function-tools:
        status: translated
        note: >-
          input_schema is moved verbatim, strict is forwarded, and an absent
          description is synthesized as "". Unknown tool keys are rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1486-1512; apis/src/anthropic/messages_to_chat_completions/request.rs:551-583
      tool-choice:
        status: translated
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1535-1576; apis/src/anthropic/messages_to_chat_completions/request.rs:589-621
      parallel-tool-calls:
        status: translated
        note: disable_parallel_tool_use true maps to parallel_tool_calls false.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1520-1532
      hosted-tools:
        status: rejected
        note: >-
          tools[].type must be absent or "custom"; typed server tools
          (web_search, bash, computer, code_execution) are rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:554-561
      structured-output:
        status: translated-lossy
        note: >-
          output_config.format becomes a strict response_format.json_schema,
          which matches Anthropic's always-constrained output. OpenAI strict
          mode requires every property in `required`, so a schema with
          optional properties is rejected upstream by an OpenAI backend.
          output_config.effort maps to reasoning_effort; any other
          output_config key is rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1413-1424; apis/src/anthropic/messages_to_chat_completions/request.rs:1378-1410
      streaming:
        status: translated-lossy
        note: >-
          stream_options.include_usage is force-set true, overriding a client
          false. stream_options without stream:true is rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1319-1337; apis/src/anthropic/messages_to_chat_completions/request.rs:508-517
      streaming-terminal-events:
        status: dropped
        note: >-
          Terminal events are emitted only from the [DONE] branch. If the
          upstream stream ends without the sentinel, no message_delta and no
          message_stop are sent — a truncated response reported as success.
          Anthropic's documented `ping` keep-alive is never emitted either.
        blocker: TODO-ISSUE emit terminal events at end-of-stream
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:539-541; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:965-982; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:344-372
      upstream-error-midstream:
        status: dropped
        note: >-
          A `data: {"error":{...}}` chunk after a 200 parses as a valid JSON
          object, matches neither choices nor usage, and is discarded. The
          client sees a short clean completion for a failed generation. Only
          non-JSON and non-object data fails the stream.
        blocker: TODO-ISSUE surface mid-stream upstream error objects
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:559-575; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:583-645
      content-filter-signal:
        status: translated-lossy
        note: >-
          Neither path preserves content_filter as an Anthropic stop reason.
          Non-streaming rejects the untranslatable upstream success with 500;
          streaming emits a terminal Anthropic error and suppresses subsequent
          deltas and message_stop. It does not silently map the outcome to
          end_turn.
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:123-126; apis/src/anthropic/messages_to_chat_completions/mod.rs:408-419; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:624-645; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:1323-1365
      usage-accounting:
        status: dropped
        note: >-
          message_start.usage.input_tokens is hardcoded 0 rather than null, so
          clients reading prompt tokens at message_start get a wrong number,
          not a missing one. Finite-path usage is correct.
        blocker: TODO-ISSUE populate or null message_start usage
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:1045-1047
      cache-accounting:
        status: translated-lossy
        note: >-
          cache_read_input_tokens maps correctly; cache_creation_input_tokens
          is hardcoded null because Chat Completions has no cache-write
          counter, so cache-write billing is invisible.
        evidence: apis/src/anthropic/wire.rs:200-214; apis/src/anthropic/messages_to_chat_completions/response.rs:285-309; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:1022-1042
      reasoning-content:
        status: dropped
        note: >-
          Upstream message.reasoning_content is never read on either path, so
          billed reasoning output vanishes. A non-null finite `refusal` is read
          and refused (the upstream success is rejected with 500); a non-null
          streaming delta.refusal emits a terminal Anthropic error instead of
          being silently dropped.
        blocker: TODO-ISSUE reject or surface reasoning_content
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:178-184; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:714-735; apis/src/anthropic/messages_to_chat_completions/response.rs:113-121; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:624-645
      request-reasoning-cache-controls:
        status: rejected
        note: >-
          thinking, context_management and cache_control are rejected 400 by
          default. With allow_lossy_features listing extended_thinking and/or
          prompt_caching, recognized markers are validated then stripped, and
          each real degradation is reported three ways: an x-degraded-features
          response header, a WARN log, and the
          praxis_anthropic_messages_to_chat_completions_degraded_total{feature}
          counter. Malformed markers and features not listed still return 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:59; apis/src/anthropic/messages_to_chat_completions/request.rs:492-495; apis/src/anthropic/messages_to_chat_completions/request.rs:215-242; apis/src/anthropic/messages_to_chat_completions/request.rs:398-439; apis/src/anthropic/messages_to_chat_completions/mod.rs:95; apis/src/anthropic/messages_to_chat_completions/mod.rs:484-498
      stop-sequences:
        status: translated-lossy
        note: >-
          A genuine stop-sequence stop is reported as end_turn with
          stop_sequence null whenever the backend does not surface the matched
          string (vLLM's choice.stop_reason is consulted on both paths).
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:247-272; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:609-615
      sampling-params:
        status: translated-lossy
        note: >-
          temperature and top_p move verbatim with no rescaling. top_k is not
          mapped and is forwarded as a literal non-spec key, which vLLM accepts
          and OpenAI rejects.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1340-1349; apis/src/anthropic/messages_to_chat_completions/request.rs:742-746
      logprobs:
        status: rejected
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:34-48; apis/src/anthropic/messages_to_chat_completions/request.rs:758-771
      state-continuation:
        status: n-a
      unsupported-operations:
        status: n-a
      error-envelope:
        status: translated-lossy
        note: >-
          Upstream errors carrying Anthropic vocabulary are preserved; a
          foreign error.type is replaced by the HTTP-status mapping and only
          `message` survives. OpenAI error.code and error.param are not read.
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:22-31; apis/src/anthropic/messages_to_chat_completions/response.rs:131-154; apis/src/anthropic/wire.rs:58-86
      oversized-body:
        status: dropped
        note: See the shared oversized-body gap below.
        blocker: TODO-ISSUE format the 413 produced by the body-limit filter
        evidence: praxis-proxy-protocol-0.8.0/src/http/body_limit.rs:28-49; praxis-proxy-protocol-0.8.0/src/http/pingora/handler/request_body_filter.rs:177-215

