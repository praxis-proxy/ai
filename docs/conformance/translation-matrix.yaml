# ---------------------------------------------------------------------------
# Defects that span surfaces. Rendered once, above the per-surface tables, so
# a reader does not have to infer the pattern from repeated cells.
# ---------------------------------------------------------------------------
cross_surface_gaps:
  - id: reasoning-and-cache-tokens-vanish
    affects: [anthropic-messages-to-chat-completions, chat-completions-to-vertexai-gemini, chat-completions-to-bedrock-converse]
    summary: >-
      Reasoning content is silently discarded on the Anthropic and Bedrock
      paths, and its token count on Vertex. Cache-token counters are discarded
      entirely on Vertex and Bedrock; Anthropic maps cache reads and loses
      only the cache-write counter. Customers are billed for tokens the matrix
      would otherwise claim they receive.
    blocker: TODO-ISSUE systematic handling of reasoning and cache tokens across translators

  - id: oversized-body-bare-413
    affects: [anthropic-messages-to-chat-completions, responses-to-chat-completions, chat-completions-to-vertexai-gemini, chat-completions-to-azureai, chat-completions-to-bedrock-converse]
    summary: >-
      An oversized body produces Rejection::status(413) with no headers and no
      body, then short-circuits fail_to_proxy before any formatter runs. This
      fires for the global body_limits ceiling and for every filter's
      StreamBuffer{max_bytes}, including the request filters that would
      otherwise install the formatter. An SDK receives a content-type-less
      empty 413 in every dialect.
    blocker: TODO-ISSUE format the 413 produced by the body-limit filter

  - id: divergent-error-envelopes
    affects: [chat-completions-to-vertexai-gemini, chat-completions-to-bedrock-converse, chat-completions-to-azureai]
    summary: >-
      Three filters emit three different OpenAI-shaped envelopes — Vertex
      includes param:null, Bedrock omits param and uses code "invalid_request",
      Azure rewrites whatever Azure returned. One client error handler cannot
      cover all three.
    blocker: TODO-ISSUE converge on one OpenAI error envelope builder

  - id: inverted-token-budget-precedence
    affects: [chat-completions-to-vertexai-gemini, chat-completions-to-bedrock-converse]
    summary: >-
      When both max_tokens and max_completion_tokens are present, Vertex
      prefers max_completion_tokens and Bedrock prefers max_tokens. The same
      client request gets a different token budget depending on the backend.
      Vertex documents and tests its own precedence; nothing explains why the
      two differ.
    blocker: TODO-ISSUE pick one max-tokens precedence across translators
