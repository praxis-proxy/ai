# Translation surfaces.
# ---------------------------------------------------------------------------
surfaces:

  # -------------------------------------------------------------------------
  - id: anthropic-messages-to-chat-completions
    client_api: Anthropic Messages
    backend_api: OpenAI Chat Completions
    filters:
