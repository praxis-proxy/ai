surfaces:

  # -------------------------------------------------------------------------
  - id: anthropic-messages-to-chat-completions
    short: "Anthropic -> CC"
    client_api: Anthropic Messages
    backend_api: OpenAI Chat Completions
    filters:
      - anthropic_messages_to_chat_completions
      - anthropic_messages_to_chat_completions_stream
    clean_rejection_requires: [anthropic_messages_request]
    unknown_field_policy: >-
      Sixteen top-level fields are rejected 400: thirteen Chat-only fields
      (service_tier, container, inference_geo, mcp_servers, n, logprobs,
      top_logprobs, audio, modalities, functions, function_call,
      web_search_options, moderation) and three Anthropic-only fields
      (thinking, context_management, cache_control) unless
      allow_lossy_features opts them in. Any other unrecognized top-level
      field is forwarded verbatim to the Chat backend
      (forward_unmapped_fields); a translated key wins over a forwarded one.
    cells:
      text-chat:
        status: translated
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:799-860
      system-prompt:
        status: translated-lossy
        note: >-
          An array of text blocks is joined with newlines into one string, so
          per-block boundaries are lost. A block carrying cache_control is
          rejected 400 by default; with allow_lossy_features: [prompt_caching]
          the marker is stripped and signalled (see the request-side controls
          row).
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:838-860; apis/src/anthropic/messages_to_chat_completions/request.rs:476-481; apis/src/anthropic/messages_to_chat_completions/request.rs:682-690
      multi-turn:
        status: translated
        note: In-array system messages are accepted deliberately (Claude Code emits them).
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:516-521
      multimodal-image:
        status: translated
        note: >-
          User messages only. An image in an assistant message, or in any
          message that also carries tool_use, is rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:606-620; apis/src/anthropic/messages_to_chat_completions/request.rs:667
      multimodal-audio:
        status: n-a
      documents-files:
        status: rejected
        note: All document source types rejected 400; no PDF support.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:667
      function-tools:
        status: translated
        note: >-
          input_schema is moved verbatim, strict is forwarded, and an absent
          description is synthesized as "". Unknown tool keys are rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1465-1491; apis/src/anthropic/messages_to_chat_completions/request.rs:530-562
      tool-choice:
        status: translated
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1514-1555; apis/src/anthropic/messages_to_chat_completions/request.rs:568-600
      parallel-tool-calls:
        status: translated
        note: disable_parallel_tool_use true maps to parallel_tool_calls false.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1499-1511
      hosted-tools:
        status: rejected
        note: >-
          tools[].type must be absent or "custom"; typed server tools
          (web_search, bash, computer, code_execution) are rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:533-540
      structured-output:
        status: translated-lossy
        note: >-
          output_config.format becomes a strict response_format.json_schema,
          which matches Anthropic's always-constrained output. OpenAI strict
          mode requires every property in `required`, so a schema with
          optional properties is rejected upstream by an OpenAI backend.
          output_config.effort maps to reasoning_effort; any other
          output_config key is rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1392-1403; apis/src/anthropic/messages_to_chat_completions/request.rs:1357-1389
      streaming:
        status: translated-lossy
        note: >-
          stream_options.include_usage is force-set true, overriding a client
          false. stream_options without stream:true is rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1298-1316; apis/src/anthropic/messages_to_chat_completions/request.rs:487-496
      streaming-terminal-events:
        status: dropped
        note: >-
          Terminal events are emitted only from the [DONE] branch. If the
          upstream stream ends without the sentinel, no message_delta and no
          message_stop are sent — a truncated response reported as success.
          Anthropic's documented `ping` keep-alive is never emitted either.
        blocker: TODO-ISSUE emit terminal events at end-of-stream
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:539-541; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:931-948; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:344-372
      upstream-error-midstream:
        status: dropped
        note: >-
          A `data: {"error":{...}}` chunk after a 200 parses as a valid JSON
          object, matches neither choices nor usage, and is discarded. The
          client sees a short clean completion for a failed generation. Only
          non-JSON and non-object data fails the stream.
        blocker: TODO-ISSUE surface mid-stream upstream error objects
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:559-575; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:583-616
      content-filter-signal:
        status: dropped
        note: >-
          Non-streaming refuses finish_reason content_filter (the upstream
          success is rejected with 500); streaming silently maps it to
          end_turn. Identical backend behavior yields opposite client-visible
          outcomes depending on `stream`.
        blocker: TODO-ISSUE reconcile content_filter across streaming and finite paths
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:123-126; apis/src/anthropic/messages_to_chat_completions/mod.rs:400-411; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:1016-1022
      usage-accounting:
        status: dropped
        note: >-
          message_start.usage.input_tokens is hardcoded 0 rather than null, so
          clients reading prompt tokens at message_start get a wrong number,
          not a missing one. Finite-path usage is correct.
        blocker: TODO-ISSUE populate or null message_start usage
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:1011-1013
      cache-accounting:
        status: translated-lossy
        note: >-
          cache_read_input_tokens maps correctly; cache_creation_input_tokens
          is hardcoded null because Chat Completions has no cache-write
          counter, so cache-write billing is invisible.
        evidence: apis/src/anthropic/wire.rs:200-214; apis/src/anthropic/messages_to_chat_completions/response.rs:279-303; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:988-1008
      reasoning-content:
        status: dropped
        note: >-
          Upstream message.reasoning_content is never read on either path, so
          billed reasoning output vanishes. A non-null finite `refusal` is read
          and refused (the upstream success is rejected with 500); a streaming
          delta.refusal is not read.
        blocker: TODO-ISSUE reject or surface reasoning_content and refusal
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:178-184; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:685-706; apis/src/anthropic/messages_to_chat_completions/response.rs:113-121
      request-reasoning-cache-controls:
        status: rejected
        note: >-
          thinking, context_management and cache_control are rejected 400 by
          default. With allow_lossy_features listing extended_thinking and/or
          prompt_caching, recognized markers are validated then stripped, and
          each real degradation is reported three ways: an x-degraded-features
          response header, a WARN log, and the
          praxis_anthropic_messages_to_chat_completions_degraded_total{feature}
          counter. Malformed markers and features not listed still return 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:59; apis/src/anthropic/messages_to_chat_completions/request.rs:471-474; apis/src/anthropic/messages_to_chat_completions/request.rs:194-221; apis/src/anthropic/messages_to_chat_completions/request.rs:377-418; apis/src/anthropic/messages_to_chat_completions/mod.rs:95; apis/src/anthropic/messages_to_chat_completions/mod.rs:476-490
      stop-sequences:
        status: translated-lossy
        note: >-
          A genuine stop-sequence stop is reported as end_turn with
          stop_sequence null whenever the backend does not surface the matched
          string (vLLM's choice.stop_reason is consulted on both paths).
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:247-266; apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:604-610
      sampling-params:
        status: translated-lossy
        note: >-
          temperature and top_p move verbatim with no rescaling. top_k is not
          mapped and is forwarded as a literal non-spec key, which vLLM accepts
          and OpenAI rejects.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1319-1328; apis/src/anthropic/messages_to_chat_completions/request.rs:721-725
      logprobs:
        status: rejected
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:34-48; apis/src/anthropic/messages_to_chat_completions/request.rs:737-750
      state-continuation:
        status: n-a
      unsupported-operations:
        status: n-a
      error-envelope:
        status: translated-lossy
        note: >-
          Upstream errors carrying Anthropic vocabulary are preserved; a
          foreign error.type is replaced by the HTTP-status mapping and only
          `message` survives. OpenAI error.code and error.param are not read.
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:22-31; apis/src/anthropic/messages_to_chat_completions/response.rs:131-154; apis/src/anthropic/wire.rs:58-86
      oversized-body:
        status: dropped
        note: See the shared oversized-body gap below.
        blocker: TODO-ISSUE format the 413 produced by the body-limit filter
        evidence: praxis-proxy-protocol-0.7.4/src/http/pingora/handler/request_body_filter.rs:99-127

