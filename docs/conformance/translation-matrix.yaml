# Translation support matrix — source of truth.
#
# Rendered to docs/conformance/translation-matrix.md by
# `cargo xtask translation-matrix --fix`. Do not hand-edit the rendered file.
#
# status vocabulary:
#
#   native          Praxis implements the operation locally and owns the payload.
#   passthrough     Forwarded to the backend unchanged; backend semantics apply.
#   translated      Converted with no semantic loss.
#   translated-lossy Converted, something is approximated. `note` must say what.
#   rejected        Explicit dialect-shaped error at the proxy edge.
#   dropped         Accepted, then silently ignored or silently wrong.
#   n-a             The client API has no such concept.
#
# A cell takes the status of the feature's main path. Two statuses dominate
# regardless of path: `dropped` wins whenever any accepted input is silently
# ignored or silently wrong, and `translated-lossy` wins over `translated`
# whenever any accepted input loses information. An explicit rejection of a
# sub-case does not demote a cell; the `note` records it. `n-a` never
# combines with another status.
#
# `dropped` is a defect, not a support level. The renderer MUST fail if a cell
# has status `dropped` without a `blocker`, and MUST NOT emit `dropped` cells
# into the customer-facing table — they render into a separate "Known gaps"
# section so the matrix never claims support Praxis does not provide.
#
# `evidence` is one or more `;`-separated `path:lines` citations. Repository
# paths must exist and the cited lines must fit the file; citations into the
# core protocol crate carry the version pinned in Cargo.toml. Filter names
# must be registered in filters/src/register.rs. `cargo xtask
# translation-matrix` enforces all of this.

version: 1

# ---------------------------------------------------------------------------
# Preconditions that hold for every surface below.
# ---------------------------------------------------------------------------
preconditions:
  - id: clean-rejection-is-opt-in
    summary: >-
      Praxis emits a provider-shaped error only when one of three filters ran
      and matched. With none installed the proxy emits RFC 9457
      application/problem+json, not the client's dialect.
    evidence: praxis-proxy-protocol-0.7.4/src/http/pingora/handler/fail_to_proxy.rs:267-283
    detail:
      - "Installers: ai_operation (apis/src/operation_classifier/mod.rs:280-293, picks the
         OpenAI or Anthropic formatter from the matched protocol),
         openai_responses_request (apis/src/openai/responses/request/mod.rs:523 via
         apis/src/openai/responses/mod.rs:368-376),
         anthropic_messages_request (apis/src/anthropic/messages_request/mod.rs:273-277)."
      - "53 of 105 configs under examples/configs install none of the three."

  - id: on-invalid-defaults-to-continue
    summary: >-
      Malformed or unrecognized bodies are forwarded to the backend and lose
      the error formatter. 21 of the 51 examples that set on_invalid choose
      continue.
    evidence: apis/src/openai/responses/config.rs:119-120
    detail: []

  - id: no-deny-unknown-fields-on-the-wire
    summary: >-
      No request body is deserialized into a typed struct on any surface.
      Unknown fields are governed only by hand-written allowlists, where those
      exist. Absence of an allowlist means silent acceptance.
    evidence: apis/src/openai/translation/chat_completions.rs:362-370; apis/src/openai/translation/chat_completions.rs:446-469
    detail: []

