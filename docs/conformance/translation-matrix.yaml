# ---------------------------------------------------------------------------
# Native surfaces.
# ---------------------------------------------------------------------------
native_surfaces:
  - id: openai-conversations
    client_api: OpenAI Conversations
    operations: 8
    status: native
    note: >-
      All 8 operations are HandlingMode::Local; Praxis owns the payload and
      terminates locally. Handlers emit OpenAI-shaped 400/404/500 themselves.
    evidence: apis/src/openai/conversations/routes.rs:300-436

  - id: openai-responses-create
    client_api: OpenAI Responses
    operations: 1
    status: native
    note: POST /v1/responses is HandlingMode::Transform with an owned contract.
    evidence: apis/src/openai/responses/routes/mod.rs:187-199

  - id: openai-responses-readback
    client_api: OpenAI Responses
    operations: 3
    status: passthrough
    note: >-
      GET /v1/responses/{id}, DELETE, and GET .../input_items are classified
      passthrough but are terminated locally when openai_responses_store is in
      the chain. Registry mode is a classification default, not a transport
      guarantee.
    evidence: apis/src/openai/responses/routes/mod.rs:210-243; apis/src/openai/responses/store/filter.rs:1031-1051; apis/src/openai/responses/store/filter.rs:1188-1230; apis/src/openai/responses/store/filter.rs:172-196

  - id: openai-chat-completions
    client_api: OpenAI Chat Completions
    operations: 6
    status: passthrough
    note: >-
      Recognized by the registry with owned_contract: None. Outside conformance
      scope — no oasdiff, no capability claim, no runtime suite.
    evidence: apis/src/openai/chat_completions/routes/mod.rs:104,112-161

  - id: anthropic-messages-native
    client_api: Anthropic Messages
    operations: 8
    status: passthrough
    note: >-
      A head-based registry declares 8 operations: create-message is
      inspected, count_tokens and the 6 batch operations pass through with
      their bodies untouched. The protocol filter only injects
      anthropic-version and preserves anthropic-beta. No conformance gate.
    evidence: apis/src/anthropic/protocol/mod.rs:76-113; apis/src/anthropic/routes.rs:194-259; apis/src/anthropic/messages_request/mod.rs:216-239

conformance_claim_caveat: >-
  The report's "15/15, 100%" counts non-beta Conversations and Responses
  operations only — 7 of 14 projected Responses operations are scored. Publish
  the qualified number, never the bare percentage.

