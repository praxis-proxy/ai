      - anthropic_messages_to_chat_completions_stream
    clean_rejection_requires: [anthropic_messages_format]
    unknown_field_policy: >-
      Unrecognized top-level fields are forwarded verbatim to the Chat backend
      (forward_unmapped_fields), not dropped and not rejected.
    cells:
      text-chat:
        status: translated
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:447-452
      system-prompt:
        status: translated-lossy
        note: >-
          An array of text blocks is joined with newlines into one string;
          per-block boundaries and per-block cache points are lost.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:489-499
      multi-turn:
        status: translated
        note: In-array system messages are accepted deliberately (Claude Code emits them).
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:161-169
      multimodal-image:
        status: translated
        note: >-
          User messages only. An image in an assistant message, or in any
          message that also carries tool_use, is rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:255-269
      multimodal-audio:
        status: n-a
      documents-files:
        status: rejected
        note: All document source types rejected 400; no PDF support.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:315
      function-tools:
        status: translated
        note: input_schema is moved verbatim; absent description is synthesized as "".
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1113-1140
      tool-choice:
        status: translated
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1181-1201
      parallel-tool-calls:
        status: translated
        note: disable_parallel_tool_use true maps to parallel_tool_calls false.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1147-1159
      hosted-tools:
        status: rejected
        note: Typed server tools (web_search, bash, computer, code_execution) rejected 400.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:181-188
      structured-output:
        status: translated-lossy
        note: >-
          output_config.format becomes response_format.json_schema with a
          fabricated name "output_format" and a forced strict:true the client
          never requested.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:1040-1051
      streaming:
        status: translated
        note: stream_options.include_usage is force-set true, overriding a client false.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:946-964
      streaming-terminal-events:
        status: dropped
        note: >-
          Terminal events are emitted only from the [DONE] branch. If the
          upstream stream ends without the sentinel, no message_delta and no
          message_stop are sent — a truncated response reported as success.
          Anthropic's documented `ping` keep-alive is never emitted either.
        blocker: TODO-ISSUE emit terminal events at end-of-stream
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:931-948
      upstream-error-midstream:
        status: dropped
        note: >-
          A `data: {"error":{...}}` chunk after a 200 parses as valid JSON,
          matches neither choices nor usage, and is discarded. The client sees
          a short clean completion for a failed generation.
        blocker: TODO-ISSUE surface mid-stream upstream error objects
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:583-616
      content-filter-signal:
        status: dropped
        note: >-
          Non-streaming rejects finish_reason content_filter; streaming
          silently maps it to end_turn. Identical backend behavior yields
          opposite client-visible outcomes depending on `stream`.
        blocker: TODO-ISSUE reconcile content_filter across streaming and finite paths
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:141-144 vs stream/mod.rs:1016-1022
      usage-accounting:
        status: dropped
        note: >-
          message_start.usage.input_tokens is hardcoded 0 rather than null, so
          clients reading prompt tokens at message_start get a wrong number,
          not a missing one. Finite-path usage is correct.
        blocker: TODO-ISSUE populate or null message_start usage
        evidence: apis/src/anthropic/messages_to_chat_completions_stream/mod.rs:1011-1013
      cache-accounting:
        status: translated-lossy
        note: >-
          cache_read_input_tokens maps correctly; cache_creation_input_tokens
          is hardcoded null because Chat Completions has no cache-write
          counter, so cache-write billing is invisible.
        evidence: apis/src/anthropic/wire.rs:127-139
      reasoning-content:
        status: dropped
        note: >-
          Upstream message.reasoning_content and delta.refusal are never read
          on either path. Billed output the client never sees.
        blocker: TODO-ISSUE reject or surface reasoning_content and refusal
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:107-146
      stop-sequences:
        status: translated-lossy
        note: >-
          A genuine stop-sequence stop is reported as end_turn with
          stop_sequence null whenever the backend does not surface the matched
          string.
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:281-291
      sampling-params:
        status: translated
        note: >-
          temperature and top_p move verbatim with no rescaling. top_k is not
          mapped and is forwarded as a literal non-spec key, which vLLM accepts
          and OpenAI rejects.
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:369-373
      logprobs:
        status: rejected
        evidence: apis/src/anthropic/messages_to_chat_completions/request.rs:38-46
      state-continuation:
        status: n-a
      unsupported-operations:
        status: n-a
      error-envelope:
        status: translated
        note: >-
          Upstream errors carrying Anthropic vocabulary are preserved; a
          foreign error.type is replaced by the HTTP-status mapping and only
          `message` survives. OpenAI error.code and error.param are not read.
        evidence: apis/src/anthropic/messages_to_chat_completions/response.rs:149-194
      oversized-body:
        status: dropped
        note: See the shared oversized-body gap below.
        blocker: TODO-ISSUE format the 413 produced by the body-limit filter
        evidence: praxis-proxy-protocol-0.7.3/src/http/pingora/handler/request_body_filter.rs:99-127

