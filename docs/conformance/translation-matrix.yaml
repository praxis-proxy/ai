# Translation support matrix — source of truth.
#
# Rendered to docs/conformance/translation-matrix.md by
# `cargo xtask translation-matrix --fix`. Do not hand-edit the rendered file.
#
# status vocabulary, worst case wins for a cell:
#
#   native          Praxis implements the operation locally and owns the payload.
#   passthrough     Forwarded to the backend unchanged; backend semantics apply.
#   translated      Converted with no semantic loss.
#   translated-lossy Converted, something is approximated. `note` must say what.
#   rejected        Explicit dialect-shaped error at the proxy edge.
#   dropped         Accepted, then silently ignored or silently wrong.
#   n-a             The client API has no such concept.
#
# `dropped` is a defect, not a support level. The renderer MUST fail if a cell
# has status `dropped` without a `blocker`, and MUST NOT emit `dropped` cells
# into the customer-facing table — they render into a separate "Known gaps"
# section so the matrix never claims support Praxis does not provide.

version: 1

# ---------------------------------------------------------------------------
# Preconditions that hold for every surface below.
# ---------------------------------------------------------------------------
preconditions:
  clean_rejection_is_opt_in:
    summary: >-
      Praxis emits a provider-shaped error only when one of three filters ran
      and matched. With none installed the proxy emits RFC 9457
      application/problem+json, not the client's dialect.
    installers:
      - openai_operation            # apis/src/openai/operation_classifier/mod.rs:172-182
      - openai_responses_format     # apis/src/openai/responses/mod.rs:409-421
      - anthropic_messages_format   # apis/src/anthropic/messages_format/mod.rs:181-195
    default_without_installer: rfc-9457-problem-json
    evidence: praxis-proxy-protocol-0.7.3/src/http/pingora/handler/fail_to_proxy.rs:264-283
    shipped_coverage: 63 of 99 examples/configs/*.yaml install none of the three.

  on_invalid_defaults_to_continue:
    summary: >-
      Malformed or unrecognized bodies are forwarded to the backend and lose
      the error formatter. 13 of the 20 examples that set on_invalid choose
      continue.
    evidence: apis/src/openai/responses/config.rs:117-118

  no_deny_unknown_fields_on_the_wire:
    summary: >-
      No request body is deserialized into a typed struct on any surface.
      Unknown fields are governed only by hand-written allowlists, where those
      exist. Absence of an allowlist means silent acceptance.
    evidence: apis/src/openai/translation/chat_completions.rs:176-216

# ---------------------------------------------------------------------------
# Shared feature vocabulary. Every surface answers the same rows, so the
# rendered table reads as a matrix rather than a pile of per-filter notes.
# ---------------------------------------------------------------------------
features:
  - id: text-chat
    label: Plain text completion
  - id: system-prompt
    label: System / developer instructions
  - id: multi-turn
    label: Multi-turn history
  - id: multimodal-image
    label: Image input
  - id: multimodal-audio
    label: Audio input
  - id: documents-files
    label: Document / file input
  - id: function-tools
    label: Client function tools
  - id: tool-choice
    label: Tool choice
  - id: parallel-tool-calls
    label: Parallel tool calls
  - id: hosted-tools
    label: Provider-hosted tools (web search, file search, MCP, code interpreter)
  - id: structured-output
    label: Structured output / JSON schema
  - id: streaming
    label: Streaming
  - id: streaming-terminal-events
    label: Streaming terminates correctly
  - id: upstream-error-midstream
    label: Mid-stream upstream failure is surfaced
  - id: content-filter-signal
    label: Content-filter / safety signal reaches the client
  - id: usage-accounting
    label: Token usage accounting
  - id: cache-accounting
    label: Prompt-cache token accounting
  - id: reasoning-content
    label: Reasoning / thinking content
  - id: stop-sequences
    label: Stop sequences
  - id: sampling-params
    label: Sampling parameters
  - id: logprobs
    label: Logprobs
  - id: state-continuation
    label: Server-side state continuation
  - id: unsupported-operations
    label: Unsupported operations on a supported path
  - id: error-envelope
    label: Error envelope matches the client dialect
  - id: oversized-body
    label: Oversized request body

# ---------------------------------------------------------------------------
# Native surfaces.
# ---------------------------------------------------------------------------
native_surfaces:
  - id: openai-conversations
    client_api: OpenAI Conversations
    operations: 8
    status: native
    note: >-
      All 8 operations are HandlingMode::Local; Praxis owns the payload and
      terminates locally. Handlers emit OpenAI-shaped 400/404/500 themselves.
    evidence: apis/src/openai/conversations/routes.rs:298-436

  - id: openai-responses-create
    client_api: OpenAI Responses
    operations: 1
    status: native
    note: POST /v1/responses is HandlingMode::Transform with an owned contract.
    evidence: apis/src/openai/responses/routes/mod.rs:187-199

  - id: openai-responses-readback
    client_api: OpenAI Responses
    operations: 3
    status: passthrough
    note: >-
      GET /v1/responses/{id}, DELETE, and GET .../input_items are classified
      passthrough but are terminated locally when openai_response_store is in
      the chain. Registry mode is a classification default, not a transport
      guarantee.
    evidence: apis/src/openai/responses/store/filter.rs:681,686-689,1564-1567

  - id: openai-chat-completions
    client_api: OpenAI Chat Completions
    operations: 6
    status: passthrough
    note: >-
      Recognized by the registry with owned_contract: None. Outside conformance
      scope — no oasdiff, no capability claim, no runtime suite.
    evidence: apis/src/openai/chat_completions/routes/mod.rs:104,112-161

  - id: anthropic-messages-native
    client_api: Anthropic Messages
    operations: null
    status: passthrough
    note: >-
      Header-only filter (injects anthropic-version, preserves anthropic-beta);
      bodies are untouched. No operation registry, no conformance gate. Path
      match is a /v1/messages prefix test, so count_tokens and batches are not
      distinguished.
    evidence: apis/src/anthropic/protocol/mod.rs:81-87; apis/src/anthropic/messages_format/mod.rs:286-289

conformance_claim_caveat: >-
  The report's "15/15, 100%" counts non-beta Conversations and Responses
  operations only — 7 of 14 projected Responses operations are scored. Publish
  the qualified number, never the bare percentage.

