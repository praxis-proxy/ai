    caller: "praxis-policy-builtins (identity-jwt capability: DecodingKey + Validation only; never signs)"
    algorithm: "HS256/RS256/PS256/ES256/EdDSA signature verification"
    provider: "aws-lc-rs 1.18.1 (without the fips feature) via jsonwebtoken"
    crates: [aws-lc-rs, aws-lc-sys, jsonwebtoken, signature]
    profiles: [full]
