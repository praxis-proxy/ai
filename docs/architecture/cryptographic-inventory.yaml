# Machine-readable cryptographic inventory for the Praxis AI proxy (#1220).
# The prose companion is cryptographic-inventory.md; keep them in sync.
#
# Verified by `cargo xtask check-crypto-inventory` (run from `make lint`), which
# resolves the runtime graph of the profile of record (the shipped production
# artifact, `PRAXIS_AI_FEATURES ?= full`):
#   cargo tree -p praxis-ai-proxy --edges normal \
#     --no-default-features --features full --target <triple>
# on all three tier-1 targets (x86_64-unknown-linux-gnu, aarch64-apple-darwin,
# x86_64-pc-windows-msvc), so the result is host-independent and CI validates the
# macOS/Windows declarations even though it runs on Linux. It fails if:
#   * a crate appears in more than one classification list — production/allow/
#     proc_macro/test_only/build_only — or a provider spills outside `production`
#                                                       (duplicate classification);
#   * a crate whose name matches `watch_tokens` appears in a target's tree but is
#     declared for that platform in none of `production`, `allow`, `proc_macro`,
#     or `build_only` — a `platform:`-tagged entry only covers its own target
#                                                       (undeclared crypto);
#   * a `production` entry is absent from a target it applies to — a `platform:`
#     entry on its own target, or an untagged entry on any target
#                                                       (stale / drifted);
#   * a `production` entry has no `disposition`, or one outside the documented
#     set                                               (unclassified);
#   * a `providers:` entry drifts: wrong version, a missing `require_features`,
#     or a present `forbid_features` — unlisted extra features are allowed by
#     design                                            (provider drift);
#   * a `proc_macro` entry is not actually a `(proc-macro)` in the graph, or a
#     `production`/`allow` entry IS a proc-macro         (proc-macro misfile);
#   * a `production`/`allow` entry resolves only beneath a proc-macro subtree, so
#     it is not linked into the runtime binary            (runtime-linkage misfile);
#   * a `test_only` or `build_only` crate is actually linked into any target's
#     runtime binary (reachable from the root without crossing a proc-macro node)
#                                                       (containment regression).
#
# `watch_tokens` are matched against each crate name after splitting on '-' and
# '_' and stripping trailing digits from each part (so `sha2` -> `sha`,
# `md-5` -> `md`, `chacha20` -> `chacha`). Tokens with no current match are kept
# to catch future crypto crates.

watch_tokens:
  - sha
  - sha1
  - sha2
  - sha3
  - md
  - md5
  - hmac
  - hkdf
  - blake
  - ring
  - aes
  - rsa
  - dsa
  - ecdsa
  - ecdh
  - ed25519
  - ed448
  - x25519
  - curve25519
  - curve
  - elliptic
  - ristretto
  - dalek
  - schnorr
  - p224
  - p256
  - p384
  - p521
  - k256
  - secp256k1
  - secp256r1
  - chacha
  - poly1305
  - salsa
  # AEAD constructions and cipher modes.
  - aead
  - gcm
  - ccm
  - eax
  - siv
  # Legacy / regional block & stream ciphers.
  - camellia
  - twofish
  - blowfish
  - serpent
  - cast5
  - cast6
  - aria
  - sm4
  - des
  - idea
  - rc2
  - rc4
  # Additional hash / MAC families.
  - sm3
  - ripemd
  - whirlpool
  - groestl
  - gost
  - streebog
  - cmac
  - pmac
  # Post-quantum KEM / signature families.
  - kyber
