  - id: C6
    name: "X.509 peer/chain structural parse"
    owner: "praxis core (pingora / cert extraction)"
    caller: "quixotic-plecostomus-core / praxis-core cert extraction"
    algorithm: "ASN.1 X.509 v3 DER structural parse"
    provider: "x509-parser -> der-parser -> asn1-rs -> oid-registry (rusticata stack)"
    crates: [x509-parser, der-parser, asn1-rs, oid-registry]
