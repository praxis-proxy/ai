  # Alternative crypto libraries & language bindings (names that do not
  # tokenize to a primitive token above, e.g. libcrux-ml-kem -> libcrux/ml/kem).
  - libcrux
  - hacl
  - orion
  - dryoc
  - botan
  - mbedtls
  - wolfssl
  - nettle
  - gcrypt
  - libgcrypt
  - monocypher
  - sequoia
