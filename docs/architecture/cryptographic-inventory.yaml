# Reviewed non-primitives: crypto-family-named crates that resolve into a runtime
# graph but are NOT standalone cryptographic operations — support/trait layers,
# build-host code generators (proc-macros and their sub-dependencies), FFI
# companions, and naming coincidences. Each is reviewed and documented here so the
# drift alarm stays quiet without hiding a real primitive. A crate on the FIPS
# denylist may NOT appear here (a denied name is a real primitive — track it as an
# operation). `allow` is profile-agnostic and cross-checked against the resolved
# graphs: an entry absent from every graph is flagged stale; an entry also
# referenced by an operation is flagged (a crate has exactly one classification).
allow:
  # --- Naming coincidences / caller & wrapper crates (no primitive) ---
  - crate: aws-credential-types
    note: AWS credential value types (holds secrets, no primitive).
  - crate: aws-smithy-async
    note: AWS SDK async-runtime plumbing (no crypto).
  - crate: aws-smithy-runtime-api
    note: AWS SDK runtime API (no crypto).
  - crate: aws-smithy-types
    note: AWS SDK shared types (no crypto).
  - crate: openssl-probe
    note: Locates the system CA-bundle path; performs no crypto.
  - crate: spin
    note: Spinlock library (pulled by the regorus policy engine); not cryptographic.
  - crate: praxis-proxy-tls
    note: praxis-core TLS setup wrapper; installs the OpenSSL rustls provider (rustls_openssl) as the process default — the primitive is rustls/OpenSSL (T1).
  - crate: quixotic-plecostomus-rustls
    note: Pingora rustls wrapper; installs NO provider and enables rustls `custom-provider` (no built-in fallback); the installed provider is the OpenSSL adapter, so the primitive is rustls/OpenSSL (T1).
  # --- RustCrypto primitive-support layer (no standalone operation) ---
  - crate: const-oid
    note: OID constants for RustCrypto digest support on the JWT/SCRAM path (full).
  - crate: crypto-common
    note: RustCrypto primitive-support traits (enters via blake2/digest).
  - crate: digest
    note: RustCrypto digest support layer (blake2 in both profiles; sha2/hmac/hkdf/md-5 in full).
  - crate: untrusted
    note: Safe input parser (support); enters via rustls-webpki (both) and aws-lc-rs (full). Ring is absent from the graph.
  - crate: blake2
    note: BLAKE2b-128 Pingora HTTP cache key (non-secret). Upstream-owned; not a security function.
  - crate: rand_xoshiro
    note: Non-crypto statistical sampling in metrics-util (both profiles).
  # --- Build-host code generators (proc-macros and their sub-dependencies) ---
  # Present under `--edges normal` but executed on the build host, not linked into
  # the shipped binary. Kept out of `operations` so the runtime inventory is not
  # overstated.
  - crate: asn1-rs-derive
    note: ASN.1 derive macros for asn1-rs/x509-parser (C6). Build-host code generator.
  - crate: asn1-rs-impl
    note: ASN.1 impl macros for asn1-rs/x509-parser (C6). Build-host code generator.
  - crate: zeroize_derive
    note: Derive macro for `Zeroize`; the runtime primitive is `zeroize` (C3). Build-host code generator.
  - crate: aws-smithy-runtime-api-macros
    note: AWS SDK runtime-API macros (no crypto). Build-host code generator.
  - crate: openssl-macros
    note: OpenSSL derive macros (rustls OpenSSL provider + Linux native-tls backend); no crypto. Build-host code generator.
  - crate: tiny-keccak
    note: Keccak-f for ahash's const-random compile-time seed; reached only beneath const-random-macro (a proc-macro), so it executes on the build host and is not linked into the runtime binary.

# Load-bearing provider crates whose VERSION and security-relevant FEATURES are
# pinned so the provider-selection findings in the prose cannot rot while the
# crate name stays put. Every `require_features` entry must be present and every
# `forbid_features` entry absent on each profile/target where the crate appears;
# other (unlisted) features are permitted, since feature sets grow across patch
# releases and exact-set pinning would churn on benign additions. A provider with
# no constraints (e.g. `native-tls`) pins only its version. `profiles:` scopes the
# pin to the profiles the provider is resolved in.
providers:
  - crate: quixotic-plecostomus-rustls-openssl
    version: "0.4.1"
    profiles: [full, fips]
    require_features: [tls12]
    forbid_features: [fips]
    note: The installed process-default rustls provider (library `rustls_openssl`); routes all rustls TLS onto OpenSSL libcrypto (T1-T9). FIPS is host-activated, not this build feature — the crate's `fips` feature is a no-op and MUST stay unset.
  - crate: openssl
    version: "0.10.81"
    profiles: [full, fips]
    forbid_features: [vendored]
    note: libcrypto binding backing the rustls OpenSSL provider (all targets) and the Linux native-tls store backend. MUST NOT gain `vendored` — the validated module is the system libcrypto (OPENSSL_NO_VENDOR=1), not a bundled build.
  - crate: aws-lc-rs
    version: "1.18.1"
    profiles: [full]
    require_features: [aws-lc-sys]
    forbid_features: [fips]
    note: NOT the TLS provider (OpenSSL is); executes only JWT verify (A1) in the full profile. MUST NOT gain `fips` silently — that would misrepresent the compliance story.
  - crate: rustls
    version: "0.23.45"
    profiles: [full, fips]
    require_features: [custom-provider]
    forbid_features: [ring, aws_lc_rs]
    note: The Pingora fork enables `custom-provider` (no built-in provider default) and the OpenSSL provider is installed at start-up; both bundled rustls backends MUST stay absent. `ring` and `aws_lc_rs` are forbidden — the latter is rustls' canonical aws-lc-rs feature that its `aws-lc-rs`/`fips`/`prefer-post-quantum` features all pull in, so forbidding it keeps rustls off a bundled provider even if one of those aliases is enabled. rustls resolves WITHOUT any of them (its features are custom-provider/log/logging/std/tls12); aws-lc-rs enters the full profile only through jsonwebtoken, never as the TLS executor.
  - crate: jsonwebtoken
    version: "11.1.0"
    profiles: [full]
    require_features: [aws_lc_rs]
    note: JWT signature verify executes on aws-lc-rs (A1). Full profile only.
  - crate: native-tls
    version: "0.2.18"
    profiles: [full, fips]
    note: "PostgreSQL store TLS backend — diverges from the rustls data plane (A10; #1217 / R4). In full (store-postgres) and fips (store-postgres-cert-auth): the certificate-only PostgreSQL store ships in the FIPS image, so its TLS backend resolves in both profiles."

# --------------------------------------------------------------------------
# Cryptographic operations (operation-centric view, #1220 AC#1).
#
# This is the heart of the inventory: where cryptography is actually used, for
# what algorithm, under whose ownership, by which crates, and what remediation is
# required. `cargo xtask check-crypto-inventory` enforces: unique ids + all
# required fields; each op's `crates` resolve in every declared profile (except
# the OS trust-store backends security-framework[-sys]/schannel, which the host
# may not resolve); non-compliant dispositions (non-validated/needs-remediation)
# cite a remediation reference; and the FIPS-required operations (T1, A3, A4, A12)
# exist and declare the `fips` profile. `n-a` operations that run on the standard
# library (non-cryptographic SipHash) legitimately reference no crypto crate.
operations:
  - id: T1
    name: "Process rustls crypto-provider install (process-default)"
    owner: "praxis-proxy-tls (praxis core)"
    caller: "server/src/server.rs:98 boot_server -> install_crypto_provider (praxis_tls::provider::install, server.rs:495); also server/src/subrequest.rs:45"
    algorithm: "rustls_openssl default_provider().install_default() as the sole CryptoProvider (custom-provider, no ring); OpenSSL-backed suites, key exchange, signatures, digests, MACs, RNG"
    provider: "OpenSSL libcrypto via quixotic-plecostomus-rustls-openssl (rustls_openssl), installed by praxis-proxy-tls"
    crates: [quixotic-plecostomus-rustls-openssl, rustls, openssl, openssl-sys]
    profiles: [full, fips]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "Installs rustls_openssl as the sole process-wide CryptoProvider at boot (custom-provider, no ring fallback); every subsequent rustls TLS primitive executes on OpenSSL libcrypto. FIPS is host-activated (docs/fips.md), not asserted by this build."
  - id: T2
    name: "Upstream data-plane TLS handshake (proxy -> LLM)"
    owner: "praxis core (pingora fork)"
    caller: "praxis-protocol PingoraHttp (registered server/src/server.rs:181); upstream TLS inside the pingora fork"
    algorithm: "TLS 1.2/1.3 client handshake; rustls delegates every primitive to the installed OpenSSL provider"
    provider: "OpenSSL via the installed rustls_openssl provider (pingora rustls connector)"
    crates: [quixotic-plecostomus-rustls-openssl, rustls, rustls-webpki, tokio-rustls, openssl, openssl-sys]
    profiles: [full, fips]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "Upstream data-plane TLS (proxy -> LLM) runs inside the Pingora fork's rustls connector on the installed OpenSSL provider. ring is absent from the runtime graph."
  - id: T3
    name: "AI subrequest callout TLS handshakes"
    owner: "praxis core (SubRequestConnector)"
    caller: "apis/src/web_search/provider.rs:147; apis/src/openai/api_client/mod.rs:80; filters/src/guardrails/providers/nemo.rs:119 over server/src/subrequest.rs:51"
    algorithm: "TLS 1.2/1.3 handshake over the SubRequestConnector rustls config on the OpenSSL provider"
    provider: "OpenSSL via the installed rustls_openssl provider (SubRequestConnector)"
    crates: [quixotic-plecostomus-rustls-openssl, rustls, rustls-webpki, tokio-rustls, openssl, openssl-sys]
    profiles: [full, fips]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "web_search, file_search api_client, guardrails/NeMo and compact callouts share the praxis-core SubRequestConnector rustls config, delegating every primitive to the installed OpenSSL provider."
  - id: T4
    name: "Downstream listener TLS handshake (client -> proxy)"
    owner: "praxis-proxy-tls (praxis core)"
    caller: "listeners server/src/server.rs:181-193; ServerConfig in praxis-tls setup.rs:217-255"
    algorithm: "TLS 1.2/1.3 server handshake (ServerConfig on the OpenSSL provider); optional WebPKI client-cert verification"
    provider: "OpenSSL via the installed rustls_openssl provider (ServerConfig)"
    crates: [quixotic-plecostomus-rustls-openssl, rustls, rustls-webpki, tokio-rustls, rustls-pemfile, rustls-pki-types, openssl, openssl-sys]
    profiles: [full, fips]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "Downstream listener TLS via praxis-proxy-tls ServerConfig on the installed OpenSSL provider; optional WebPKI client-cert verification; cert served through ReloadableCertResolver."
  - id: T5
    name: "Outbound file_resolve file_url download TLS (SSRF-guarded sub-request)"
    owner: "praxis-ai (apis/openai/responses/file_resolve)"
    caller: "client built at apis/src/openai/responses/file_resolve/mod.rs:211 isolated_client -> apis/src/subrequest.rs:28 (install provider + SubRequestConnector); download via resolve_url.rs:386 execute_url (apis/src/subrequest.rs:178)"
    algorithm: "TLS 1.2/1.3 handshake over the SubRequestConnector rustls config on the installed OpenSSL provider; DNS/SSRF-guarded, redirect-free"
    provider: "OpenSSL via the installed rustls_openssl provider (SubRequestConnector)"
    crates: [quixotic-plecostomus-rustls-openssl, rustls, rustls-webpki, tokio-rustls, openssl, openssl-sys]
    profiles: [full, fips]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "file_url download runs over the praxis-core SubRequestConnector (Pingora HttpPeer) on the process-installed OpenSSL provider — the same connector as the other AI callouts (T3), not a reqwest client (the former reqwest/rustls-platform-verifier path was removed in #960/#1186). DNS/SSRF-guarded and redirect-free. openai-file-resolve-filter is in both the full and fips feature sets."
  - id: T7
    name: "Redis/Valkey policy session-store TLS (rediss://)"
    owner: "praxis-proxy/policy (upstream) via redis tls-rustls"
    caller: "praxis-policy-session-valkey (redis tls-rustls) via the policy engine"
    algorithm: "TLS 1.2/1.3 for rediss:// via redis tls-rustls (tokio-rustls) on the OpenSSL provider"
    provider: "OpenSSL via the installed rustls_openssl provider (redis tls-rustls / tokio-rustls)"
    crates: [tokio-rustls, rustls, rustls-webpki, rustls-native-certs, quixotic-plecostomus-rustls-openssl, openssl, openssl-sys]
    profiles: [full]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "rediss:// TLS for the policy engine's Valkey session store via redis tls-rustls (tokio-rustls) on the installed OpenSSL provider. Compiled only when the policy engine co-resolves redis with tls-rustls; policy-engine is in full but not fips."
  - id: T9
    name: "TLS handshake CSPRNG"
    owner: "quixotic-plecostomus-rustls-openssl (installed provider)"
    caller: "internal to the installed rustls provider; consumed by every handshake (T2-T7)"
    algorithm: "CSPRNG for handshake randoms and key material via the provider SecureRandom (OpenSSL RAND_bytes)"
    provider: "OpenSSL RAND via quixotic-plecostomus-rustls-openssl (rustls_openssl secure_random)"
    crates: [quixotic-plecostomus-rustls-openssl, rustls, openssl, openssl-sys]
    profiles: [full, fips]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "The installed provider's SecureRandom (OpenSSL RAND_bytes) supplies ClientHello/ServerHello randoms and TLS key material for every handshake."
  - id: C1
    name: "Upstream + sub-request server-cert chain & hostname verification"
    owner: "praxis core (pingora connector) + praxis-ai (file_resolve sub-request)"
    caller: "pingora connector in quixotic-plecostomus-core (data plane); file_resolve SubRequestClient apis/src/subrequest.rs:28 (installed OpenSSL provider)"
    algorithm: "X.509 path validation + RSA/ECDSA CertificateVerify signature check + hostname match"
    provider: "rustls-webpki (chain) + installed OpenSSL provider (signatures), for both the data plane and the file_resolve sub-request client. ring absent."
    crates: [rustls-webpki, quixotic-plecostomus-rustls-openssl, openssl]
    profiles: [full, fips]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "Upstream server-cert chain and hostname verification: rustls-webpki builds the path and the CertificateVerify signature check routes through the installed OpenSSL provider, for both the data-plane pingora connector and the file_resolve sub-request client (T5). No platform trust-store verifier runs on this path — the file_resolve client dropped its former reqwest/rustls-platform-verifier default (#960/#1186)."
  - id: C2
    name: "Downstream mTLS client-cert verification"
    owner: "praxis-proxy-tls (praxis core)"
    caller: "praxis-tls client_auth.rs:57 build_client_verifier -> reload.rs:252; from setup.rs:125"
    algorithm: "X.509 client-cert path validation + signature verification (optional CRL)"
    provider: "rustls-webpki via praxis-tls; signatures on the installed OpenSSL provider. ring absent."
    crates: [rustls-webpki, quixotic-plecostomus-rustls-openssl, openssl, openssl-sys]
    profiles: [full, fips]
    disposition: non-validated
    remediation: "docs/fips.md"
    note: "Data-plane listener mTLS: WebPkiClientVerifier path validation (hot-reloadable) with client-cert signature verification executing on the installed OpenSSL provider."
  - id: C3
    name: "Listener certificate + private-key PEM load"
    owner: "praxis-proxy-tls (praxis core)"
    caller: "praxis-tls setup/loader.rs:44 load_certified_key -> :63 load_cert_and_key"
    algorithm: "PEM->DER decode; PKCS8/PKCS1/SEC1 key parse; buffers zeroized on drop"
    provider: "rustls-pki-types (pem) + zeroize"
    crates: [rustls-pki-types, zeroize]
    profiles: [full, fips]
    disposition: n-a
    note: "Listener cert/key PEM->DER load and parse; buffers held in Zeroizing and wiped on drop. Encoding/lifecycle handling, no security-function primitive."
  - id: C4
    name: "Upstream certificate SHA-256 fingerprint (telemetry)"
    owner: "quixotic-plecostomus-rustls (upstream Pingora fork)"
    caller: "quixotic-plecostomus-rustls 0.10.0 src/lib.rs:289 hash_certificate()"
    algorithm: "SHA-256 unkeyed digest over the DER certificate (non-secret fingerprint)"
    provider: "installed CryptoProvider (OpenSSL) via quixotic-plecostomus-rustls-openssl; not ring"
    crates: [quixotic-plecostomus-rustls-openssl]
    profiles: [full, fips]
    disposition: n-a
    note: "Non-secret SHA-256 fingerprint of the DER upstream certificate for telemetry/identity, computed by the installed CryptoProvider (OpenSSL provider, not ring)."
  - id: C5
    name: "OS native trust-store load"
    owner: "praxis core / rustls-native-certs (upstream)"
    caller: "pingora load_platform_certs (via quixotic-plecostomus-rustls) and the reqwest rustls-platform-verifier Linux native-roots path"
