# Machine-readable cryptographic inventory for the Praxis AI proxy (#1220).
# This manifest is the AUTHORITATIVE source of record; the prose companion
# cryptographic-inventory.md is GENERATED from it by
# `cargo xtask check-crypto-inventory --fix` — never hand-edit the .md.
#
# The AI proxy ships two build profiles and the inventory tracks BOTH:
#   * full — the published container image (`PRAXIS_AI_FEATURES ?= full`,
#     `standard` + `openai-all` + `store-postgres`);
#   * fips — the reduced FIPS runtime, built `--no-default-features` with the
#     feature set shared from `xtask/src/fips.rs::FIPS_FEATURES`
#     (openai-responses,aws-sigv4-filter).
# Every `operations` entry and every pinned `providers` entry declares the
# `profiles:` it is resolved in.
#
# This inventory is a maintained MAP of the production cryptographic operations
# plus a thin DRIFT ALARM — deliberately not a re-implementation of Cargo's
# resolver. `cargo xtask check-crypto-inventory` (run from `make lint`) resolves
# the runtime graph of each profile once, on the host target:
#   cargo tree -p praxis-ai-proxy --edges normal \
#     --no-default-features --features <profile> --prefix none --format '{p}|{f}'
# The published image (full) is a superset of the FIPS runtime (fips ⊆ full) and
# the crypto-relevant crate set is host-independent EXCEPT the OS trust-store
# backends (schannel on Windows, security-framework[-sys] on macOS), which are
# exempt from the resolution/drift checks so a Linux CI host still validates the
# macOS/Windows declarations. The check fails if:
#   * a crate whose name matches `watch_tokens`, or is named exactly on Red Hat's
#     FIPS denylist (`xtask/src/fips/graph.rs::DENIED`), enters a profile's
#     runtime graph but is referenced by no operation and is not in `allow`
#                                                       (undeclared crypto);
#   * an `allow` entry names a FIPS-denylisted crate (a denied name is a real
#     primitive — track it as an operation, not an exception), duplicates an
#     operation crate, or is absent from every resolved graph (stale);
#   * a `providers:` entry drifts: wrong version, a missing `require_features`,
#     or a present `forbid_features` — unlisted extra features are allowed by
#     design                                            (provider drift);
#   * an operation is incompletely specified, references a crate absent from a
#     profile it declares, or carries a non-compliant disposition
#     (non-validated/needs-remediation) without a remediation reference;
#   * a FIPS-required operation (T1, A3, A4, A12) is missing or drops its `fips`
#     profile declaration                               (FIPS capability);
#   * a crate on the FIPS denylist appears in the `fips` graph (FIPS denylist).
#
# `watch_tokens` are matched against each crate name after splitting on '-' and
# '_' and stripping trailing digits from each part (so `sha2` -> `sha`,
# `md-5` -> `md`, `chacha20` -> `chacha`). Tokens with no current match are kept
# to catch future crypto crates.

watch_tokens:
  - sha
  - sha1
  - sha2
  - sha3
  - md
  - md5
  - hmac
  - hkdf
  - blake
  - ring
  - aes
  - rsa
  - dsa
  - ecdsa
  - ecdh
  - ed25519
