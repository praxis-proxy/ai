[package]
name = "praxis-ai-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "AI-native proxy server built on Praxis"
license.workspace = true
repository.workspace = true
readme = "../README.md"
publish = false

[package.metadata.cargo-machete]
ignored = ["cargo_metadata"]

[lib]
name = "praxis_ai"
path = "src/lib.rs"

[[bin]]
name = "praxis-ai"
path = "src/main.rs"

[features]
default = ["standard", "full"]
# Default-on filters that sit behind a gate so minimal builds can drop them.
standard = ["aws-sigv4-filter"]
# aws_sigv4_sign: AWS Signature V4 request signing.
aws-sigv4-filter = ["praxis-ai-filters/aws-sigv4-filter"]
# Opt-in OpenAI filter groups (see praxis-ai-apis for what each one contains).
openai-responses = ["praxis-ai-filters/openai-responses"]
openai-file-resolve-filter = ["openai-responses", "praxis-ai-filters/openai-file-resolve-filter"]
# Response store support; installs the response store pipeline extension.
store = ["openai-responses", "praxis-ai-filters/store", "praxis-ai-apis/store"]
store-postgres = ["store", "praxis-ai-filters/store-postgres", "praxis-ai-apis/store-postgres"]
store-sqlite = ["store", "praxis-ai-filters/store-sqlite", "praxis-ai-apis/store-sqlite"]
store-all = ["store-postgres", "store-sqlite"]
openai-conversations = ["store", "praxis-ai-filters/openai-conversations"]
openai-compact = ["store", "praxis-ai-filters/openai-compact"]
openai-mcp-tools = ["store", "praxis-ai-filters/openai-mcp-tools"]
# Every OpenAI group, without choosing a store backend.
openai-all = ["openai-file-resolve-filter", "openai-conversations", "openai-compact", "openai-mcp-tools"]
# Every non-experimental filter; equals the pre-feature-split capability.
full = ["standard", "openai-all", "store-postgres"]
# Experimental: the generic http_callout filter (see praxis-ai-filters).
http-callout-filter = ["praxis-ai-filters/http-callout-filter", "experimental"]
# Experimental: the azure_ad (Entra ID) auth filter (see praxis-ai-filters).
azure-ad-filter = ["praxis-ai-filters/azure-ad-filter", "experimental"]
# Experimental: the gcp_adc (GCP ADC) auth filter (see praxis-ai-filters).
gcp-adc-filter = ["praxis-ai-filters/gcp-adc-filter", "experimental"]
# Experimental: the released Praxis Basic Auth filter, which publishes
# AuthenticatedIdentity for downstream filters.
basic-auth-filter = ["praxis-filter/basic-auth-filter", "experimental"]
# Experimental: the token_rate_limit filter (see praxis-ai-filters).
token-rate-limit-filter = ["praxis-ai-filters/token-rate-limit-filter", "experimental"]
# Marker feature activated transitively by any experimental feature.
experimental = ["praxis-ai-filters/experimental"]
opentelemetry = ["praxis-ai-filters/opentelemetry"]
llmd-ext-proc = ["dep:praxis-ai-llmd-ext-proc"]
praxis-main = ["praxis-ai-filters/praxis-main", "praxis-ai-apis/praxis-main"]

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
notify = { workspace = true }
praxis-ai-filters = { workspace = true }
praxis-ai-apis = { workspace = true }
praxis-ai-llmd-ext-proc = { workspace = true, optional = true }
praxis-core = { workspace = true }
# spiffe: enables the peer_identity_trust security builtin, required as the first
# filter of every provider_route chain (and by the shipped provider-route.yaml
# example). Off-by-default experimental feature in praxis 0.6.0 (no extra deps).
praxis-filter = { workspace = true, features = ["spiffe"] }
praxis-protocol = { workspace = true, features = ["admin-api", "config-reload"] }
praxis-tls = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
tikv-jemallocator = { workspace = true }

[build-dependencies]
cargo_metadata = { workspace = true }
praxis-ai-build-support = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
http = { workspace = true }
pingora-core = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
